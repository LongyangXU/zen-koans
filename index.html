<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>禅·境 — 禅宗公案数字藏经阁</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
:root {
  --ink-black: #08080c;
  --ink-deep: #0d0d14;
  --ink-card: #13131f;
  --ink-border: #1e1e32;
  --gold: #c9a84c;
  --gold-dim: #8b7340;
  --gold-bright: #e8c860;
  --cyan: #5eead4;
  --cyan-dim: #0d9488;
  --text-primary: #e0ddd5;
  --text-secondary: #9a9790;
  --text-dim: #5c5a55;
  --font-display: 'Noto Serif SC', 'Ma Shan Zheng', serif;
  --font-body: 'Noto Sans SC', sans-serif;
  --font-latin: 'Cormorant Garamond', serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--ink-black); color: var(--text-primary);
  font-family: var(--font-body); overflow-x: hidden; line-height: 1.7;
}

#inkCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0.35; }

.particle {
  position: fixed; pointer-events: none; z-index: 1;
  font-family: var(--font-display); color: var(--gold-dim); opacity: 0;
  animation: floatUp 15s linear infinite;
}
@keyframes floatUp {
  0% { opacity: 0; transform: translateY(100vh) rotate(0deg); }
  10% { opacity: 0.5; } 90% { opacity: 0.2; }
  100% { opacity: 0; transform: translateY(-10vh) rotate(360deg); }
}

.main-container { position: relative; z-index: 10; max-width: 1100px; margin: 0 auto; padding: 0 24px; }

.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(8,8,12,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--ink-border); padding: 0 24px; }
.nav-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 56px; }
.nav-logo { font-family: var(--font-display); font-size: 22px; font-weight: 900; color: var(--gold); letter-spacing: 4px; text-decoration: none; cursor: pointer; display: flex; align-items: center; gap: 8px; }
.nav-logo .dot { width: 6px; height: 6px; background: var(--cyan); border-radius: 50%; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 0.4; box-shadow: 0 0 4px var(--cyan); } 50% { opacity: 1; box-shadow: 0 0 12px var(--cyan); } }
.nav-links { display: flex; gap: 24px; align-items: center; }
.nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 13px; font-weight: 500; letter-spacing: 2px; transition: color 0.3s; cursor: pointer; position: relative; }
.nav-links a:hover { color: var(--gold); }
.nav-links a::after { content: ''; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%); width: 0; height: 1px; background: var(--gold); transition: width 0.3s; }
.nav-links a:hover::after { width: 100%; }

.hero { padding: 150px 0 60px; text-align: center; position: relative; }
.hero-badge { display: inline-block; padding: 6px 16px; border: 1px solid var(--gold-dim); border-radius: 20px; font-size: 11px; letter-spacing: 3px; color: var(--gold); margin-bottom: 28px; font-weight: 500; }
.hero h1 { font-family: var(--font-display); font-size: clamp(48px, 8vw, 80px); font-weight: 900; color: var(--text-primary); letter-spacing: 8px; margin-bottom: 12px; line-height: 1.2; }
.hero h1 .accent { color: var(--gold); }
.hero-subtitle { font-size: 15px; color: var(--text-secondary); letter-spacing: 6px; font-weight: 300; margin-bottom: 48px; }

.daily-card { background: linear-gradient(135deg, rgba(201,168,76,0.08), rgba(94,234,212,0.04)); border: 1px solid var(--gold-dim); border-radius: 16px; padding: 48px 40px; margin-bottom: 56px; position: relative; overflow: hidden; transition: all 0.4s; cursor: pointer; }
.daily-card:hover { border-color: var(--gold); box-shadow: 0 0 60px rgba(201,168,76,0.1), inset 0 0 60px rgba(201,168,76,0.03); }
.daily-card::before { content: ''; position: absolute; top: -50%; right: -50%; width: 200px; height: 200px; background: radial-gradient(circle, rgba(94,234,212,0.08), transparent); pointer-events: none; }
.daily-label { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; justify-content: center; }
.daily-label .icon { width: 8px; height: 8px; background: var(--cyan); border-radius: 50%; animation: pulse 2s ease-in-out infinite; }
.daily-label span { font-size: 12px; letter-spacing: 4px; color: var(--cyan); font-weight: 500; }
.daily-card h2 { font-family: var(--font-display); font-size: clamp(26px, 5vw, 40px); font-weight: 700; color: var(--gold-bright); margin-bottom: 20px; letter-spacing: 3px; text-align: center; }
.daily-card .daily-story { font-size: 15px; color: var(--text-secondary); line-height: 1.9; max-width: 650px; margin: 0 auto; text-align: center; }
.daily-card .daily-meta { display: flex; gap: 14px; justify-content: center; margin-top: 28px; flex-wrap: wrap; }
.daily-tag { padding: 4px 14px; border: 1px solid var(--ink-border); border-radius: 12px; font-size: 11px; color: var(--text-secondary); letter-spacing: 1px; }
.daily-tag.gold { border-color: var(--gold-dim); color: var(--gold); }

.search-section { margin-bottom: 32px; }
.search-wrapper { position: relative; max-width: 600px; margin: 0 auto; }
.search-input { width: 100%; padding: 15px 48px 15px 20px; background: var(--ink-card); border: 1px solid var(--ink-border); border-radius: 12px; color: var(--text-primary); font-size: 15px; font-family: var(--font-body); letter-spacing: 1px; transition: all 0.3s; outline: none; }
.search-input:focus { border-color: var(--gold-dim); box-shadow: 0 0 30px rgba(201,168,76,0.08); }
.search-input::placeholder { color: var(--text-dim); }
.search-icon { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 18px; pointer-events: none; }

.filter-section { margin-bottom: 28px; }
.filter-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
.filter-btn { padding: 7px 18px; background: transparent; border: 1px solid var(--ink-border); border-radius: 20px; color: var(--text-secondary); cursor: pointer; font-size: 13px; font-family: var(--font-body); letter-spacing: 1px; transition: all 0.3s; white-space: nowrap; }
.filter-btn:hover { border-color: var(--gold-dim); color: var(--text-primary); }
.filter-btn.active { background: rgba(201,168,76,0.12); border-color: var(--gold); color: var(--gold); }
.score-btn { width: 34px; height: 34px; border-radius: 50%; background: transparent; border: 1px solid var(--ink-border); color: var(--text-dim); cursor: pointer; font-size: 13px; font-family: var(--font-latin); transition: all 0.3s; display: flex; align-items: center; justify-content: center; }
.score-btn:hover { border-color: var(--cyan-dim); color: var(--cyan); }
.score-btn.active { background: rgba(94,234,212,0.12); border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 12px rgba(94,234,212,0.15); }

.results-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
.results-count { font-size: 12px; color: var(--text-dim); letter-spacing: 2px; }

.koans-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 18px; margin-bottom: 80px; }
.koan-card { background: var(--ink-card); border: 1px solid var(--ink-border); border-radius: 12px; padding: 26px 22px; cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden; }
.koan-card:hover { border-color: var(--gold-dim); transform: translateY(-2px); box-shadow: 0 8px 40px rgba(0,0,0,0.4); }
.koan-card::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, var(--gold-dim), transparent); opacity: 0; transition: opacity 0.3s; }
.koan-card:hover::after { opacity: 1; }
.koan-card .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 8px; }
.koan-card .card-num { font-family: var(--font-latin); font-size: 13px; color: var(--text-dim); white-space: nowrap; }
.koan-card .card-score { display: flex; gap: 2px; }
.koan-card .score-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-border); }
.koan-card .score-dot.filled { background: var(--gold-dim); }
.koan-card .score-dot.filled.high { background: var(--cyan-dim); }
.koan-card h3 { font-family: var(--font-display); font-size: 18px; font-weight: 600; color: var(--text-primary); margin-bottom: 10px; letter-spacing: 2px; }
.koan-card .card-story { font-size: 13px; color: var(--text-secondary); line-height: 1.8; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.koan-card .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; flex-wrap: wrap; gap: 8px; }
.koan-card .card-collection { font-size: 11px; color: var(--text-dim); letter-spacing: 2px; }
.koan-card .card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.koan-card .card-tags .mini-tag { font-size: 10px; padding: 2px 8px; border: 1px solid var(--ink-border); border-radius: 8px; color: var(--text-dim); letter-spacing: 1px; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 24px; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal { background: var(--ink-deep); border: 1px solid var(--ink-border); border-radius: 20px; max-width: 680px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 48px 44px; position: relative; animation: slideUp 0.4s ease; }
@keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
.modal-close { position: absolute; top: 18px; right: 22px; background: none; border: none; color: var(--text-dim); font-size: 22px; cursor: pointer; transition: color 0.3s; font-family: var(--font-latin); line-height: 1; }
.modal-close:hover { color: var(--text-primary); }
.modal .modal-collection { font-size: 12px; letter-spacing: 3px; color: var(--gold); margin-bottom: 8px; }
.modal h2 { font-family: var(--font-display); font-size: 32px; font-weight: 700; color: var(--gold-bright); margin-bottom: 4px; letter-spacing: 4px; }
.modal .modal-source { font-size: 13px; color: var(--text-dim); margin-bottom: 24px; letter-spacing: 1px; }
.modal .modal-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 32px; }
.modal .modal-tags .tag { padding: 4px 14px; border: 1px solid var(--ink-border); border-radius: 12px; font-size: 11px; color: var(--text-dim); letter-spacing: 1px; cursor: pointer; transition: all 0.3s; }
.modal .modal-tags .tag:hover { border-color: var(--gold-dim); color: var(--gold); }

.section-label { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.section-label .bar { width: 4px; height: 16px; border-radius: 2px; }
.section-label .bar.original { background: var(--gold); }
.section-label .bar.translation { background: var(--cyan); }
.section-label .bar.story { background: var(--gold-dim); opacity: 0.7; }
.section-label .bar.meaning { background: var(--cyan-dim); opacity: 0.7; }
.section-label span { font-size: 11px; letter-spacing: 3px; font-weight: 500; }
.section-label.original span { color: var(--gold); }
.section-label.translation span { color: var(--cyan); }
.section-label.story span { color: var(--gold-dim); }
.section-label.meaning span { color: var(--cyan-dim); }

.modal .original-text { font-family: var(--font-display); font-size: 17px; color: var(--text-primary); line-height: 2.3; letter-spacing: 1px; padding: 24px; background: rgba(201,168,76,0.04); border-left: 2px solid var(--gold-dim); border-radius: 0 10px 10px 0; margin-bottom: 32px; }
.modal .translation-text { font-size: 15px; color: var(--text-secondary); line-height: 2.1; padding: 20px 24px; background: rgba(94,234,212,0.03); border-left: 2px solid rgba(94,234,212,0.3); border-radius: 0 10px 10px 0; margin-bottom: 32px; }
.modal .content-divider { display: flex; align-items: center; gap: 16px; margin: 36px 0 28px; opacity: 0.3; }
.modal .content-divider .line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-dim), transparent); }
.modal .content-divider .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--gold-dim); }
.modal .story-text { font-size: 15px; color: var(--text-secondary); line-height: 2.1; padding: 0 0 28px 0; }
.modal .meaning-text { font-size: 15px; color: var(--text-secondary); line-height: 2.1; padding: 0 0 8px 0; }
.modal .modal-score { display: flex; align-items: center; gap: 10px; margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--ink-border); }
.modal .modal-score .dots { display: flex; gap: 4px; }
.modal .modal-score .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ink-border); }
.modal .modal-score .dot.filled { background: var(--gold-dim); }

.footer { text-align: center; padding: 60px 0; border-top: 1px solid var(--ink-border); margin-top: 40px; }
.footer p { font-size: 12px; color: var(--text-dim); letter-spacing: 3px; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--ink-black); }
::-webkit-scrollbar-thumb { background: var(--ink-border); border-radius: 2px; }

.toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: var(--ink-card); border: 1px solid var(--gold-dim); color: var(--gold); padding: 12px 28px; border-radius: 20px; font-size: 13px; letter-spacing: 2px; z-index: 300; animation: toastIn 0.4s ease, toastOut 0.4s ease 1.6s forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
@keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

@media (max-width: 768px) {
  .hero { padding: 110px 0 40px; } .hero h1 { letter-spacing: 4px; }
  .koans-grid { grid-template-columns: 1fr; } .nav-links { gap: 14px; }
  .nav-links a { font-size: 12px; letter-spacing: 1px; }
  .daily-card { padding: 28px 18px; } .modal { padding: 32px 22px; } .modal h2 { font-size: 26px; }
}
</style>
</head>

<script>
var KOANS = [{"id": "wumenguan-1", "collection": "无门关", "collectionId": "wumenguan", "number": 1, "title": "赵州狗子", "original": "赵州和尚因僧问：“狗子还有佛性也无？”州云：“无。”", "translation": "有一位僧人问赵州和尚：“狗有没有佛性？”赵州回答：“没有。”", "story": "僧人按佛教常识追问佛性，赵州却只用一个“无”字截断有无分别。", "meaning": "“无”不是普通否定，而是禅门第一关，用来破除概念化理解。", "source": "《无门关》第1则；亦见《从容录》第18则系统。", "tags": ["无门关", "赵州", "佛性", "无字关", "话头", "破除分别", "高传播"], "score": 5}, {"id": "wumenguan-2", "collection": "无门关", "collectionId": "wumenguan", "number": 2, "title": "百丈野狐", "original": "百丈和尚凡参次，有一老人常随众听法。一日众退，老人不去。丈乃问：\n“立者何人？”老人云：“某甲非人也。于过去迦叶佛时曾住此山，因学人问：‘大修\n禅宗公案大全：无门关卷（48则完整版）\n1\n行底人还落因果也无？’某甲对云：‘不落因果。’五百生堕野狐身。今请和尚代一转\n语。”丈云：“不昧因果。”", "translation": "百丈和尚每次上堂说法时，有一位老人常跟众人一起听法。有一天众人退\n下后，老人没有离开。百丈问他：“站着的是谁？”老人说：“我不是人。过去迦叶\n佛时代，我曾住在这座山上，有学人问我：‘大修行的人还会落入因果吗？’我回\n答：‘不落因果。’因此五百世堕为野狐。现在请和尚替我说一句转语。”百丈说：“不\n是不落因果，而是不昧因果。”", "story": "老人因一句“不落因果”堕为野狐，百丈以“不昧因果”令其解脱。", "meaning": "禅不是否定因果，而是在因果中清醒，不被因果迷惑。", "source": "《无门关》第2则；亦见《从容录》第8则。", "tags": ["无门关", "百丈", "因果", "野狐禅", "不昧因果", "高传播"], "score": 5}, {"id": "wumenguan-3", "collection": "无门关", "collectionId": "wumenguan", "number": 3, "title": "俱胝竖指", "original": "俱胝和尚，凡有所问，只竖一指。后有童子，因外人问：“和尚说何法要？”\n童子亦竖指头。胝闻，遂以刃断其指。童子负痛号哭而去，胝复召之。童子回\n首，胝却竖起指，童子忽然领悟。", "translation": "俱胝和尚凡是有人问法，只竖起一根手指。后来有一个童子，外人问他：\n“你们和尚说什么法要？”童子也学着竖起手指。俱胝听说后，就用刀斩断他的手\n指。童子痛哭着跑走，俱胝又叫他。童子回头时，俱胝再次竖起手指，童子忽然\n领悟。", "story": "童子模仿俱胝竖指，被俱胝断指后，回头见一指而悟。", "meaning": "禅机不在手指形式，形式被打破后，才可能见到活的法。", "source": "《无门关》第3则；亦见《从容录》第84则相关。", "tags": ["无门关", "俱胝", "一指禅", "破相", "断执", "师徒机锋"], "score": 4}, {"id": "wumenguan-4", "collection": "无门关", "collectionId": "wumenguan", "number": 4, "title": "胡子无须", "original": "或庵曰：“西天胡子，因甚无须？”", "translation": "或庵说：“从西天来的胡人，为什么没有胡须？”", "story": "问题表面问达磨形象，实际逼人离开外貌和概念判断。\n禅宗公案大全：无门关卷（48则完整版）\n2", "meaning": "若只在形象上识祖师，永远隔着一层。", "source": "《无门关》第4则。", "tags": ["无门关", "达磨", "形相", "祖师意", "离相"], "score": 3}, {"id": "wumenguan-5", "collection": "无门关", "collectionId": "wumenguan", "number": 5, "title": "香严上树", "original": "香严和尚云：“如人上树，口衔树枝，手不攀枝，脚不踏树，树下有人问西\n来意。不对，即违他所问；若对，又丧身失命。正恁么时，作么生对？”", "translation": "香严和尚说：“就像一个人爬到树上，口里咬着树枝，手不能攀枝，脚也踩\n不到树。树下有人问他祖师西来的意思。如果不回答，就辜负了别人的提问；如\n果回答，又会掉下来丧命。正在这种时候，该怎样回答？”", "story": "香严设下一个语言与生死两难的险境。", "meaning": "当语言不能用、沉默也不行时，真正的关口才显现。", "source": "《无门关》第5则。", "tags": ["无门关", "香严", "祖师西来意", "语言困境", "生死关口", "高传播"], "score": 5}, {"id": "wumenguan-6", "collection": "无门关", "collectionId": "wumenguan", "number": 6, "title": "世尊拈花", "original": "世尊昔在灵山会上，拈花示众。是时众皆默然，惟迦叶尊者破颜微笑。世\n尊云：“吾有正法眼藏，涅槃妙心，实相无相，微妙法门，不立文字，教外别传，\n付嘱摩诃迦叶。”", "translation": "从前世尊在灵山会上，拿起一枝花给大众看。当时大众都沉默不明白，只\n有迦叶尊者露出微笑。世尊说：“我有正法眼藏、涅槃妙心、实相无相的微妙法\n门，不依文字，在教法之外特别传授，现在付嘱给摩诃迦叶。”", "story": "世尊拈花不语，迦叶微笑相应，成为禅宗传法源头叙事。", "meaning": "禅宗强调不立文字、教外别传、以心传心。", "source": "《无门关》第6则；禅宗传灯传统。", "tags": ["无门关", "释迦", "迦叶", "拈花微笑", "以心传心", "禅宗源头", "高传播"], "score": 5}, {"id": "wumenguan-7", "collection": "无门关", "collectionId": "wumenguan", "number": 7, "title": "赵州洗钵", "original": "赵州因僧问：“乞师指示。”州云：“吃粥了也未？”僧云：“吃粥了也。”州云：\n“洗钵盂去。”其僧有省。", "translation": "有僧人对赵州说：“请师父指示。”赵州问：“你吃过粥了吗？”僧人说：“吃过\n了。”赵州说：“那就去洗碗吧。”这位僧人因此有所省悟。", "story": "求指示的僧人被赵州带回吃饭洗碗的日用处。", "meaning": "修行不离日常，吃完饭洗碗就是当下入处。", "source": "《无门关》第7则；亦见《从容录》第39则。", "tags": ["无门关", "赵州", "洗钵", "日用即道", "平常心", "高传播"], "score": 5}, {"id": "wumenguan-8", "collection": "无门关", "collectionId": "wumenguan", "number": 8, "title": "奚仲造车", "original": "月庵和尚问僧：“奚仲造车一百辐，拈却两头，去却轴，明甚么边事？”", "translation": "月庵和尚问僧人：“奚仲造车，一百根车辐。如果把两头拿掉，把车轴去\n掉，还能说明什么事？”", "story": "车的结构被拆除后，问题转向运作根本。", "meaning": "当名称、结构、功能都被拆开后，还剩下什么？", "source": "《无门关》第8则。", "tags": ["无门关", "月庵", "奚仲造车", "结构", "本质追问"], "score": 2}, {"id": "wumenguan-9", "collection": "无门关", "collectionId": "wumenguan", "number": 9, "title": "大通智胜", "original": "兴阳让和尚因僧问：“大通智胜佛，十劫坐道场，佛法不现前，不得成佛道\n时如何？”让曰：“其问甚谛当。”僧曰：“既是坐道场，为甚么不得成佛道？”让曰：\n“为伊不成佛。”", "translation": "有僧人问兴阳让和尚：“大通智胜佛十劫坐在道场中，佛法却不显现，不能\n成佛，这是为什么？”兴阳让说：“你这个问题问得很恰当。”僧人又问：“既然已经\n坐在道场中，为什么不能成佛？”兴阳让说：“因为他不成佛。”", "story": "长久坐道场仍不得成佛，兴阳让以“不成佛”截断成佛执著。", "meaning": "坐得久不等于悟；执著成佛反成障碍。", "source": "《无门关》第9则。\n禅宗公案大全：无门关卷（48则完整版）\n4", "tags": ["无门关", "兴阳让", "成佛", "坐道场", "破除目标执著"], "score": 3}, {"id": "wumenguan-10", "collection": "无门关", "collectionId": "wumenguan", "number": 10, "title": "清税孤贫", "original": "曹山和尚因僧清税问：“清税孤贫，乞师赈济。”山云：“税阇梨！”税应诺。\n山曰：“青原白家酒，三盏吃了，犹道未沾唇。”", "translation": "僧人清税对曹山说：“清税孤独贫穷，请师父救济。”曹山叫：“税阇梨！”清\n税答应。曹山说：“青原白家的酒，已经喝了三杯，却还说没有沾到嘴唇。”", "story": "清税自称贫乏，曹山一声呼唤使他显出现成处。", "meaning": "人常说自己缺少，却不知最根本的东西早已现成。", "source": "《无门关》第10则。", "tags": ["无门关", "曹山", "清税", "孤贫", "现成", "自性"], "score": 3}, {"id": "wumenguan-11", "collection": "无门关", "collectionId": "wumenguan", "number": 11, "title": "州勘庵主", "original": "赵州到一庵主处问：“有么？有么？”主竖起拳头。州云：“水浅不是泊船\n处。”便行。又到一庵主处问：“有么？有么？”主亦竖起拳头。州云：“能纵能夺，\n能杀能活。”便作礼。", "translation": "赵州到一位庵主那里问：“有吗？有吗？”庵主竖起拳头。赵州说：“水太\n浅，不是停船的地方。”说完就走。又到另一位庵主那里，同样问：“有吗？有吗？”\n那位庵主也竖起拳头。赵州却说：“能放能夺，能杀能活。”于是向他作礼。", "story": "两人都竖拳，赵州却作出完全不同的判断。", "meaning": "同一动作在不同人身上意义不同，禅机要看当机处。", "source": "《无门关》第11则。", "tags": ["无门关", "赵州", "庵主", "竖拳", "勘验", "当机"], "score": 3}, {"id": "wumenguan-12", "collection": "无门关", "collectionId": "wumenguan", "number": 12, "title": "岩唤主人", "original": "瑞岩彦和尚每日自唤：“主人公！”复自应诺：“喏！”乃云：“惺惺著！他时\n异日，莫受人瞒！”“喏！喏！”\n禅宗公案大全：无门关卷（48则完整版）\n5", "translation": "瑞岩彦和尚每天自己叫自己：“主人公！”又自己回答：“在！”然后说：“要\n清醒着！以后不要被别人欺瞒！”又自己回答：“是！是！”", "story": "瑞岩每天自问自答，提醒自己清醒不受蒙蔽。", "meaning": "修行首先是把自己叫醒，不被外境和习气牵走。", "source": "《无门关》第12则。", "tags": ["无门关", "瑞岩", "主人公", "自我唤醒", "觉察", "高传播"], "score": 5}, {"id": "wumenguan-13", "collection": "无门关", "collectionId": "wumenguan", "number": 13, "title": "德山托钵", "original": "德山一日托钵下堂，见雪峰。峰问：“钟未鸣，鼓未响，托钵向甚处去？”山\n便回方丈。峰举似岩头。头云：“大小德山，未会末后句在。”", "translation": "有一天德山拿着钵下堂，遇见雪峰。雪峰问：“钟还没响，鼓也没响，你拿\n着钵要去哪里？”德山便回方丈。雪峰把这事告诉岩头。岩头说：“堂堂德山，还没\n有明白最后一句。”", "story": "德山惯性托钵被雪峰一句话截断，又被岩头评为未到。", "meaning": "日常动作被问住时，人才可能照见自己的惯性。", "source": "《无门关》第13则。", "tags": ["无门关", "德山", "雪峰", "岩头", "托钵", "末后句"], "score": 4}, {"id": "wumenguan-14", "collection": "无门关", "collectionId": "wumenguan", "number": 14, "title": "南泉斩猫", "original": "南泉和尚因东西堂争猫儿，泉乃提起云：“大众道得即救，道不得即斩却\n也。”众无对。泉遂斩之。晚赵州外归，泉举似州。州乃脱履安头上而出。泉云：\n“子若在，即救得猫儿。”", "translation": "南泉和尚因为东西两堂僧人争夺一只猫，就把猫提起来说：“大家说得出一\n句就救它，说不出就斩了它。”众人都答不上来。南泉于是斩了猫。晚上赵州从外\n面回来，南泉把这件事告诉他。赵州脱下鞋放在头上走出去。南泉说：“你若当时\n在，就能救得这只猫。”", "story": "众人为猫争执，南泉以猫为关口逼众人出语；赵州以反常动作回应。", "meaning": "争执中最先被遗忘的往往是生命本身；赵州的动作跳出了对错框架。", "source": "《无门关》第14则；亦见《从容录》第9则。\n禅宗公案大全：无门关卷（48则完整版）\n6", "tags": ["无门关", "南泉", "赵州", "斩猫", "争执", "生命", "高传播"], "score": 5}, {"id": "wumenguan-15", "collection": "无门关", "collectionId": "wumenguan", "number": 15, "title": "洞山三顿", "original": "洞山到云门。门问：“近离甚处？”山云：“查渡。”门云：“夏在甚处？”山\n云：“湖南报慈。”门云：“几时离彼？”山云：“八月二十五。”门云：“放汝三顿棒。”\n明日，山却上问讯：“昨日蒙和尚放三顿棒，不知过在甚么处？”门云：“饭袋子，\n江西湖南便恁么去！”山于言下大悟。", "translation": "洞山来到云门处。云门问：“最近从哪里来？”洞山说：“查渡。”云门问：“夏\n天在哪里？”洞山说：“湖南报慈。”云门问：“什么时候离开的？”洞山说：“八月二\n十五。”云门说：“先放你三顿棒。”第二天洞山又来问：“昨天承蒙和尚放我三顿棒，\n不知道我的过错在哪里？”云门说：“饭袋子！江西湖南就这样到处跑！”洞山在这\n句话下大悟。", "story": "洞山被云门骂“饭袋子”，在被打断行脚惯性处悟入。", "meaning": "棒喝不是惩罚，而是逼人从自以为懂的状态里醒来。", "source": "《无门关》第15则。", "tags": ["无门关", "洞山", "云门", "棒喝", "行脚", "大悟"], "score": 4}, {"id": "wumenguan-16", "collection": "无门关", "collectionId": "wumenguan", "number": 16, "title": "钟声七条", "original": "云门曰：“世界恁么广阔，因甚向钟声里披七条？”", "translation": "云门说：“世界这样广阔，为什么却在钟声里披上七条袈裟？”", "story": "云门把钟声、袈裟和世界广阔并置，拷问日常仪式背后的用心。", "meaning": "人在仪式中行动，却常不知道自己为何行动。", "source": "《无门关》第16则。", "tags": ["无门关", "云门", "钟声", "七条袈裟", "仪式", "日常觉察"], "score": 2}, {"id": "wumenguan-17", "collection": "无门关", "collectionId": "wumenguan", "number": 17, "title": "国师三唤", "original": "国师三唤侍者。侍者三应。国师云：“将谓吾辜负汝，元来却是汝辜负吾。”\n禅宗公案大全：无门关卷（48则完整版）\n7", "translation": "国师三次呼唤侍者，侍者三次答应。国师说：“我还以为是我辜负了你，原\n来却是你辜负了我。”", "story": "侍者虽三次应答，却被国师指出并未真正相应。", "meaning": "听见声音不等于真正领会，表面回应不代表心醒。", "source": "《无门关》第17则。", "tags": ["无门关", "国师", "侍者", "应答", "相应", "觉察"], "score": 3}, {"id": "wumenguan-18", "collection": "无门关", "collectionId": "wumenguan", "number": 18, "title": "洞山三斤", "original": "洞山和尚因僧问：“如何是佛？”山云：“麻三斤。”", "translation": "有僧人问洞山和尚：“什么是佛？”洞山回答：“三斤麻。”", "story": "高远的佛理问题，被洞山落到眼前具体物和重量上。", "meaning": "佛不在抽象概念里，也不离眼前一物。", "source": "《无门关》第18则；《碧岩录》第12则。", "tags": ["无门关", "洞山", "麻三斤", "佛", "日常物", "高传播"], "score": 5}, {"id": "wumenguan-19", "collection": "无门关", "collectionId": "wumenguan", "number": 19, "title": "平常是道", "original": "南泉因赵州问：“如何是道？”泉云：“平常心是道。”州云：“还可趣向否？”\n泉云：“拟向即乖。”", "translation": "赵州问南泉：“什么是道？”南泉说：“平常心就是道。”赵州问：“可以朝它努\n力趋向吗？”南泉说：“一想趋向，就已经违背了。”", "story": "南泉以“平常心是道”回答赵州，又指出刻意追逐便错。", "meaning": "道不在造作追求中，而在不攀缘、不分别的平常心中。", "source": "《无门关》第19则。", "tags": ["无门关", "南泉", "赵州", "平常心", "道", "高传播"], "score": 5}, {"id": "wumenguan-20", "collection": "无门关", "collectionId": "wumenguan", "number": 20, "title": "大力量人", "original": "松源和尚云：“大力量人，因甚抬脚不起？”又云：“开口不在舌头上。”\n禅宗公案大全：无门关卷（48则完整版）\n8", "translation": "松源和尚说：“有大力量的人，为什么抬不起脚？”又说：“开口说话并不在\n舌头上。”", "story": "松源用“大力量人抬脚不起”和“开口不在舌头上”发问。", "meaning": "真正的大力不是外在用力，而是不被身心语言习惯束缚。", "source": "《无门关》第20则。", "tags": ["无门关", "松源", "大力量人", "语言", "身体", "自在"], "score": 3}, {"id": "wumenguan-21", "collection": "无门关", "collectionId": "wumenguan", "number": 21, "title": "云门屎橛", "original": "云门因僧问：“如何是佛？”门云：“干屎橛。”", "translation": "有僧人问云门：“什么是佛？”云门回答：“干屎橛。”", "story": "云门用粗粝刺耳的回答击碎学人对佛的庄严想象。", "meaning": "若把佛只放在清净神圣的概念里，就又造了一个偶像。", "source": "《无门关》第21则。", "tags": ["无门关", "云门", "干屎橛", "佛", "破圣洁相", "高传播"], "score": 5}, {"id": "wumenguan-22", "collection": "无门关", "collectionId": "wumenguan", "number": 22, "title": "迦叶刹竿", "original": "迦叶因阿难问：“世尊传金襕袈裟外，别传何物？”叶唤云：“阿难！”难应\n诺。叶云：“倒却门前刹竿著。”", "translation": "阿难问迦叶：“世尊除了传金襕袈裟之外，还另外传了什么？”迦叶叫：“阿\n难！”阿难答应。迦叶说：“把门前的刹竿倒下来。”", "story": "阿难追问传法内容，迦叶以一呼一应和倒刹竿回应。", "meaning": "传法不在物件，也不在秘密答案，而在当下一机。", "source": "《无门关》第22则。", "tags": ["无门关", "迦叶", "阿难", "传法", "刹竿", "一呼一应"], "score": 3}, {"id": "wumenguan-23", "collection": "无门关", "collectionId": "wumenguan", "number": 23, "title": "不思善恶", "original": "六祖因明上座追至大庾岭，祖云：“不思善，不思恶，正与么时，那个是明\n上座本来面目？”", "translation": "惠明上座追到大庾岭，六祖说：“不要想善，也不要想恶，正在这个时候，\n哪一个是明上座的本来面目？”", "story": "六祖让惠明在善恶分别暂歇处回看本来面目。", "meaning": "当标签和分别放下时，人得以回看未被遮蔽的自己。", "source": "《无门关》第23则；《六祖坛经》系统。", "tags": ["无门关", "六祖", "惠明", "本来面目", "不思善恶", "高传播"], "score": 5}, {"id": "wumenguan-24", "collection": "无门关", "collectionId": "wumenguan", "number": 24, "title": "离却语言", "original": "风穴和尚因僧问：“语默涉离微，如何通不犯？”穴云：“长忆江南三月里，\n鹧鸪啼处百花香。”", "translation": "有僧人问风穴和尚：“说话和沉默都会涉及细微过失，怎样才能通达而不\n犯？”风穴说：“常常想起江南三月，鹧鸪啼叫处，百花飘香。”", "story": "风穴不用逻辑解释，而以诗意境界回应语言困境。", "meaning": "有些回答不是解释，而是直接呈现一个境界。", "source": "《无门关》第24则。", "tags": ["无门关", "风穴", "语言", "沉默", "诗意", "境界"], "score": 4}, {"id": "wumenguan-25", "collection": "无门关", "collectionId": "wumenguan", "number": 25, "title": "三座说法", "original": "仰山和尚梦见往弥勒所，安第三座。有一尊者白槌云：“今日当第三座说\n法。”山乃起白槌云：“摩诃衍法，离四句，绝百非。谛听，谛听。”", "translation": "仰山和尚梦见自己到弥勒那里，坐在第三座。有一位尊者敲槌说：“今天应\n当由第三座说法。”仰山于是起身敲槌说：“大乘法离开四句，断绝百非。请仔细\n听，请仔细听。”", "story": "仰山在梦中被请说法，只说大乘法离四句绝百非。", "meaning": "说法的核心不是堆积语言，而是离开固定判断。", "source": "《无门关》第25则。\n禅宗公案大全：无门关卷（48则完整版）\n10", "tags": ["无门关", "仰山", "弥勒", "说法", "离四句", "绝百非"], "score": 3}, {"id": "wumenguan-26", "collection": "无门关", "collectionId": "wumenguan", "number": 26, "title": "二僧卷帘", "original": "清凉大法眼因僧斋前上参，眼以手指帘。时有二僧同去卷帘。眼曰：“一得\n一失。”", "translation": "清凉法眼和尚在斋前上堂时，用手指向帘子。当时有两个僧人同时去卷\n帘。法眼说：“一个得，一个失。”", "story": "两僧动作相同，法眼却判一得一失。", "meaning": "同样行为背后可能有不同心机，禅不只看表面动作。", "source": "《无门关》第26则。", "tags": ["无门关", "法眼", "卷帘", "一得一失", "动作", "用心"], "score": 4}, {"id": "wumenguan-27", "collection": "无门关", "collectionId": "wumenguan", "number": 27, "title": "不是心佛", "original": "南泉和尚因僧问：“还有不与人说底法么？”泉云：“有。”僧云：“如何是不与\n人说底法？”泉云：“不是心，不是佛，不是物。”", "translation": "有僧人问南泉和尚：“还有不对人说的法吗？”南泉说：“有。”僧人问：“什么\n是不对人说的法？”南泉说：“不是心，不是佛，不是物。”", "story": "南泉把“心、佛、物”这些可抓取对象全部推开。", "meaning": "只要还能被当成对象抓住，就不是那个不可说之法。", "source": "《无门关》第27则。", "tags": ["无门关", "南泉", "不可说", "不是心", "不是佛", "不是物"], "score": 3}, {"id": "wumenguan-28", "collection": "无门关", "collectionId": "wumenguan", "number": 28, "title": "久响龙潭", "original": "德山因夜参龙潭，潭云：“夜深，子何不下去？”山遂珍重揭帘而出，见外面\n黑，却回云：“外面黑。”潭乃点纸烛度与。山拟接，潭便吹灭。山于此大悟。", "translation": "德山夜里参见龙潭，龙潭说：“夜深了，你为什么不下去？”德山告别后掀帘\n出去，见外面很黑，又回来，说：“外面黑。”龙潭点燃纸烛递给他。德山正要接\n过，龙潭就把火吹灭。德山因此大悟。\n禅宗公案大全：无门关卷（48则完整版）\n11", "story": "德山向外求光，龙潭吹灭烛火，使他当下大悟。", "meaning": "外在灯火一灭，反而逼出内在明白。", "source": "《无门关》第28则。", "tags": ["无门关", "德山", "龙潭", "吹烛", "大悟", "高传播"], "score": 5}, {"id": "wumenguan-29", "collection": "无门关", "collectionId": "wumenguan", "number": 29, "title": "非风非幡", "original": "六祖因风刹幡动，有二僧对论。一云：“幡动。”一云：“风动。”往复曾未契\n理。祖云：“不是风动，不是幡动，仁者心动。”", "translation": "六祖时，风吹着寺院幡旗飘动，有两个僧人争论。一个说：“是幡在动。”一\n个说：“是风在动。”两人来回争论都没有契合理趣。六祖说：“不是风动，也不是幡\n动，是你们的心在动。”", "story": "二僧争风动幡动，六祖将问题转回心动。", "meaning": "外境变化只是缘，真正起伏的是分别心。", "source": "《无门关》第29则；《六祖坛经》系统。", "tags": ["无门关", "六祖", "风幡心动", "心动", "分别心", "高传播"], "score": 5}, {"id": "wumenguan-30", "collection": "无门关", "collectionId": "wumenguan", "number": 30, "title": "即心即佛", "original": "马祖因大梅问：“如何是佛？”祖云：“即心是佛。”", "translation": "大梅问马祖：“什么是佛？”马祖说：“当下这颗心就是佛。”", "story": "马祖以“即心是佛”把大梅从向外求佛转回自身。", "meaning": "佛不在心外，但这句话也不可变成死概念。", "source": "《无门关》第30则；马祖语录系统。", "tags": ["无门关", "马祖", "大梅", "即心是佛", "心佛", "禅语"], "score": 4}, {"id": "wumenguan-31", "collection": "无门关", "collectionId": "wumenguan", "number": 31, "title": "赵州勘婆", "original": "赵州因僧问婆子：“台山路向甚处去？”婆云：“蓦直去。”僧才行三五步，婆\n云：“好个师僧，又恁么去。”后有僧举似州。州云：“待我去与汝勘过这婆子。”明日\n禅宗公案大全：无门关卷（48则完整版）\n12\n便去，亦如是问。婆亦如是答。州归谓众曰：“台山婆子，我为汝勘破了也。”", "translation": "有僧人问婆子：“去台山的路往哪里走？”婆子说：“一直往前走。”僧人才走\n三五步，婆子说：“好一个师僧，又这样走了。”后来有僧把这事告诉赵州。赵州\n说：“等我去替你们勘验这个婆子。”第二天赵州去，也这样问，婆子也这样答。赵\n州回来对众人说：“台山婆子，我已经替你们勘破了。”", "story": "婆子用问路勘验行脚僧，赵州又去勘验婆子。", "meaning": "路在脚下，但是否真会走，要经得起勘验。", "source": "《无门关》第31则；亦与《从容录》第10则系统相关。", "tags": ["无门关", "赵州", "婆子", "台山路", "勘验", "行脚"], "score": 4}, {"id": "wumenguan-32", "collection": "无门关", "collectionId": "wumenguan", "number": 32, "title": "外道问佛", "original": "世尊因外道问：“不问有言，不问无言。”世尊良久。外道赞叹云：“世尊大慈\n大悲，开我迷云，令我得入。”", "translation": "有外道问世尊：“我不问有言，也不问无言。”世尊沉默了很久。外道赞叹\n说：“世尊大慈大悲，拨开我的迷云，使我得以进入。”", "story": "外道不问有言无言，佛以沉默相应。", "meaning": "沉默不是没有回答，有时正是不落语言与沉默的回答。", "source": "《无门关》第32则。", "tags": ["无门关", "世尊", "外道", "沉默", "有言无言", "不二"], "score": 4}, {"id": "wumenguan-33", "collection": "无门关", "collectionId": "wumenguan", "number": 33, "title": "非心非佛", "original": "马祖因僧问：“如何是佛？”祖曰：“非心非佛。”", "translation": "有僧人问马祖：“什么是佛？”马祖说：“不是心，也不是佛。”", "story": "马祖以“非心非佛”对治学人对“即心是佛”的执著。", "meaning": "禅师的话是活药，不能把任何一句做成固定理论。", "source": "《无门关》第33则；马祖语录系统。", "tags": ["无门关", "马祖", "非心非佛", "即心是佛", "对治", "破执"], "score": 4}, {"id": "wumenguan-34", "collection": "无门关", "collectionId": "wumenguan", "number": 34, "title": "智不是道", "original": "南泉云：“心不是佛，智不是道。”", "translation": "南泉说：“心不是佛，智慧也不是道。”", "story": "南泉把学人容易依赖的心与智慧都推开。", "meaning": "聪明理解不等于道，知识越多也可能越会绕路。", "source": "《无门关》第34则。", "tags": ["无门关", "南泉", "心不是佛", "智不是道", "知解", "破执"], "score": 3}, {"id": "wumenguan-35", "collection": "无门关", "collectionId": "wumenguan", "number": 35, "title": "倩女离魂", "original": "五祖曰：“倩女离魂，那个是真底？”", "translation": "五祖说：“倩女的魂魄离开身体，哪一个才是真的倩女？”", "story": "借倩女离魂故事追问身体、魂魄与真实自我。", "meaning": "身份、自我、身心关系并不像日常想象中那么确定。", "source": "《无门关》第35则。", "tags": ["无门关", "五祖", "倩女离魂", "自我", "身心", "真实"], "score": 4}, {"id": "wumenguan-36", "collection": "无门关", "collectionId": "wumenguan", "number": 36, "title": "路逢达道", "original": "五祖曰：“路逢达道人，不将语默对，且道将甚么对？”", "translation": "五祖说：“路上遇到真正达道的人，不能用说话或沉默来回应，那么该用什\n么回应？”", "story": "五祖设问语言与沉默之外的相见方式。", "meaning": "真正相见不在语言，也不在故作沉默。", "source": "《无门关》第36则。", "tags": ["无门关", "五祖", "达道人", "语默", "相见", "语言之外"], "score": 3}, {"id": "wumenguan-37", "collection": "无门关", "collectionId": "wumenguan", "number": 37, "title": "庭前柏树", "original": "赵州因僧问：“如何是祖师西来意？”州云：“庭前柏树子。”", "translation": "有僧人问赵州：“祖师从西方来是什么意思？”赵州说：“庭前的柏树。”", "story": "宏大的祖师西来意，被赵州指向眼前一棵柏树。", "meaning": "最深的问题不在远方，答案就在眼前真实处。", "source": "《无门关》第37则；亦见《从容录》第47则。", "tags": ["无门关", "赵州", "柏树子", "祖师西来意", "眼前真实", "高传播"], "score": 5}, {"id": "wumenguan-38", "collection": "无门关", "collectionId": "wumenguan", "number": 38, "title": "牛过窗棂", "original": "五祖曰：“譬如水牯牛过窗棂，头角四蹄都过了，因甚么尾巴过不得？”", "translation": "五祖说：“比如一头水牯牛穿过窗格，头、角、四只脚都过去了，为什么尾\n巴却过不去？”", "story": "大部分都过关了，最后一条尾巴却卡住。", "meaning": "粗重执著容易看见，最后一丝细微执著最难放下。", "source": "《无门关》第38则。", "tags": ["无门关", "五祖", "水牯牛", "窗棂", "细微执著", "高传播"], "score": 5}, {"id": "wumenguan-39", "collection": "无门关", "collectionId": "wumenguan", "number": 39, "title": "云门话堕", "original": "云门因僧问：“光明寂照遍河沙……”门遽曰：“岂不是张拙秀才语？”僧云：\n“是。”门云：“话堕也。”", "translation": "有僧人问云门，引用“光明寂照遍河沙……”这类句子。云门立刻说：“这不\n是张拙秀才的话吗？”僧人说：“是。”云门说：“你已经堕在话语里了。”", "story": "僧人引用漂亮文句，被云门指出堕入话语。", "meaning": "引用好话不等于见地，借来的语言也可能遮蔽自己。", "source": "《无门关》第39则。", "tags": ["无门关", "云门", "话堕", "张拙", "引用", "知解"], "score": 3}, {"id": "wumenguan-40", "collection": "无门关", "collectionId": "wumenguan", "number": 40, "title": "趯倒净瓶", "original": "沩山和尚始在百丈会中充典座。百丈将选大沩主人，乃请首座同典座对众\n下语，出格者可往。百丈拈净瓶置地上问：“不得唤作净瓶，汝唤作甚么？”首座\n云：“不可唤作木𣔻也。”百丈却问山。山乃趯倒净瓶而去。百丈笑云：“第一座输却\n山子也。”", "translation": "沩山最初在百丈会下做典座。百丈要选大沩山的住持，请首座和典座当众\n回答问题，出格者可去。百丈把净瓶放在地上问：“不能叫它净瓶，你叫它什么？”\n首座说：“总不能叫它木片吧。”百丈又问沩山。沩山直接踢倒净瓶走了。百丈笑着\n说：“首座输给沩山了。”", "story": "百丈设语言陷阱，沩山不再命名，而是踢倒净瓶。", "meaning": "面对概念陷阱，最好的回答有时是把问题本身踢翻。", "source": "《无门关》第40则。", "tags": ["无门关", "沩山", "百丈", "净瓶", "语言陷阱", "行动回答"], "score": 4}, {"id": "wumenguan-41", "collection": "无门关", "collectionId": "wumenguan", "number": 41, "title": "达磨安心", "original": "达磨面壁。二祖立雪断臂云：“弟子心未安，乞师安心。”磨云：“将心来，与\n汝安。”祖云：“觅心了不可得。”磨云：“为汝安心竟。”", "translation": "达磨面壁而坐。二祖在雪中站立并断臂求法，说：“弟子的心还不安，请师\n父替我安心。”达磨说：“把心拿来，我替你安。”二祖说：“我寻找这颗心，最终找不\n到。”达磨说：“我已经替你把心安好了。”", "story": "慧可求安心，达磨让他寻找不安之心，最终发现觅心不可得。", "meaning": "烦恼之心若被认真寻找，会发现它并无固定实体。", "source": "《无门关》第41则；达磨传灯系统。", "tags": ["无门关", "达磨", "慧可", "安心", "觅心不可得", "高传播"], "score": 5}, {"id": "wumenguan-42", "collection": "无门关", "collectionId": "wumenguan", "number": 42, "title": "女子出定", "original": "世尊昔因文殊至诸佛集处，值诸佛各还本处，惟有一女人近彼佛坐入于三\n昧。文殊乃白佛：“云何女人得近佛坐，而我不得？”佛告文殊：“汝但觉此女，令\n从三昧起，汝自问之。”文殊绕女人三匝，鸣指一下，乃托至梵天，尽其神力而不\n能出。世尊云：“假使百千文殊，亦出此女人定不得。下方过四十二恒河沙国土，\n禅宗公案大全：无门关卷（48则完整版）\n16\n有罔明菩萨，能出此女人定。”须臾罔明大士从地涌出，礼拜世尊。世尊敕罔明，\n却至女人前，鸣指一下，女人于是从定而出。", "translation": "从前文殊到诸佛聚集的地方，诸佛都各自回到本处，只有一位女子靠近佛\n而坐，进入三昧。文殊问佛：“为什么这位女子能靠近佛坐，而我不能？”佛告诉文\n殊：“你只要叫醒这位女子，让她从三昧中出来，自己问她。”文殊绕女子三圈，弹\n指一下，又把她托到梵天，用尽神力也不能使她出定。世尊说：“即使有百千个文\n殊，也不能让这个女子出定。下方过四十二恒河沙国土，有罔明菩萨能让她出\n定。”不久罔明菩萨从地涌出，礼拜世尊。世尊命罔明到女子面前弹指一下，女子\n于是从定中出来。", "story": "文殊不能令女子出定，罔明菩萨一弹指却能做到。", "meaning": "智慧、位次、作用不能只按表面高低判断。", "source": "《无门关》第42则。", "tags": ["无门关", "文殊", "女子出定", "罔明菩萨", "三昧", "作用"], "score": 3}, {"id": "wumenguan-43", "collection": "无门关", "collectionId": "wumenguan", "number": 43, "title": "首山竹篦", "original": "首山和尚拈竹篦示众云：“汝等诸人，若唤作竹篦则触，不唤作竹篦则背。\n汝诸人，且道唤作甚么？”", "translation": "首山和尚拿起竹篦给众人看，说：“你们这些人，如果叫它竹篦，就触犯；\n如果不叫它竹篦，就背离。你们说，到底该叫它什么？”", "story": "首山用竹篦设置命名两难。", "meaning": "语言命名会让人落入两边，禅师要人看见自己如何被名称困住。", "source": "《无门关》第43则。", "tags": ["无门关", "首山", "竹篦", "命名", "语言两难", "破执"], "score": 4}, {"id": "wumenguan-44", "collection": "无门关", "collectionId": "wumenguan", "number": 44, "title": "芭蕉拄杖", "original": "芭蕉和尚示众云：“汝有拄杖子，我与汝拄杖子；汝无拄杖子，我夺汝拄杖\n子。”", "translation": "芭蕉和尚对众人说：“你有拄杖，我就给你拄杖；你没有拄杖，我就夺走你\n的拄杖。”", "story": "芭蕉在有无之间都不给人安身处。\n禅宗公案大全：无门关卷（48则完整版）\n17", "meaning": "有也被给，无也被夺，目的是破除对有无的依赖。", "source": "《无门关》第44则。", "tags": ["无门关", "芭蕉", "拄杖", "有无", "夺与", "破依赖"], "score": 4}, {"id": "wumenguan-45", "collection": "无门关", "collectionId": "wumenguan", "number": 45, "title": "他是阿谁", "original": "东山演师祖曰：“释迦、弥勒，犹是他奴。他是阿谁？”", "translation": "东山演祖师说：“释迦和弥勒，尚且是他的奴仆。那他是谁？”", "story": "东山提出连释迦弥勒都只是其奴仆的“他”。", "meaning": "逼人追问诸佛之前、不被名相限定的根本主体。", "source": "《无门关》第45则。", "tags": ["无门关", "东山演", "释迦", "弥勒", "他是谁", "主体追问"], "score": 3}, {"id": "wumenguan-46", "collection": "无门关", "collectionId": "wumenguan", "number": 46, "title": "竿头进步", "original": "石霜和尚云：“百尺竿头，如何进步？”又古德云：“百尺竿头坐底人，虽然\n得入未为真。百尺竿头须进步，十方世界现全身。”", "translation": "石霜和尚说：“站在百尺竿头的人，怎样还能再进一步？”又有古德说：“坐\n在百尺竿头的人，虽然已经进入，还不算真实。百尺竿头还须再进一步，十方世\n界都会显现全身。”", "story": "已经到达极高处的人，仍被要求再进一步。", "meaning": "若执著“我已到高处”，仍未自由；真正进步是连高处也放下。", "source": "《无门关》第46则。", "tags": ["无门关", "石霜", "百尺竿头", "进步", "放下高处", "高传播"], "score": 5}, {"id": "wumenguan-47", "collection": "无门关", "collectionId": "wumenguan", "number": 47, "title": "兜率三关", "original": "兜率悦和尚设三关问学者：“拨草参玄只图见性，即今上人性在甚处？识得\n自性，方脱生死，眼光落时作么生脱？脱得生死，便知去处，四大分离向甚处\n去？”\n禅宗公案大全：无门关卷（48则完整版）\n18", "translation": "兜率悦和尚设下三道关问学人：“拨开草去参究玄妙，只是为了见性，那么\n现在你的性在哪里？认识自性，才脱离生死；临终眼光落地时，怎样脱离？脱离\n生死之后，就应知道去处；四大分离时，到哪里去？”", "story": "兜率悦连续追问见性、生死、去处三大问题。", "meaning": "参禅不能只谈玄妙，必须面对自性、生死和归宿。", "source": "《无门关》第47则。", "tags": ["无门关", "兜率", "三关", "见性", "生死", "去处"], "score": 3}, {"id": "wumenguan-48", "collection": "无门关", "collectionId": "wumenguan", "number": 48, "title": "干峰一路", "original": "乾峰和尚因僧问：“十方薄伽梵，一路涅槃门。未审路头在甚么处？”峰拈起\n拄杖，划一划云：“在者里。”后僧请益云门。门拈起扇子云：“扇子𨁝跳上三十三\n天，筑著帝释鼻孔。东海鲤鱼打一棒，雨似盆倾。”", "translation": "有僧人问乾峰和尚：“十方诸佛都有同一路涅槃门，不知路头在哪里？”乾峰\n拿起拄杖划了一下，说：“就在这里。”后来这位僧人又向云门请教。云门拿起扇子\n说：“扇子跳上三十三天，撞着帝释的鼻孔。东海鲤鱼被打一棒，雨就像盆倒一样\n倾下。”", "story": "乾峰以一划指示路头，云门又以更奇峻的语言翻转。", "meaning": "路头不在远方，也不在解释里，而在当下一机一境。", "source": "《无门关》第48则。", "tags": ["无门关", "乾峰", "云门", "涅槃门", "拄杖", "扇子", "一路"], "score": 3}, {"id": "biyanlu-1", "collection": "碧岩录", "collectionId": "biyanlu", "number": 1, "title": "达磨廓然", "original": "梁武帝问达磨大师：“如何是圣谛第一义？”磨云：“廓然无圣。”帝曰：“对朕\n者谁？”磨云：“不识。”", "translation": "梁武帝问达磨：“佛法最高的真理是什么？”达磨说：“空阔开朗，并没有什\n么圣。”梁武帝又问：“那站在我面前的是谁？”达磨说：“不认识。”", "story": "梁武帝自认广修寺院、度僧无数，向达磨追问最高真理，却被“廓然无\n圣”“不识”两句截断。", "meaning": "破除功德相、圣凡相、帝王自我中心；真正佛法不是功德账本。", "source": "《碧岩录》第1则；亦见《从容录》第2则。", "tags": ["碧岩录", "达磨", "梁武帝", "廓然无圣", "不识", "功德相", "高传播\n禅宗公案大全：碧岩录卷（100则完整版）\n1"], "score": 5}, {"id": "biyanlu-2", "collection": "碧岩录", "collectionId": "biyanlu", "number": 2, "title": "赵州至道无难", "original": "赵州示众云：“至道无难，唯嫌拣择。才有语言，是拣择，是明白。老僧不\n在明白里，是汝还护惜也无？”", "translation": "赵州对大众说：“最高的道并不难，只怕人起分别取舍。只要一落语言，就\n是分别，就是明白知解。我这个老僧不在这种明白里，你们还珍惜它吗？”", "story": "赵州举“三祖信心铭”语：“至道无难，唯嫌拣择。”僧人继续追问，赵州\n以“不知”等语逼问。", "meaning": "道不难，难在人心不断选择、比较、贴标签。", "source": "《碧岩录》第2则。", "tags": ["碧岩录", "赵州", "至道无难", "唯嫌拣择", "信心铭", "分别心"], "score": 4}, {"id": "biyanlu-3", "collection": "碧岩录", "collectionId": "biyanlu", "number": 3, "title": "马祖日面佛月面佛", "original": "马大师不安，院主问：“和尚近日尊候如何？”大师云：“日面佛，月面佛。”", "translation": "马祖身体不适，院主问：“和尚最近身体怎么样？”马祖说：“日面佛，月面\n佛。”", "story": "马祖病中不说好坏，只答“日面佛，月面佛”，把病况从生死忧惧中翻转\n成佛名。", "meaning": "病中仍不被病定义，生死中仍可见自在。", "source": "《碧岩录》第3则；亦见《从容录》第36则。", "tags": ["碧岩录", "马祖", "日面佛", "月面佛", "病中自在", "生死"], "score": 4}, {"id": "biyanlu-4", "collection": "碧岩录", "collectionId": "biyanlu", "number": 4, "title": "德山到沩山", "original": "德山到沩山，挟复子上法堂，从西过东，从东过西，顾视方丈云：“有么？\n有么？”山坐次，殊不顾盼。德山云：“无！无！”便出。", "translation": "德山来到沩山，夹着包袱上法堂，从西走到东，又从东走到西，看着方丈\n说：“有吗？有吗？”沩山正坐着，没有理会。德山说：“没有！没有！”便走出去。", "story": "德山到沩山，挟包上法堂来回走动，只说“无无”，随后离开。", "meaning": "禅门相见不在礼节外观，而在主宾机锋是否真正相触。\n禅宗公案大全：碧岩录卷（100则完整版）\n2", "source": "《碧岩录》第4则。", "tags": ["碧岩录", "德山", "沩山", "主宾机锋", "无无", "相见"], "score": 3}, {"id": "biyanlu-5", "collection": "碧岩录", "collectionId": "biyanlu", "number": 5, "title": "雪峰粟米粒", "original": "雪峰示众云：“尽大地撮来如粟米粒大，抛向面前，漆桶不会，打鼓普请\n看。”", "translation": "雪峰对大众说：“把整个大地撮成一粒小米那么大，抛在你面前。若这个漆\n桶还不会，就打鼓请大家来看。”", "story": "雪峰说“尽大地撮来如粟米粒大，抛向面前”，把宏大世界缩成一粒粟\n米。", "meaning": "宏大世界可被一念收摄；但若只在语句上理解，仍是隔靴搔痒。", "source": "《碧岩录》第5则。", "tags": ["碧岩录", "雪峰", "粟米粒", "大地", "收摄", "机锋"], "score": 4}, {"id": "biyanlu-6", "collection": "碧岩录", "collectionId": "biyanlu", "number": 6, "title": "云门日日是好日", "original": "云门垂语云：“十五日已前不问汝，十五日已后道将一句来。”自代云：“日日\n是好日。”", "translation": "云门开示说：“十五日以前的事不问你，十五日以后说一句来。”他自己代众\n人回答：“天天都是好日子。”", "story": "云门抛出时间关口，又自答“日日是好日”。", "meaning": "不是每天都顺利才叫好日，而是不再被顺逆牵着走。", "source": "《碧岩录》第6则。", "tags": ["碧岩录", "云门", "日日是好日", "时间", "平常心", "高传播"], "score": 5}, {"id": "biyanlu-7", "collection": "碧岩录", "collectionId": "biyanlu", "number": 7, "title": "法眼慧超", "original": "僧慧超问法眼：“如何是佛？”眼云：“汝是慧超。”", "translation": "慧超问法眼：“什么是佛？”法眼说：“你就是慧超。”", "story": "慧超问佛，法眼不解释佛理，只把他送回自身。\n禅宗公案大全：碧岩录卷（100则完整版）\n3", "meaning": "从向外寻找佛，回到此时此地的提问者自身。", "source": "《碧岩录》第7则。", "tags": ["碧岩录", "法眼", "慧超", "如何是佛", "回到自身"], "score": 4}, {"id": "biyanlu-8", "collection": "碧岩录", "collectionId": "biyanlu", "number": 8, "title": "翠岩眉毛", "original": "翠岩夏末示众云：“一夏以来，为兄弟说话，看翠岩眉毛在么？”保福云：\n“作贼人心虚。”长庆云：“生也。”云门云：“关。”", "translation": "夏安居结束时，翠岩对大众说：“这一夏以来，我为你们说法，你们看翠岩\n的眉毛还在不在？”保福说：“做贼的人心虚。”长庆说：“长出来了。”云门说：“关。”", "story": "翠岩夏末自问说法后眉毛是否还在，诸师各自作答。", "meaning": "说法者也要自检；若落虚妄，所谓“眉毛脱落”。", "source": "《碧岩录》第8则。", "tags": ["碧岩录", "翠岩", "眉毛", "说法", "自检", "云门"], "score": 3}, {"id": "biyanlu-9", "collection": "碧岩录", "collectionId": "biyanlu", "number": 9, "title": "赵州四门", "original": "僧问赵州：“如何是赵州？”州云：“东门、西门、南门、北门。”", "translation": "有僧人问赵州：“什么是赵州？”赵州说：“东门、西门、南门、北门。”", "story": "僧问“如何是赵州”，赵州不用人格标签回答，而以一座城的四门回应。", "meaning": "真正的赵州不是概念，而是活泼通达的作用。", "source": "《碧岩录》第9则。", "tags": ["碧岩录", "赵州", "四门", "通达", "地名机锋"], "score": 3}, {"id": "biyanlu-10", "collection": "碧岩录", "collectionId": "biyanlu", "number": 10, "title": "睦州勘喝", "original": "睦州问僧：“近离甚处？”僧便喝。州云：“老僧被汝一喝。”僧又喝。州云：\n“三喝四喝后作么生？”僧无语。州便打。", "translation": "睦州问僧人：“最近从哪里来？”僧人便喝一声。睦州说：“老僧被你喝了一\n下。”僧人又喝。睦州说：“三喝四喝之后怎么办？”僧人无话可说。睦州便打他。", "story": "僧人模仿棒喝，睦州追问到“三喝四喝后”便露出空处。\n禅宗公案大全：碧岩录卷（100则完整版）\n4", "meaning": "模仿“喝”很容易，真有转身处很难。", "source": "《碧岩录》第10则。", "tags": ["碧岩录", "睦州", "喝", "勘验", "模仿", "棒喝"], "score": 3}, {"id": "biyanlu-11", "collection": "碧岩录", "collectionId": "biyanlu", "number": 11, "title": "黄檗无禅师", "original": "黄檗示众云：“汝等诸人，尽是噇酒糟汉。恁么行脚，何处有今日？还知大\n唐国里无禅师么？”僧云：“诸方聚众说法，又作么生？”檗云：“不道无禅，只是无\n师。”", "translation": "黄檗对众人说：“你们这些人，全是吃酒糟的汉子。这样行脚，哪里会有今\n天？知道大唐国内没有禅师吗？”僧人问：“各地聚众说法的人又怎么算？”黄檗\n说：“不是说没有禅，只是没有师。”", "story": "黄檗呵众人“大唐国里无禅师”，又说不是无禅，只是无师。", "meaning": "热闹道场不等于有真实眼目；跟随人群不等于参禅。", "source": "《碧岩录》第11则；亦见《从容录》第53则。", "tags": ["碧岩录", "黄檗", "无禅师", "行脚", "师眼", "警策"], "score": 4}, {"id": "biyanlu-12", "collection": "碧岩录", "collectionId": "biyanlu", "number": 12, "title": "洞山麻三斤", "original": "僧问洞山：“如何是佛？”山云：“麻三斤。”", "translation": "有僧人问洞山：“什么是佛？”洞山说：“三斤麻。”", "story": "高远的佛理问题，被洞山落到眼前具体物和重量上。", "meaning": "佛不离日常，但也不能把“麻三斤”解释成新概念。", "source": "《碧岩录》第12则；亦见《无门关》第18则。", "tags": ["碧岩录", "洞山", "麻三斤", "佛", "日常物", "高传播"], "score": 5}, {"id": "biyanlu-13", "collection": "碧岩录", "collectionId": "biyanlu", "number": 13, "title": "巴陵银碗盛雪", "original": "僧问巴陵：“如何是提婆宗？”陵云：“银碗里盛雪。”", "translation": "有僧人问巴陵：“什么是提婆宗？”巴陵说：“银碗里盛着雪。”", "story": "巴陵以“银碗里盛雪”回应宗旨问题，银与雪同白相映。\n禅宗公案大全：碧岩录卷（100则完整版）\n5", "meaning": "宗旨清明难辨，不可粗心从字面求。", "source": "《碧岩录》第13则。", "tags": ["碧岩录", "巴陵", "银碗盛雪", "提婆宗", "清白", "意象"], "score": 3}, {"id": "biyanlu-14", "collection": "碧岩录", "collectionId": "biyanlu", "number": 14, "title": "云门对一说", "original": "僧问云门：“如何是一代时教？”门云：“对一说。”", "translation": "有僧人问云门：“什么是一代佛陀教法？”云门说：“对着一个说。”", "story": "云门以“对一说”收摄一代时教。", "meaning": "三藏十二部归于当下一句；但若执著“一”，又错。", "source": "《碧岩录》第14则。", "tags": ["碧岩录", "云门", "一代时教", "对一说", "教法", "一字机锋"], "score": 3}, {"id": "biyanlu-15", "collection": "碧岩录", "collectionId": "biyanlu", "number": 15, "title": "云门倒一说", "original": "僧问云门：“不是目前机，亦非目前事时如何？”门云：“倒一说。”", "translation": "有僧人问云门：“既不是眼前的机，也不是眼前的事时，该怎样？”云门说：\n“倒过来说。”", "story": "云门以“倒一说”翻转学人的追问。", "meaning": "把思路翻转过来，逼人离开正反两边。", "source": "《碧岩录》第15则。", "tags": ["碧岩录", "云门", "倒一说", "目前机", "翻转", "机锋"], "score": 3}, {"id": "biyanlu-16", "collection": "碧岩录", "collectionId": "biyanlu", "number": 16, "title": "镜清啐啄", "original": "僧问镜清：“学人啐，请师啄。”清云：“还得活也无？”僧云：“若不活，遭人\n怪笑。”清云：“也是草里汉。”", "translation": "有僧人问镜清：“学生已经从里面啐壳，请师父从外面啄破。”镜清说：“这样\n还能活吗？”僧人说：“如果不活，会被人笑话。”镜清说：“你也是草丛里的汉子。”", "story": "僧以雏鸟破壳为喻请师点拨，镜清反问能否活。\n禅宗公案大全：碧岩录卷（100则完整版）\n6", "meaning": "真正教学是内在成熟与外在点拨相应。", "source": "《碧岩录》第16则。", "tags": ["碧岩录", "镜清", "啐啄同时", "教学", "时机", "师徒"], "score": 4}, {"id": "biyanlu-17", "collection": "碧岩录", "collectionId": "biyanlu", "number": 17, "title": "香林坐久成劳", "original": "僧问香林：“如何是祖师西来意？”林云：“坐久成劳。”", "translation": "有僧人问香林：“祖师从西方来的意思是什么？”香林说：“坐久了就会疲\n劳。”", "story": "香林把玄妙的祖师西来意拉回身体疲劳。", "meaning": "禅不离身体真实经验；久坐也不是道本身。", "source": "《碧岩录》第17则。", "tags": ["碧岩录", "香林", "坐久成劳", "祖师西来意", "身体", "日常"], "score": 3}, {"id": "biyanlu-18", "collection": "碧岩录", "collectionId": "biyanlu", "number": 18, "title": "国师无缝塔", "original": "肃宗帝问忠国师：“百年后所须何物？”师云：“与老僧作个无缝塔。”帝曰：\n“请师塔样。”师良久云：“会么？”帝云：“不会。”", "translation": "肃宗皇帝问忠国师：“百年之后，您需要什么？”国师说：“给老僧造一座无\n缝塔。”皇帝说：“请师父说说塔的样子。”国师沉默很久，说：“会吗？”皇帝说：“不\n会。”", "story": "国师要无缝塔，皇帝请问塔样，国师以沉默回应。", "meaning": "真正归处无形无缝，无法用图样表达。", "source": "《碧岩录》第18则；亦见《从容录》第85则。", "tags": ["碧岩录", "忠国师", "无缝塔", "肃宗", "沉默", "归宿"], "score": 3}, {"id": "biyanlu-19", "collection": "碧岩录", "collectionId": "biyanlu", "number": 19, "title": "俱胝一指", "original": "俱胝和尚凡有所问，只竖一指。后童子效之，胝以刃断其指。童子回首，\n胝却竖指，童子忽然悟去。\n禅宗公案大全：碧岩录卷（100则完整版）\n7", "translation": "俱胝和尚凡有人问法，只竖一根手指。后来童子模仿他，俱胝用刀斩断童\n子的手指。童子回头时，俱胝又竖起手指，童子忽然悟了。", "story": "俱胝一生以一指接人，童子模仿被截指，回头见一指而悟。", "meaning": "形式不是法；断除对形式的执著，才有入处。", "source": "《碧岩录》第19则；亦见《无门关》第3则。", "tags": ["碧岩录", "俱胝", "一指禅", "破相", "断执", "师徒机锋"], "score": 4}, {"id": "biyanlu-20", "collection": "碧岩录", "collectionId": "biyanlu", "number": 20, "title": "龙牙西来意", "original": "僧问龙牙：“如何是祖师西来意？”牙云：“待石乌龟解语，即向汝道。”", "translation": "有僧人问龙牙：“祖师从西方来的意思是什么？”龙牙说：“等石头乌龟会说\n话时，我就告诉你。”", "story": "龙牙以“石乌龟会说话”回应祖师西来意，不给概念答案。", "meaning": "祖师意不是一句解释，而是当场呈现的手眼。", "source": "《碧岩录》第20则。", "tags": ["碧岩录", "龙牙", "祖师西来意", "石乌龟", "不可说"], "score": 3}, {"id": "biyanlu-21", "collection": "碧岩录", "collectionId": "biyanlu", "number": 21, "title": "智门莲花荷叶", "original": "僧问智门：“莲花未出水时如何？”门云：“莲花。”僧云：“出水后如何？”门\n云：“荷叶。”", "translation": "有僧人问智门：“莲花还没有出水时怎么样？”智门说：“莲花。”僧人又问：\n“出水以后怎么样？”智门说：“荷叶。”", "story": "智门借莲花未出水与出水后的变化回应问法。", "meaning": "自然物象能承载禅意，但不能被当成诗意装饰。", "source": "《碧岩录》第21则。", "tags": ["碧岩录", "智门", "莲花", "荷叶", "自然意象", "禅机"], "score": 3}, {"id": "biyanlu-22", "collection": "碧岩录", "collectionId": "biyanlu", "number": 22, "title": "雪峰鳖鼻蛇", "original": "雪峰示众云：“南山有一条鳖鼻蛇，汝等诸人切须好看。”长庆云：“今日堂中\n大有人丧身失命。”", "translation": "雪峰对大众说：“南山有一条鳖鼻蛇，你们大家务必要好好看着。”长庆说：\n“今天堂中有很多人丧身失命。”", "story": "雪峰提醒南山有鳖鼻蛇，看似危险提醒，实则把危险放在修行当下。", "meaning": "法机与险处常在一起，不可粗心。", "source": "《碧岩录》第22则；亦见《从容录》第24则。", "tags": ["碧岩录", "雪峰", "鳖鼻蛇", "危险", "警觉", "法机"], "score": 3}, {"id": "biyanlu-23", "collection": "碧岩录", "collectionId": "biyanlu", "number": 23, "title": "保福妙峰顶", "original": "保福问长庆：“只如妙峰顶，是什么人到？”庆云：“是汝不到处。”福云：“若\n不到，争知妙峰顶？”庆便休。", "translation": "保福问长庆：“像妙峰顶这样的地方，是什么人能到？”长庆说：“是你到不\n了的地方。”保福说：“如果到不了，又怎么知道是妙峰顶？”长庆便停止不说。", "story": "围绕“妙峰顶”展开问答，诸师借最高峰检验学人是否停在境界中。", "meaning": "即使到达高峰，若执著高峰仍是障碍。", "source": "《碧岩录》第23则。", "tags": ["碧岩录", "保福", "长庆", "妙峰顶", "境界", "高处"], "score": 3}, {"id": "biyanlu-24", "collection": "碧岩录", "collectionId": "biyanlu", "number": 24, "title": "刘铁磨台山", "original": "刘铁磨到沩山。山云：“老牸牛，汝来也。”磨云：“来日台山大会斋，和尚还\n去么？”山放身作卧势。磨便出去。", "translation": "刘铁磨来到沩山。沩山说：“老母牛，你来了。”刘铁磨说：“明天台山有大会\n斋，和尚去吗？”沩山便把身体放倒作卧势。刘铁磨就走了出去。", "story": "刘铁磨与沩山机锋往来，女禅者风骨鲜明。", "meaning": "禅门不以性别身份论高下，只看见地与机锋。", "source": "《碧岩录》第24则。", "tags": ["碧岩录", "刘铁磨", "沩山", "女禅者", "台山", "机锋"], "score": 4}, {"id": "biyanlu-25", "collection": "碧岩录", "collectionId": "biyanlu", "number": 25, "title": "莲花峰拄杖", "original": "莲花峰庵主拈拄杖示众云：“古人到这里，为什么不肯住？”众无语。自代\n云：“为他途路不得力。”复云：“毕竟如何？”又自代云：“楖栗横担不顾人，直入千\n峰万峰去。”", "translation": "莲花峰庵主拿起拄杖对大众说：“古人到这里，为什么不肯停住？”众人无\n语。他自己代答：“因为道路上不得力。”又问：“究竟怎样？”又自己答：“横担拄\n杖，不顾别人，直入千峰万峰去。”", "story": "莲花峰和尚拈拄杖示众，借行脚工具追问归家路。", "meaning": "拄杖既是依靠，也可能成为执著。", "source": "《碧岩录》第25则。", "tags": ["碧岩录", "莲花峰", "拄杖", "行脚", "不住", "道路"], "score": 3}, {"id": "biyanlu-26", "collection": "碧岩录", "collectionId": "biyanlu", "number": 26, "title": "百丈独坐大雄峰", "original": "僧问百丈：“如何是奇特事？”丈云：“独坐大雄峰。”僧礼拜。丈便打。", "translation": "有僧人问百丈：“什么是奇特的事？”百丈说：“独自坐在大雄峰。”僧人礼\n拜。百丈便打他。", "story": "僧问奇特事，百丈回答“独坐大雄峰”。", "meaning": "真正奇特不在神异，而在安住本位。", "source": "《碧岩录》第26则。", "tags": ["碧岩录", "百丈", "独坐大雄峰", "奇特事", "本位"], "score": 4}, {"id": "biyanlu-27", "collection": "碧岩录", "collectionId": "biyanlu", "number": 27, "title": "云门体露金风", "original": "僧问云门：“树凋叶落时如何？”门云：“体露金风。”", "translation": "有僧人问云门：“树木凋零、叶子落下时怎么样？”云门说：“本体显露在秋\n风中。”", "story": "僧问树凋叶落，云门答“体露金风”。", "meaning": "凋零不是衰败，也可能是真体显露。", "source": "《碧岩录》第27则。", "tags": ["碧岩录", "云门", "体露金风", "秋风", "凋零", "显露\n禅宗公案大全：碧岩录卷（100则完整版）\n10"], "score": 4}, {"id": "biyanlu-28", "collection": "碧岩录", "collectionId": "biyanlu", "number": 28, "title": "南泉不说法", "original": "南泉因陆亘大夫问：“弟子家中有片石，也曾坐也未？”泉云：“坐。”陆云：\n“是凡是圣？”泉云：“非凡非圣。”", "translation": "陆亘大夫问南泉：“我家中有一块石头，它也曾坐禅吗？”南泉说：“坐。”陆\n亘问：“它是凡还是圣？”南泉说：“既不是凡，也不是圣。”", "story": "南泉围绕石头坐禅、凡圣等问题，令学人离开固定分类。", "meaning": "佛法不只在讲解中，也在沉默、行动和时机中。", "source": "《碧岩录》第28则。", "tags": ["碧岩录", "南泉", "陆亘", "石头", "凡圣", "不二"], "score": 3}, {"id": "biyanlu-29", "collection": "碧岩录", "collectionId": "biyanlu", "number": 29, "title": "大随劫火", "original": "僧问大随：“劫火洞然，大千俱坏，未审这个坏不坏？”随云：“坏。”僧云：\n“恁么则随他去也。”随云：“随他去。”", "translation": "有僧人问大随：“劫火燃起，大千世界都毁坏时，不知这个会不会坏？”大随\n说：“坏。”僧人说：“那么就随它去了。”大随说：“随它去。”", "story": "僧问劫火坏世界时“这个”坏不坏，大随答“坏”。", "meaning": "连最想抓住的“这个”也不可执为永恒。", "source": "《碧岩录》第29则；亦见《从容录》第30则。", "tags": ["碧岩录", "大随", "劫火", "坏", "无常", "放下"], "score": 3}, {"id": "biyanlu-30", "collection": "碧岩录", "collectionId": "biyanlu", "number": 30, "title": "赵州大萝卜头", "original": "僧问赵州：“承闻和尚亲见南泉，是否？”州云：“镇州出大萝卜头。”", "translation": "有僧人问赵州：“听说和尚亲自见过南泉，是吗？”赵州说：“镇州出大萝卜\n头。”", "story": "赵州以“大萝卜头”回应关于见南泉的追问。", "meaning": "日常粗俗物也能成为禅机，打破对玄妙答案的期待。", "source": "《碧岩录》第30则。\n禅宗公案大全：碧岩录卷（100则完整版）\n11", "tags": ["碧岩录", "赵州", "大萝卜头", "南泉", "日常物", "幽默"], "score": 4}, {"id": "biyanlu-31", "collection": "碧岩录", "collectionId": "biyanlu", "number": 31, "title": "麻谷振锡", "original": "麻谷持锡到章敬，绕禅床三匝，振锡一下，卓然而立。敬云：“是！是！”又\n到南泉，亦绕禅床三匝，振锡一下，卓然而立。泉云：“不是！不是！”", "translation": "麻谷持锡杖到章敬那里，绕禅床三圈，振锡一下，挺然而立。章敬说：\n“是！是！”又到南泉那里，也绕禅床三圈，振锡一下，挺然而立。南泉说：“不\n是！不是！”", "story": "同一动作，章敬说是，南泉说不是。", "meaning": "同一动作不等于同一见地，判断要看当机。", "source": "《碧岩录》第31则；亦见《从容录》第16则。", "tags": ["碧岩录", "麻谷", "振锡", "章敬", "南泉", "当机"], "score": 3}, {"id": "biyanlu-32", "collection": "碧岩录", "collectionId": "biyanlu", "number": 32, "title": "临济佛法大意", "original": "定上座问临济：“如何是佛法大意？”济下禅床，擒住，与一掌，便托开。定\n拟议。傍僧云：“定上座，何不礼拜？”定方礼拜，忽然大悟。", "translation": "定上座问临济：“什么是佛法大意？”临济下禅床，抓住他，给他一掌，又推\n开他。定上座正要思量，旁边僧人说：“定上座，为什么不礼拜？”定上座才礼拜，\n忽然大悟。", "story": "定上座问佛法大意，临济以抓、打、推直接回应。", "meaning": "佛法大意不是解释，而是当头承当。", "source": "《碧岩录》第32则。", "tags": ["碧岩录", "临济", "定上座", "佛法大意", "一掌", "大悟"], "score": 4}, {"id": "biyanlu-33", "collection": "碧岩录", "collectionId": "biyanlu", "number": 33, "title": "陈操看资福", "original": "陈操尚书看资福。福见来，便画一圆相。操云：“弟子恁么来，早是不著\n便；更画圆相。”福便掩却方丈门。", "translation": "陈操尚书来拜访资福。资福见他来，便画了一个圆相。陈操说：“弟子这样\n来，已经不合适；你还画圆相。”资福便关上方丈门。\n禅宗公案大全：碧岩录卷（100则完整版）\n12", "story": "资福画圆相，陈操指出自己来已不著便，资福随即掩门。", "meaning": "士大夫参禅，也必须过真实机锋。", "source": "《碧岩录》第33则。", "tags": ["碧岩录", "陈操", "资福", "圆相", "士大夫", "机锋"], "score": 3}, {"id": "biyanlu-34", "collection": "碧岩录", "collectionId": "biyanlu", "number": 34, "title": "仰山不曾游山", "original": "仰山问僧：“近离甚处？”僧云：“庐山。”山云：“曾到五老峰么？”僧云：“不\n曾到。”山云：“阇黎不曾游山。”", "translation": "仰山问僧人：“最近从哪里来？”僧人说：“庐山。”仰山问：“到过五老峰\n吗？”僧人说：“没有。”仰山说：“阇黎你不曾游山。”", "story": "僧说从庐山来，却未到五老峰，仰山说他不曾游山。", "meaning": "去过不等于见过；经历不等于领会。", "source": "《碧岩录》第34则。", "tags": ["碧岩录", "仰山", "庐山", "五老峰", "游山", "经历"], "score": 3}, {"id": "biyanlu-35", "collection": "碧岩录", "collectionId": "biyanlu", "number": 35, "title": "文殊前三三后三三", "original": "文殊问无著：“近离甚处？”著云：“南方。”殊云：“南方佛法如何住持？”著\n云：“末法比丘，少奉戒律。”殊云：“多少众？”著云：“或三百，或五百。”无著问文\n殊：“此间如何住持？”殊云：“凡圣同居，龙蛇混杂。”著云：“多少众？”殊云：“前\n三三，后三三。”", "translation": "文殊问无著：“最近从哪里来？”无著说：“南方。”文殊问：“南方佛法怎样住\n持？”无著说：“末法时代的比丘，很少奉持戒律。”文殊问：“有多少大众？”无著\n说：“或者三百，或者五百。”无著又问文殊：“这里怎样住持？”文殊说：“凡圣同\n住，龙蛇混杂。”无著问：“有多少大众？”文殊说：“前三三，后三三。”", "story": "无著遇文殊，问清凉山众数，文殊答“前三三，后三三”。", "meaning": "数字不是算术题，而是截断计算心。", "source": "《碧岩录》第35则。", "tags": ["碧岩录", "文殊", "无著", "前三三后三三", "清凉山", "数字关"], "score": 3}, {"id": "biyanlu-36", "collection": "碧岩录", "collectionId": "biyanlu", "number": 36, "title": "长沙游山", "original": "长沙一日游山归，首座问：“和尚甚处去来？”沙云：“游山来。”座云：“到甚\n处来？”沙云：“始随芳草去，又逐落花回。”", "translation": "长沙有一天游山回来，首座问：“和尚从哪里回来？”长沙说：“游山回来。”\n首座问：“到了哪里？”长沙说：“起初随着芳草而去，又追着落花回来。”", "story": "长沙游山回来，以“始随芳草去，又逐落花回”回应。", "meaning": "随芳草去、逐落花回，是随缘自在的行履。", "source": "《碧岩录》第36则。", "tags": ["碧岩录", "长沙", "游山", "芳草", "落花", "随缘"], "score": 4}, {"id": "biyanlu-37", "collection": "碧岩录", "collectionId": "biyanlu", "number": 37, "title": "盘山三界无法", "original": "盘山垂语云：“三界无法，何处求心？四大本空，佛依何住？”", "translation": "盘山开示说：“三界之中没有固定的法，到哪里去求心？四大本来是空，佛\n又依靠哪里安住？”", "story": "盘山垂语“三界无法，何处求心”，直接截断向外求心。", "meaning": "心不可在对象世界中寻找。", "source": "《碧岩录》第37则。", "tags": ["碧岩录", "盘山", "三界无法", "何处求心", "四大本空"], "score": 3}, {"id": "biyanlu-38", "collection": "碧岩录", "collectionId": "biyanlu", "number": 38, "title": "风穴铁牛之机", "original": "风穴示众云：“若立一尘，家国兴盛；不立一尘，家国丧亡。雪窦拈拄杖\n云：还有同生同死底衲僧么？”", "translation": "风穴对大众说：“若立起一尘，家国兴盛；若不立一尘，家国丧亡。”雪窦拈\n起拄杖说：“还有能同生同死的衲僧吗？”", "story": "风穴以“一尘立与不立”的机锋显出动静去住的危险。", "meaning": "动静去住都不可执，机用贵在活。", "source": "《碧岩录》第38则；亦见《从容录》第29则相关。", "tags": ["碧岩录", "风穴", "一尘", "铁牛机", "立与不立", "机用\n禅宗公案大全：碧岩录卷（100则完整版）\n14"], "score": 3}, {"id": "biyanlu-39", "collection": "碧岩录", "collectionId": "biyanlu", "number": 39, "title": "云门花药栏", "original": "僧问云门：“如何是清净法身？”门云：“花药栏。”僧云：“便恁么去时如\n何？”门云：“金毛狮子。”", "translation": "有僧人问云门：“什么是清净法身？”云门说：“花药栏。”僧人说：“就这样去\n时怎么样？”云门说：“金毛狮子。”", "story": "云门以花药栏、金毛狮子回应清净法身。", "meaning": "清净法身不离眼前花栏，也不落花栏。", "source": "《碧岩录》第39则。", "tags": ["碧岩录", "云门", "清净法身", "花药栏", "金毛狮子"], "score": 3}, {"id": "biyanlu-40", "collection": "碧岩录", "collectionId": "biyanlu", "number": 40, "title": "南泉庭前花如梦", "original": "陆亘大夫问南泉：“肇法师道：天地与我同根，万物与我一体。也甚奇怪。”\n泉指庭前花云：“时人见此一株花，如梦相似。”", "translation": "陆亘大夫问南泉：“肇法师说：天地与我同根，万物与我一体。这真是奇\n特。”南泉指着庭前花说：“现在的人看见这一株花，就像在梦里一样。”", "story": "陆亘谈天地同根，南泉指庭前花说时人看花如梦。", "meaning": "高妙理论若不落真实见地，仍只是梦中看花。", "source": "《碧岩录》第40则。", "tags": ["碧岩录", "南泉", "陆亘", "庭前花", "如梦", "万物一体"], "score": 4}, {"id": "biyanlu-41", "collection": "碧岩录", "collectionId": "biyanlu", "number": 41, "title": "赵州大死底人", "original": "僧问赵州：“大死底人却活时如何？”州云：“不许夜行，投明须到。”", "translation": "有僧人问赵州：“彻底死去的人重新活过来时怎样？”赵州说：“不许夜里行\n走，天亮时必须到达。”", "story": "僧问“大死底人却活时如何”，赵州以夜行与天明回应。", "meaning": "大死大活，是旧我彻底放下后的真实转身。", "source": "《碧岩录》第41则。\n禅宗公案大全：碧岩录卷（100则完整版）\n15", "tags": ["碧岩录", "赵州", "大死大活", "夜行", "天明", "转身"], "score": 4}, {"id": "biyanlu-42", "collection": "碧岩录", "collectionId": "biyanlu", "number": 42, "title": "庞居士好雪片片", "original": "庞居士辞药山，山命十禅客相送。居士指空中雪云：“好雪片片，不落别\n处。”时有全禅客云：“落在甚处？”士打一掌。", "translation": "庞居士辞别药山，药山派十位禅客相送。庞居士指着空中的雪说：“好雪一\n片一片，都没有落到别处。”当时有全禅客问：“落在哪里？”庞居士打了他一掌。", "story": "庞居士见雪，说“好雪片片，不落别处”，又以一掌回应追问。", "meaning": "万物各安其位，当下无一物错落。", "source": "《碧岩录》第42则。", "tags": ["碧岩录", "庞居士", "好雪片片", "不落别处", "雪", "高传播"], "score": 5}, {"id": "biyanlu-43", "collection": "碧岩录", "collectionId": "biyanlu", "number": 43, "title": "洞山无寒暑", "original": "僧问洞山：“寒暑到来，如何回避？”山云：“何不向无寒暑处去？”僧云：\n“如何是无寒暑处？”山云：“寒时寒杀阇黎，热时热杀阇黎。”", "translation": "有僧人问洞山：“寒冷和炎热到来时，怎样躲避？”洞山说：“为什么不去没\n有寒暑的地方？”僧人问：“哪里是没有寒暑的地方？”洞山说：“冷的时候冷死你，\n热的时候热死你。”", "story": "洞山不教人逃避寒暑，而是让人在寒暑中全然承当。", "meaning": "不是逃离寒暑，而是在寒暑中全然承当。", "source": "《碧岩录》第43则。", "tags": ["碧岩录", "洞山", "无寒暑", "寒热", "承当", "高传播"], "score": 5}, {"id": "biyanlu-44", "collection": "碧岩录", "collectionId": "biyanlu", "number": 44, "title": "禾山解打鼓", "original": "禾山垂语云：“习学谓之闻，绝学谓之邻。过此二者，是为真过。”僧出问：\n“如何是真过？”山云：“解打鼓。”又问：“如何是真谛？”山云：“解打鼓。”", "translation": "禾山开示说：“学习叫作闻，断绝学习叫作邻。超过这两者，才是真过。”僧\n人问：“什么是真过？”禾山说：“会打鼓。”又问：“什么是真谛？”禾山说：“会打\n鼓。”\n禅宗公案大全：碧岩录卷（100则完整版）\n16", "story": "禾山多次以“解打鼓”回应问法。", "meaning": "懂佛法要看真实作用，不是看解释漂亮。", "source": "《碧岩录》第44则。", "tags": ["碧岩录", "禾山", "解打鼓", "真谛", "作用", "日用"], "score": 3}, {"id": "biyanlu-45", "collection": "碧岩录", "collectionId": "biyanlu", "number": 45, "title": "赵州衫重七斤", "original": "僧问赵州：“万法归一，一归何处？”州云：“我在青州作一领布衫，重七\n斤。”", "translation": "有僧人问赵州：“万法归于一，这一又归到哪里？”赵州说：“我在青州做过\n一件布衫，重七斤。”", "story": "抽象的“一归何处”被赵州落到一件衣服的重量。", "meaning": "最抽象的问题，也可以被拉回具体日常。", "source": "《碧岩录》第45则。", "tags": ["碧岩录", "赵州", "万法归一", "布衫七斤", "日常物", "高传播"], "score": 5}, {"id": "biyanlu-46", "collection": "碧岩录", "collectionId": "biyanlu", "number": 46, "title": "镜清雨滴声", "original": "镜清问僧：“门外是什么声？”僧云：“雨滴声。”清云：“众生颠倒，迷己逐\n物。”", "translation": "镜清问僧人：“门外是什么声音？”僧人说：“雨滴的声音。”镜清说：“众生颠\n倒，迷失自己而追逐外物。”", "story": "僧答雨滴声，镜清借此指出迷己逐物。", "meaning": "听见声音容易，识得听者难。", "source": "《碧岩录》第46则。", "tags": ["碧岩录", "镜清", "雨滴声", "迷己逐物", "听声", "返观"], "score": 4}, {"id": "biyanlu-47", "collection": "碧岩录", "collectionId": "biyanlu", "number": 47, "title": "云门六不收", "original": "僧问云门：“如何是法身？”门云：“六不收。”", "translation": "有僧人问云门：“什么是法身？”云门说：“六处都收摄不了。”\n禅宗公案大全：碧岩录卷（100则完整版）\n17", "story": "云门以“六不收”破除学人对法身的分类把握。", "meaning": "真正自由处，不被任何分类收摄。", "source": "《碧岩录》第47则。", "tags": ["碧岩录", "云门", "六不收", "法身", "不被分类", "自由"], "score": 3}, {"id": "biyanlu-48", "collection": "碧岩录", "collectionId": "biyanlu", "number": 48, "title": "王太傅煎茶", "original": "王太傅入招庆煎茶。时朗上座与明招把铫。朗翻却茶铫。太傅见，问上\n座：“茶炉下是什么？”朗云：“捧炉神。”太傅云：“既是捧炉神，为什么翻却茶\n铫？”朗云：“官高爵重，受福不长。”", "translation": "王太傅到招庆寺煎茶。当时朗上座与明招拿着茶铫。朗把茶铫翻倒。太傅\n见了问：“茶炉下面是什么？”朗说：“捧炉神。”太傅说：“既然是捧炉神，为什么翻\n倒茶铫？”朗说：“官位高、爵位重，享福不会长久。”", "story": "王太傅与禅师在煎茶、翻茶铫的日用场景中展开机锋。", "meaning": "日常雅事若能照心，也可成为修行。", "source": "《碧岩录》第48则。", "tags": ["碧岩录", "王太傅", "煎茶", "茶铫", "日用", "士大夫"], "score": 4}, {"id": "biyanlu-49", "collection": "碧岩录", "collectionId": "biyanlu", "number": 49, "title": "三圣金鳞", "original": "三圣问雪峰：“透网金鳞，以何为食？”峰云：“待汝出网来，即向汝道。”圣\n云：“一千五百人善知识，话头也不识。”峰云：“老僧住持事繁。”", "translation": "三圣问雪峰：“已经透出网的金鳞鱼，以什么为食？”雪峰说：“等你出网\n来，我就告诉你。”三圣说：“一千五百人的善知识，连话头也不懂。”雪峰说：“老僧\n住持事务繁忙。”", "story": "三圣借“透网金鳞”问出格之人，雪峰以“待汝出网”回应。", "meaning": "真正修行者不困在旧池塘。", "source": "《碧岩录》第49则；亦见《从容录》第33则相关。", "tags": ["碧岩录", "三圣", "雪峰", "金鳞", "透网", "出格"], "score": 3}, {"id": "biyanlu-50", "collection": "碧岩录", "collectionId": "biyanlu", "number": 50, "title": "云门尘尘三昧", "original": "僧问云门：“如何是尘尘三昧？”门云：“钵里饭，桶里水。”", "translation": "有僧人问云门：“什么是每一微尘中的三昧？”云门说：“钵里的饭，桶里的\n水。”", "story": "云门以钵里饭、桶里水回应尘尘三昧。", "meaning": "不必离万物求禅，尘尘处处皆可入道。", "source": "《碧岩录》第50则。", "tags": ["碧岩录", "云门", "尘尘三昧", "饭", "水", "日用"], "score": 3}, {"id": "biyanlu-51", "collection": "碧岩录", "collectionId": "biyanlu", "number": 51, "title": "雪峰是什么", "original": "雪峰住庵时，有僧到。峰托起庵门云：“是什么？”僧亦云：“是什么？”峰低\n头归庵。", "translation": "雪峰住庵时，有僧人到来。雪峰托起庵门说：“是什么？”僧人也说：“是什\n么？”雪峰低头回到庵中。", "story": "雪峰托庵门问“是什么”，僧也反问“是什么”。", "meaning": "“是什么”不是定义题，而是当场验人。", "source": "《碧岩录》第51则；亦见《从容录》第50则相关。", "tags": ["碧岩录", "雪峰", "是什么", "庵门", "勘验"], "score": 3}, {"id": "biyanlu-52", "collection": "碧岩录", "collectionId": "biyanlu", "number": 52, "title": "赵州石桥", "original": "僧问赵州：“久向赵州石桥，到来只见略彴。”州云：“汝只见略彴，不见石\n桥。”僧云：“如何是石桥？”州云：“度驴度马。”", "translation": "有僧人问赵州：“久闻赵州石桥，来了只看见小木桥。”赵州说：“你只看见小\n木桥，没有看见石桥。”僧人问：“什么是石桥？”赵州说：“能渡驴，也能渡马。”", "story": "僧嫌赵州石桥不如传闻，赵州以能渡驴马说明真桥。", "meaning": "名声大小不重要，能不能渡人最重要。", "source": "《碧岩录》第52则。", "tags": ["碧岩录", "赵州", "石桥", "略彴", "渡人", "实用"], "score": 4}, {"id": "biyanlu-53", "collection": "碧岩录", "collectionId": "biyanlu", "number": 53, "title": "百丈野鸭子", "original": "马大师与百丈行次，见野鸭子飞过。大师云：“是什么？”丈云：“野鸭子。”\n大师云：“什么处去也？”丈云：“飞过去也。”大师遂扭百丈鼻头。丈作忍痛声。大\n师云：“又道飞过去也。”", "translation": "马祖和百丈同行，看见野鸭飞过。马祖问：“那是什么？”百丈说：“野鸭\n子。”马祖问：“到哪里去了？”百丈说：“飞过去了。”马祖便扭百丈的鼻子。百丈痛\n叫。马祖说：“还说飞过去了吗？”", "story": "百丈说野鸭飞过去，马祖扭鼻使他回到痛切当下。", "meaning": "以为境界飞走了，其实痛切当下从未离开。", "source": "《碧岩录》第53则。", "tags": ["碧岩录", "马祖", "百丈", "野鸭子", "当下", "高传播"], "score": 5}, {"id": "biyanlu-54", "collection": "碧岩录", "collectionId": "biyanlu", "number": 54, "title": "云门展两手", "original": "僧问云门：“如何是诸佛出身处？”门云：“东山水上行。”僧云：“如何是学人\n自己？”门云：“游山玩水。”僧云：“如何是和尚家风？”门展两手。", "translation": "有僧人问云门：“什么是诸佛出生的地方？”云门说：“东山在水上行。”僧又\n问：“什么是学生自己？”云门说：“游山玩水。”僧又问：“什么是和尚的家风？”云\n门展开两手。", "story": "云门以语言和展手动作回应问法，直接呈现机用。", "meaning": "身体动作有时比解释更接近答案。", "source": "《碧岩录》第54则。", "tags": ["碧岩录", "云门", "展手", "东山水上行", "家风", "动作"], "score": 3}, {"id": "biyanlu-55", "collection": "碧岩录", "collectionId": "biyanlu", "number": 55, "title": "道吾吊慰", "original": "道吾与渐源到一家吊慰。源拍棺云：“生邪？死邪？”吾云：“生也不道，死\n也不道。”源云：“为什么不道？”吾云：“不道！不道！”", "translation": "道吾与渐源到一户人家吊丧。渐源拍着棺材问：“是生，还是死？”道吾说：\n“生也不说，死也不说。”渐源问：“为什么不说？”道吾说：“不说！不说！”", "story": "道吾与渐源在吊丧处围绕生死、棺木发问。\n禅宗公案大全：碧岩录卷（100则完整版）\n20", "meaning": "面对死亡，禅师不讲安慰话，而是直面生死。", "source": "《碧岩录》第55则。", "tags": ["碧岩录", "道吾", "渐源", "吊丧", "生死", "不道"], "score": 4}, {"id": "biyanlu-56", "collection": "碧岩录", "collectionId": "biyanlu", "number": 56, "title": "钦山一镞破三关", "original": "良禅客问钦山：“一镞破三关时如何？”山云：“放出关中主看。”良云：“恁么\n则知过必改。”山云：“更待何时？”良云：“好箭放不著所在。”便出。山云：“且来阇\n黎。”良回首。山把住云：“一镞破三关即且置，试与钦山发箭看。”良拟议。山便打\n七棒。", "translation": "良禅客问钦山：“一箭射破三关时怎么样？”钦山说：“放出关中主人来看\n看。”良说：“这样就知道有过必改。”钦山说：“还等什么时候？”良说：“好箭射不到\n地方。”便要出去。钦山说：“且回来。”良回头。钦山抓住他说：“一箭破三关暂且不\n说，试着替钦山射一箭看。”良正要思量，钦山便打他七棒。", "story": "钦山以一箭破三关为喻，追逼学人真实发箭。", "meaning": "真见地能一击穿透层层关卡。", "source": "《碧岩录》第56则。", "tags": ["碧岩录", "钦山", "一镞破三关", "箭", "勘验"], "score": 3}, {"id": "biyanlu-57", "collection": "碧岩录", "collectionId": "biyanlu", "number": 57, "title": "赵州不知", "original": "僧问赵州：“至道无难，唯嫌拣择。如何是不拣择？”州云：“天上天下，唯\n我独尊。”僧云：“此犹是拣择。”州云：“田厍奴！什么处是拣择？”僧无语。", "translation": "僧问赵州：“最高的道并不难，只怕分别选择。什么是不选择？”赵州说：\n“天上地下，唯我独尊。”僧人说：“这还是选择。”赵州说：“田厍奴！哪里是选择？”\n僧人无话可说。", "story": "赵州以看似强烈的话逼问学人对“拣择”的执著。", "meaning": "禅门的不知与不拣择，不是无知，而是不落知解。", "source": "《碧岩录》第57则。", "tags": ["碧岩录", "赵州", "不拣择", "唯我独尊", "知解"], "score": 3}, {"id": "biyanlu-58", "collection": "碧岩录", "collectionId": "biyanlu", "number": 58, "title": "赵州不会", "original": "僧问赵州：“至道无难，唯嫌拣择。才有语言，是拣择，是明白。和尚如何\n为人？”州云：“何不引尽这语？”僧云：“某甲只念到这里。”州云：“只这至道无\n难，唯嫌拣择。”", "translation": "有僧人问赵州：“至道无难，唯嫌拣择。才有语言，就是拣择，就是明白。\n和尚怎样为人？”赵州说：“为什么不把这句话引完？”僧人说：“我只念到这里。”赵\n州说：“就是这个至道无难，唯嫌拣择。”", "story": "赵州把学人停在半句知解中的问题重新还给他。", "meaning": "会与不会都可成为活句，死守一句便错。", "source": "《碧岩录》第58则。", "tags": ["碧岩录", "赵州", "至道无难", "不会", "活句"], "score": 3}, {"id": "biyanlu-59", "collection": "碧岩录", "collectionId": "biyanlu", "number": 59, "title": "赵州唯嫌拣择", "original": "赵州示众云：“至道无难，唯嫌拣择。才有是非，纷然失心。”", "translation": "赵州对大众说：“最高的道并不难，只怕分别选择。只要起了是非，心就纷\n乱而迷失。”", "story": "赵州反复拈“至道无难，唯嫌拣择”，令学人看见分别心。", "meaning": "修行难，多由取舍分别生起。", "source": "《碧岩录》第59则相关赵州系统。", "tags": ["碧岩录", "赵州", "唯嫌拣择", "是非", "分别心"], "score": 4}, {"id": "biyanlu-60", "collection": "碧岩录", "collectionId": "biyanlu", "number": 60, "title": "云门拄杖化龙", "original": "云门以拄杖示众云：“拄杖子化为龙，吞却乾坤了也。山河大地，甚处得\n来？”", "translation": "云门拿拄杖对大众说：“这根拄杖化成龙，把天地乾坤都吞掉了。山河大地\n又从哪里来？”", "story": "云门说拄杖化龙吞却乾坤，追问山河大地从何而来。", "meaning": "一根拄杖也可吞吐宇宙，显示禅宗语言张力。", "source": "《碧岩录》第60则。\n禅宗公案大全：碧岩录卷（100则完整版）\n22", "tags": ["碧岩录", "云门", "拄杖化龙", "乾坤", "山河大地"], "score": 4}, {"id": "biyanlu-61", "collection": "碧岩录", "collectionId": "biyanlu", "number": 61, "title": "风穴一尘", "original": "风穴示众云：“若立一尘，家国兴盛；不立一尘，家国丧亡。”", "translation": "风穴对大众说：“如果立起一粒微尘，家国兴盛；如果不立一粒微尘，家国\n丧亡。”", "story": "风穴以一尘立与不立开示，微尘与世界互相映照。", "meaning": "一尘中可见大千世界。", "source": "《碧岩录》第61则；亦见《从容录》第34则相关。", "tags": ["碧岩录", "风穴", "一尘", "家国", "微尘", "大千"], "score": 3}, {"id": "biyanlu-62", "collection": "碧岩录", "collectionId": "biyanlu", "number": 62, "title": "云门一宝", "original": "云门示众云：“乾坤之内，宇宙之间，中有一宝，秘在形山。”", "translation": "云门对大众说：“天地之内、宇宙之间，有一件宝物，秘密藏在人的身体这\n座山中。”", "story": "云门说乾坤宇宙中有一宝，秘在形山。", "meaning": "宝不在外求，就藏在此身此心。", "source": "《碧岩录》第62则；亦见《从容录》第92则相关。", "tags": ["碧岩录", "云门", "一宝", "形山", "自心", "宝藏"], "score": 4}, {"id": "biyanlu-63", "collection": "碧岩录", "collectionId": "biyanlu", "number": 63, "title": "南泉斩猫再拈", "original": "南泉一日东西两堂争猫儿。泉见，遂提起云：“道得即不斩。”众无对。泉斩\n猫儿为两段。", "translation": "有一天南泉见东西两堂争一只猫，就把猫提起来说：“说得出一句就不斩。”\n众人都答不上来。南泉把猫斩为两段。", "story": "《碧岩录》重新拈出南泉斩猫，围绕道得、道不得、斩与不斩展开评\n唱。", "meaning": "经典公案可被不断重参，每次都能照见新的执著。\n禅宗公案大全：碧岩录卷（100则完整版）\n23", "source": "《碧岩录》第63则；南泉斩猫系统。", "tags": ["碧岩录", "南泉", "斩猫", "东西堂", "争执", "重参"], "score": 4}, {"id": "biyanlu-64", "collection": "碧岩录", "collectionId": "biyanlu", "number": 64, "title": "赵州戴草鞋", "original": "赵州晚归，南泉举前话。州乃脱草鞋，安头上而出。泉云：“子若在，救得\n猫儿。”", "translation": "赵州晚上回来，南泉把斩猫的事告诉他。赵州便脱下草鞋，放在头上走出\n去。南泉说：“你若当时在，就能救得猫。”", "story": "赵州听闻南泉斩猫，脱草鞋戴在头上而出。", "meaning": "行动超出常理，正是跳出争执框架的回答。", "source": "《碧岩录》第64则；南泉斩猫系统。", "tags": ["碧岩录", "赵州", "草鞋戴头", "南泉斩猫", "反常", "救猫"], "score": 5}, {"id": "biyanlu-65", "collection": "碧岩录", "collectionId": "biyanlu", "number": 65, "title": "外道问佛", "original": "外道问佛：“不问有言，不问无言。”世尊良久。外道赞叹云：“世尊大慈大\n悲，开我迷云，令我得入。”", "translation": "外道问佛：“我不问有语言，也不问无语言。”世尊沉默很久。外道赞叹说：\n“世尊大慈大悲，拨开我的迷云，使我得以进入。”", "story": "外道不问有言无言，佛以沉默相应。", "meaning": "真正回答不落语言，也不落沉默。", "source": "《碧岩录》第65则；亦见《无门关》第32则。", "tags": ["碧岩录", "世尊", "外道", "有言无言", "沉默", "不二"], "score": 4}, {"id": "biyanlu-66", "collection": "碧岩录", "collectionId": "biyanlu", "number": 66, "title": "岩头末后句", "original": "岩头云：“末后句，始到牢关。把断要津，不通凡圣。”", "translation": "岩头说：“最后一句，才到牢固关口。把住要道，不让凡圣通行。”", "story": "岩头以“末后句”点破同参未到处，让人知道语言尽处仍有一关。", "meaning": "最后一句不在句子里，而在生命转身处。\n禅宗公案大全：碧岩录卷（100则完整版）\n24", "source": "《碧岩录》第66则相关岩头系统。", "tags": ["碧岩录", "岩头", "末后句", "牢关", "凡圣", "转身"], "score": 3}, {"id": "biyanlu-67", "collection": "碧岩录", "collectionId": "biyanlu", "number": 67, "title": "傅大士讲经", "original": "梁武帝请傅大士讲《金刚经》。大士才升座，以尺挥案一下，便下座。帝愕\n然。志公问：“陛下会么？”帝云：“不会。”志公云：“大士讲经竟。”", "translation": "梁武帝请傅大士讲《金刚经》。傅大士刚升座，就用尺子拍案一下，然后下\n座。皇帝很惊愕。志公问：“陛下明白吗？”皇帝说：“不明白。”志公说：“大士已经\n讲完经了。”", "story": "傅大士受请讲经，登座拍案一下便下座。", "meaning": "真正讲经不必铺陈文字，一拍也能尽显。", "source": "《碧岩录》第67则相关；灯录系统。", "tags": ["碧岩录", "傅大士", "讲经", "金刚经", "拍案", "高传播"], "score": 5}, {"id": "biyanlu-68", "collection": "碧岩录", "collectionId": "biyanlu", "number": 68, "title": "仰山问性", "original": "仰山问僧：“甚处来？”僧云：“幽州。”山云：“还思彼中么？”僧云：“常思。”\n山云：“能思是心，所思是境。彼中山河大地、楼台殿阁、人畜等物，反思思底\n心，还有许多般也无？”僧无语。", "translation": "仰山问僧人：“从哪里来？”僧说：“幽州。”仰山问：“还想念那里吗？”僧\n说：“常常想。”仰山说：“能想的是心，所想的是境。那里的山河大地、楼台殿阁、\n人和牲畜等物，反过来想想这个能思的心，还有那么多种吗？”僧人无语。", "story": "仰山围绕心与境、能思与所思设问。", "meaning": "性不是对象，要在当下作用处见。", "source": "《碧岩录》第68则相关沩仰系统。", "tags": ["碧岩录", "仰山", "心境", "能思所思", "自性"], "score": 3}, {"id": "biyanlu-69", "collection": "碧岩录", "collectionId": "biyanlu", "number": 69, "title": "南泉白牯牛", "original": "南泉示众云：“王老师自小养一头水牯牛，拟向溪东牧，不免食他国王水\n草；拟向溪西牧，亦不免食他国王水草。不如随分纳些些，总不见得。”\n禅宗公案大全：碧岩录卷（100则完整版）\n25", "translation": "南泉对大众说：“王老师从小养了一头水牯牛，想在溪东放牧，免不了吃国\n王的水草；想在溪西放牧，也免不了吃国王的水草。不如随分纳一点点，反而总\n不见得。”", "story": "南泉以水牯牛、溪东溪西等意象谈还债与自在。", "meaning": "圣凡、人畜、还债与自在的边界被打破。", "source": "《碧岩录》第69则；亦见《从容录》第69则。", "tags": ["碧岩录", "南泉", "水牯牛", "白牯牛", "还债", "自在"], "score": 4}, {"id": "biyanlu-70", "collection": "碧岩录", "collectionId": "biyanlu", "number": 70, "title": "沩山业识", "original": "沩山问仰山：“忽有人问，百年后向什么处去，作么生祇对？”仰山云：“作\n一头水牯牛。”沩山云：“是则是，只是不得作水牯牛。”", "translation": "沩山问仰山：“如果有人问，百年之后到哪里去，该怎样回答？”仰山说：\n“作一头水牯牛。”沩山说：“这样是这样，只是不能作水牯牛。”", "story": "围绕百年后去处与水牯牛展开问答，直指生命流转惯性。", "meaning": "若不照见业识，人会被惯性牵引一生。", "source": "《碧岩录》第70则；亦见《从容录》第37则相关。", "tags": ["碧岩录", "沩山", "仰山", "业识", "水牯牛", "生死去处"], "score": 3}, {"id": "biyanlu-71", "collection": "碧岩录", "collectionId": "biyanlu", "number": 71, "title": "五峰并却咽喉", "original": "五峰云：“并却咽喉唇吻，道将一句来。”僧无语。峰云：“合取狗口。”", "translation": "五峰说：“把咽喉和嘴唇都并却不用，说一句来。”僧人无话可说。五峰说：\n“把狗嘴闭上。”", "story": "五峰以“并却咽喉唇吻”逼问，让学人在不能开口处显露见地。", "meaning": "不能说时，才知道有没有真实出路。", "source": "《碧岩录》第71则相关。", "tags": ["碧岩录", "五峰", "咽喉", "不能说", "出路", "勘验"], "score": 3}, {"id": "biyanlu-72", "collection": "碧岩录", "collectionId": "biyanlu", "number": 72, "title": "百丈问五峰", "original": "百丈问五峰：“并却咽喉唇吻，作么生道？”峰云：“和尚也须并却。”丈云：\n“无人处斫额望汝。”", "translation": "百丈问五峰：“把咽喉和嘴唇都并却不用，怎样说？”五峰说：“和尚也必须\n并却。”百丈说：“我在无人处翘首望你。”", "story": "百丈与五峰围绕不用口舌如何说法往返勘验。", "meaning": "师徒相见不是知识问答，而是互相验眼。", "source": "《碧岩录》第72则相关。", "tags": ["碧岩录", "百丈", "五峰", "咽喉", "师徒", "验眼"], "score": 3}, {"id": "biyanlu-73", "collection": "碧岩录", "collectionId": "biyanlu", "number": 73, "title": "马祖四句百非", "original": "僧问马大师：“离四句，绝百非，请师直指某甲西来意。”大师云：“我今日劳\n倦，不能为汝说，问取智藏去。”僧问智藏，藏云：“何不问和尚？”僧云：“和尚令\n问上座。”藏云：“今日头痛，问取海兄去。”僧问百丈。丈云：“到这里却不会。”", "translation": "僧问马祖：“离开四句、断绝百非，请师父直接指示祖师西来的意思。”马祖\n说：“我今天疲倦，不能为你说，去问智藏。”僧去问智藏，智藏说：“为什么不问和\n尚？”僧说：“和尚让我问上座。”智藏说：“我今天头痛，去问百丈。”僧问百丈。百\n丈说：“到这里我却不会。”", "story": "僧请马祖离四句绝百非直指西来意，被三位禅师层层转手。", "meaning": "越想绕开概念，越可能被概念缠住。", "source": "《碧岩录》第73则；亦见《从容录》第6则系统。", "tags": ["碧岩录", "马祖", "智藏", "百丈", "四句百非", "祖师西来意"], "score": 4}, {"id": "biyanlu-74", "collection": "碧岩录", "collectionId": "biyanlu", "number": 74, "title": "金牛饭桶", "original": "金牛和尚斋时，自将饭桶于僧堂前作舞，呵呵大笑云：“菩萨子，吃饭来。”", "translation": "金牛和尚在吃斋时，自己拿着饭桶在僧堂前跳舞，哈哈大笑说：“菩萨子\n们，来吃饭。”", "story": "金牛和尚在斋饭日用中接人，围绕饭桶、吃饭显出禅机。", "meaning": "吃饭处就是修行处。", "source": "《碧岩录》第74则相关。\n禅宗公案大全：碧岩录卷（100则完整版）\n27", "tags": ["碧岩录", "金牛", "饭桶", "吃饭", "日用", "舞蹈"], "score": 4}, {"id": "biyanlu-75", "collection": "碧岩录", "collectionId": "biyanlu", "number": 75, "title": "乌臼屈棒", "original": "僧问乌臼：“如何是佛法大意？”臼云：“待堂头来，向汝道。”僧云：“只今便\n请和尚道。”臼便打。僧云：“和尚打某甲不得。”臼云：“棒头有眼。”", "translation": "僧问乌臼：“什么是佛法大意？”乌臼说：“等堂头来，向你说。”僧说：“现在\n就请和尚说。”乌臼便打。僧说：“和尚打不得我。”乌臼说：“棒头上有眼睛。”", "story": "乌臼以棒接人，来者在棒下显出承当或退缩。", "meaning": "棒不是暴力，而是截断迟疑。", "source": "《碧岩录》第75则相关。", "tags": ["碧岩录", "乌臼", "棒", "佛法大意", "棒头有眼"], "score": 3}, {"id": "biyanlu-76", "collection": "碧岩录", "collectionId": "biyanlu", "number": 76, "title": "丹霞问甚处来", "original": "丹霞问僧：“甚处来？”僧云：“山下来。”霞云：“吃饭了也未？”僧云：“吃饭\n了也。”霞云：“将饭与汝吃底人，还具眼么？”僧无语。", "translation": "丹霞问僧人：“从哪里来？”僧说：“山下来。”丹霞问：“吃过饭了吗？”僧\n说：“吃过了。”丹霞说：“给你饭吃的人，有眼目吗？”僧人无语。", "story": "丹霞以寻常问话接人，来者答处便露出见地深浅。", "meaning": "普通寒暄也可成为禅门关口。", "source": "《碧岩录》第76则相关丹霞系统。", "tags": ["碧岩录", "丹霞", "问来处", "吃饭", "眼目", "日常勘验"], "score": 3}, {"id": "biyanlu-77", "collection": "碧岩录", "collectionId": "biyanlu", "number": 77, "title": "云门饼", "original": "僧问云门：“如何是超佛越祖之谈？”门云：“糊饼。”", "translation": "有僧人问云门：“什么是超越佛祖的谈论？”云门说：“糊饼。”", "story": "云门以糊饼回应超佛越祖之问，把玄妙问题落在可吃之物上。", "meaning": "饥来吃饭，日用即真。", "source": "《碧岩录》第77则；云门语录系统。\n禅宗公案大全：碧岩录卷（100则完整版）\n28", "tags": ["碧岩录", "云门", "糊饼", "超佛越祖", "日用", "高传播"], "score": 5}, {"id": "biyanlu-78", "collection": "碧岩录", "collectionId": "biyanlu", "number": 78, "title": "十六开士入浴", "original": "古有十六开士，因僧浴次，随例入浴。忽悟水因，诸禅德作么生会？", "translation": "古时有十六位开士，在僧众沐浴时，照例入浴。忽然从水这个因缘中悟\n入。诸位禅德怎样理解？", "story": "十六开士入浴，因触水而悟入。", "meaning": "身体感受与日常行为也可成为法门。", "source": "《碧岩录》第78则。", "tags": ["碧岩录", "十六开士", "入浴", "水因", "身体", "日常悟入"], "score": 4}, {"id": "biyanlu-79", "collection": "碧岩录", "collectionId": "biyanlu", "number": 79, "title": "投子一切声", "original": "僧问投子：“一切声是佛声，是否？”子云：“是。”僧便喝。子云：“阇黎莫谤\n佛。”", "translation": "有僧人问投子：“一切声音都是佛的声音，是吗？”投子说：“是。”僧人便喝\n一声。投子说：“阇黎不要诽谤佛。”", "story": "投子围绕一切声与佛声展开问答，让学人从声音中返观。", "meaning": "声音不是障碍，随声逐色才是障碍。", "source": "《碧岩录》第79则相关投子系统。", "tags": ["碧岩录", "投子", "一切声", "佛声", "喝", "返观"], "score": 3}, {"id": "biyanlu-80", "collection": "碧岩录", "collectionId": "biyanlu", "number": 80, "title": "赵州初生孩子", "original": "僧问赵州：“初生孩子还具六识也无？”州云：“急水上打球子。”僧后问投\n子：“急水上打球子，意旨如何？”子云：“念念不停流。”", "translation": "有僧人问赵州：“刚出生的孩子具不具备六识？”赵州说：“在急流上打球。”\n后来僧人又问投子：“急流上打球是什么意思？”投子说：“念念不停地流动。”", "story": "赵州以初生孩子和急水打球为喻，问纯真与识的关系。", "meaning": "纯真不是昏昧，无分别也不是无知。\n禅宗公案大全：碧岩录卷（100则完整版）\n29", "source": "《碧岩录》第80则相关赵州系统。", "tags": ["碧岩录", "赵州", "初生孩子", "六识", "急水打球", "念念"], "score": 4}, {"id": "biyanlu-81", "collection": "碧岩录", "collectionId": "biyanlu", "number": 81, "title": "药山麈中麈", "original": "僧问药山：“平田浅草，麈鹿成群。如何射得麈中麈？”山云：“看箭。”僧放\n身便倒。山云：“侍者，拖出这死汉。”", "translation": "有僧人问药山：“平田浅草中，鹿群成群。怎样射到鹿中之鹿？”药山说：\n“看箭。”僧人便倒下。药山说：“侍者，把这个死汉拖出去。”", "story": "药山借射鹿之喻，勘验学人是否真能应机。", "meaning": "最细微处也可显全体，但不可装死作态。", "source": "《碧岩录》第81则相关药山系统。", "tags": ["碧岩录", "药山", "麈中麈", "看箭", "勘验"], "score": 2}, {"id": "biyanlu-82", "collection": "碧岩录", "collectionId": "biyanlu", "number": 82, "title": "大龙坚固法身", "original": "僧问大龙：“色身败坏，如何是坚固法身？”龙云：“山花开似锦，涧水湛如\n蓝。”", "translation": "有僧人问大龙：“色身会败坏，什么是坚固法身？”大龙说：“山花开得像锦\n绣，溪水清澈得像蓝色。”", "story": "大龙以山花、涧水回应坚固法身之问。", "meaning": "法身不只是抽象坚固，也可由山花竹色显现。", "source": "《碧岩录》第82则相关。", "tags": ["碧岩录", "大龙", "坚固法身", "山花", "涧水", "自然"], "score": 3}, {"id": "biyanlu-83", "collection": "碧岩录", "collectionId": "biyanlu", "number": 83, "title": "云门古佛露柱", "original": "云门示众云：“古佛与露柱相交，是第几机？”众无语。自代云：“南山起\n云，北山下雨。”", "translation": "云门对大众说：“古佛与露柱相交，是第几种机？”众人无语。他自己代答：\n“南山起云，北山下雨。”\n禅宗公案大全：碧岩录卷（100则完整版）\n30", "story": "云门以古佛、露柱、南山云雨显出无情说法。", "meaning": "无情物也能说法。", "source": "《碧岩录》第83则；亦见《从容录》第31则相关。", "tags": ["碧岩录", "云门", "古佛", "露柱", "无情说法", "云雨"], "score": 3}, {"id": "biyanlu-84", "collection": "碧岩录", "collectionId": "biyanlu", "number": 84, "title": "维摩不二", "original": "维摩诘问文殊师利：“何等是菩萨入不二法门？”文殊曰：“于一切法无言无\n说，无示无识，离诸问答，是为入不二法门。”于是文殊问维摩。维摩默然。", "translation": "维摩诘问文殊：“什么是菩萨入不二法门？”文殊说：“对一切法无言无说、\n无表示无认识，离开各种问答，就是入不二法门。”于是文殊反问维摩。维摩沉默\n不语。", "story": "诸菩萨各说不二法门，维摩默然，被文殊赞叹。", "meaning": "真正不二处，语言难以进入。", "source": "《碧岩录》第84则；《维摩诘经》不二法门。", "tags": ["碧岩录", "维摩", "文殊", "不二法门", "默然", "高传播"], "score": 5}, {"id": "biyanlu-85", "collection": "碧岩录", "collectionId": "biyanlu", "number": 85, "title": "桐峰庵主虎声", "original": "桐峰庵主示众云：“若论此事，直须如虎戴角，威风凛凛始得。”", "translation": "桐峰庵主对大众说：“若论这件事，必须像老虎戴角一样，威风凛凛才行。”", "story": "山林庵主以虎声、虎势、山居气象接人。", "meaning": "山野孤庵也可成为大道场。", "source": "《碧岩录》第85则相关。", "tags": ["碧岩录", "桐峰", "庵主", "虎", "山居", "孤峻"], "score": 2}, {"id": "biyanlu-86", "collection": "碧岩录", "collectionId": "biyanlu", "number": 86, "title": "云门厨库三门", "original": "云门问僧：“甚处来？”僧云：“礼塔来。”门云：“五戒也不持。”僧无语。门代\n云：“厨库三门。”\n禅宗公案大全：碧岩录卷（100则完整版）\n31", "translation": "云门问僧人：“从哪里来？”僧说：“礼塔回来。”云门说：“连五戒也不持。”僧\n人无语。云门代答：“厨房、库房、山门。”", "story": "云门以厨库三门等寺院空间答问，把日常建筑变成法门。", "meaning": "道场中处处都有入处。", "source": "《碧岩录》第86则相关云门系统。", "tags": ["碧岩录", "云门", "厨库", "三门", "寺院日常", "道场"], "score": 3}, {"id": "biyanlu-87", "collection": "碧岩录", "collectionId": "biyanlu", "number": 87, "title": "药山看经", "original": "药山久不看经。一日看经，僧问：“和尚寻常不许人看经，为甚却自看？”山\n云：“我只图遮眼。”僧云：“某甲学和尚还得也无？”山云：“若是汝，牛皮也须看\n透。”", "translation": "药山很久不看经。有一天看经，僧人问：“和尚平常不许别人看经，为什么\n自己却看？”药山说：“我只是为了遮遮眼。”僧人问：“我学和尚这样可以吗？”药山\n说：“如果是你，连牛皮也要看穿。”", "story": "药山平日不许人死看经，却自己看经，借机点出看与不看的差别。", "meaning": "规则不是死的，关键是是否被文字转。", "source": "《碧岩录》第87则相关。", "tags": ["碧岩录", "药山", "看经", "文字", "牛皮看透", "规则"], "score": 4}, {"id": "biyanlu-88", "collection": "碧岩录", "collectionId": "biyanlu", "number": 88, "title": "玄沙三种病人", "original": "玄沙示众云：“诸方老宿，尽道接物利生。忽遇三种病人来，作么生接？患\n盲底，拈槌竖拂，他又不见；患聋底，语言三昧，他又不闻；患哑底，教伊说又\n说不得。”", "translation": "玄沙对大众说：“各方老宿都说接引众生、利益众生。忽然遇到三种病人\n来，怎样接引？盲人来了，拈槌竖拂他看不见；聋人来了，语言三昧他听不见；\n哑人来了，叫他说又说不出。”", "story": "玄沙谈盲、聋、哑三种病人，追问如何接引最难接引者。", "meaning": "真正慈悲要面对最难沟通的生命处境。", "source": "《碧岩录》第88则相关玄沙系统。\n禅宗公案大全：碧岩录卷（100则完整版）\n32", "tags": ["碧岩录", "玄沙", "三种病人", "盲聋哑", "接引", "慈悲"], "score": 4}, {"id": "biyanlu-89", "collection": "碧岩录", "collectionId": "biyanlu", "number": 89, "title": "云岩大悲手眼", "original": "云岩问道吾：“大悲菩萨用许多手眼作么？”吾云：“如人夜间背手摸枕子。”\n岩云：“我会也。”吾云：“汝作么生会？”岩云：“遍身是手眼。”吾云：“道即太煞\n道，只道得八成。”岩云：“师兄作么生？”吾云：“通身是手眼。”", "translation": "云岩问道吾：“大悲菩萨用那么多手眼做什么？”道吾说：“就像人夜里背着\n手摸枕头。”云岩说：“我明白了。”道吾问：“你怎样明白？”云岩说：“全身都是手\n眼。”道吾说：“说是说得很到位，但只说了八成。”云岩问：“师兄怎么说？”道吾\n说：“通身都是手眼。”", "story": "云岩问大悲菩萨千手千眼，道吾以夜间摸枕回应。", "meaning": "慈悲不是局部功能，而是全身心回应世界。", "source": "《碧岩录》第89则；亦见《从容录》第54则。", "tags": ["碧岩录", "云岩", "道吾", "大悲菩萨", "手眼", "慈悲", "高传播"], "score": 5}, {"id": "biyanlu-90", "collection": "碧岩录", "collectionId": "biyanlu", "number": 90, "title": "智门般若体", "original": "僧问智门：“如何是般若体？”门云：“蚌含明月。”僧云：“如何是般若用？”\n门云：“兔子怀胎。”", "translation": "有僧人问智门：“什么是般若的体？”智门说：“蚌含着明月。”僧人问：“什么\n是般若的用？”智门说：“兔子怀胎。”", "story": "智门围绕般若体与作用答问，避免学人把般若当抽象名词。", "meaning": "智慧必须落实为活用。", "source": "《碧岩录》第90则相关智门系统。", "tags": ["碧岩录", "智门", "般若", "蚌含明月", "兔子怀胎", "体用"], "score": 3}, {"id": "biyanlu-91", "collection": "碧岩录", "collectionId": "biyanlu", "number": 91, "title": "盐官犀牛扇子", "original": "盐官一日唤侍者：“将犀牛扇子来。”者云：“扇子破也。”官云：“扇子既破，\n还我犀牛儿来。”者无对。\n禅宗公案大全：碧岩录卷（100则完整版）\n33", "translation": "盐官有一天叫侍者：“把犀牛扇子拿来。”侍者说：“扇子破了。”盐官说：“扇\n子既然破了，把犀牛还给我。”侍者无言以对。", "story": "盐官要犀牛扇子，侍者说破了，盐官要还犀牛儿。", "meaning": "物坏了，还要看见执物之心。", "source": "《碧岩录》第91则；亦见《从容录》第25则。", "tags": ["碧岩录", "盐官", "犀牛扇子", "物", "执著", "还我犀牛"], "score": 3}, {"id": "biyanlu-92", "collection": "碧岩录", "collectionId": "biyanlu", "number": 92, "title": "世尊升座", "original": "世尊一日升座。文殊白槌云：“谛观法王法，法王法如是。”世尊便下座。", "translation": "世尊有一天升座。文殊敲槌说：“仔细观察法王之法，法王之法就是这样。”\n世尊便下座。", "story": "世尊升座后一句不说，文殊白槌，世尊随即下座。", "meaning": "无言说法，是禅门极简而有力的开场。", "source": "《碧岩录》第92则；亦见《从容录》第1则。", "tags": ["碧岩录", "世尊", "文殊", "升座", "无言说法", "高传播"], "score": 5}, {"id": "biyanlu-93", "collection": "碧岩录", "collectionId": "biyanlu", "number": 93, "title": "大光作舞", "original": "大光因庞居士问：“久响大光，到来只见作舞。”光云：“只这作舞，亦不容\n易。”", "translation": "庞居士问大光：“久闻大光，来到这里只看见作舞。”大光说：“就是这个作\n舞，也不容易。”", "story": "大光在问答中以作舞等动作回应，让学人无法只用语言理解。", "meaning": "身体姿态也可以成为法语。", "source": "《碧岩录》第93则相关。", "tags": ["碧岩录", "大光", "庞居士", "作舞", "身体语言"], "score": 3}, {"id": "biyanlu-94", "collection": "碧岩录", "collectionId": "biyanlu", "number": 94, "title": "楞严不见", "original": "《楞严》云：“吾不见时，何不见吾不见之处？若见不见，自然非彼不见之\n相。”", "translation": "《楞严经》说：“我不见时，为什么不见我不见的地方？如果看见了不见，\n那自然就不是那个不见的相。”", "story": "围绕《楞严经》见与不见的经义，禅师以机锋破除文字理解。", "meaning": "读经不是解释概念，而是照见自己。", "source": "《碧岩录》第94则；亦见《从容录》第88则相关。", "tags": ["碧岩录", "楞严经", "见不见", "经义", "读经", "照见"], "score": 3}, {"id": "biyanlu-95", "collection": "碧岩录", "collectionId": "biyanlu", "number": 95, "title": "长庆三毒", "original": "长庆云：“宁说阿罗汉有三毒，不说如来有二种语。”", "translation": "长庆说：“宁可说阿罗汉还有贪嗔痴三毒，也不说如来有两种不同的话。”", "story": "长庆借三毒与如来语，检验学人对烦恼和佛语的理解。", "meaning": "烦恼不是题外话，正是修行入口。", "source": "《碧岩录》第95则相关。", "tags": ["碧岩录", "长庆", "三毒", "如来语", "烦恼", "修行入口"], "score": 3}, {"id": "biyanlu-96", "collection": "碧岩录", "collectionId": "biyanlu", "number": 96, "title": "赵州三个转语", "original": "赵州示众云：“老僧三十年前在南方火炉头，有个无宾主话，至今举似人不\n得。”", "translation": "赵州对大众说：“老僧三十年前在南方火炉边，有一句没有宾主的话，到现\n在也举给别人不得。”", "story": "赵州以连续转语应机，不让学人停在任一答案。", "meaning": "活句不断转动，死守一句便错。", "source": "《碧岩录》第96则相关赵州系统。", "tags": ["碧岩录", "赵州", "转语", "宾主", "活句", "火炉头"], "score": 3}, {"id": "biyanlu-97", "collection": "碧岩录", "collectionId": "biyanlu", "number": 97, "title": "金刚经轻贱", "original": "《金刚经》云：“若为人轻贱，是人先世罪业，应堕恶道；以今世人轻贱\n故，先世罪业即为消灭。”", "translation": "《金刚经》说：“如果被人轻视贱辱，这个人过去世的罪业本应堕入恶道；\n因为今世被人轻贱的缘故，过去世罪业就得以消灭。”", "story": "围绕《金刚经》中“为人轻贱”经文展开禅门解读。", "meaning": "受轻贱处也可成为消业与转念入口。", "source": "《碧岩录》第97则；亦见《从容录》第58则相关。", "tags": ["碧岩录", "金刚经", "轻贱", "消业", "忍辱", "转念"], "score": 4}, {"id": "biyanlu-98", "collection": "碧岩录", "collectionId": "biyanlu", "number": 98, "title": "天平两错", "original": "天平和尚行脚时参西院，常云：“莫道会佛法，觅个举话人也无。”西院遥见\n召云：“从漪！”平举头。院云：“错。”平行三两步。院又云：“错。”", "translation": "天平和尚行脚时参西院，常说：“不要说会佛法，连找个举话的人也没有。”\n西院远远看见他，叫：“从漪！”天平抬头。西院说：“错。”天平走了两三步。西院\n又说：“错。”", "story": "天平被西院两次点为错，错中露出执著位置。", "meaning": "错不只是失败，也可能显出执著位置。", "source": "《碧岩录》第98则相关。", "tags": ["碧岩录", "天平", "西院", "两错", "勘验", "执著"], "score": 2}, {"id": "biyanlu-99", "collection": "碧岩录", "collectionId": "biyanlu", "number": 99, "title": "肃宗十身调御", "original": "肃宗问忠国师：“如何是十身调御？”师云：“檀越踏毗卢顶上行。”帝云：“寡\n人不会。”师云：“莫认自己清净法身。”", "translation": "肃宗问忠国师：“什么是十身调御？”国师说：“施主踏在毗卢遮那佛头顶上\n行走。”皇帝说：“我不明白。”国师说：“不要认自己的清净法身。”", "story": "肃宗问国师十身调御，国师以踏毗卢顶上行回应。", "meaning": "佛身理论最终要回到当下见地。", "source": "《碧岩录》第99则相关帝王问法。", "tags": ["碧岩录", "肃宗", "忠国师", "十身调御", "毗卢", "法身\n禅宗公案大全：碧岩录卷（100则完整版）\n36"], "score": 3}, {"id": "biyanlu-100", "collection": "碧岩录", "collectionId": "biyanlu", "number": 100, "title": "巴陵吹毛剑", "original": "僧问巴陵：“如何是吹毛剑？”陵云：“珊瑚枝枝撑著月。”", "translation": "有僧人问巴陵：“什么是吹毛即断的宝剑？”巴陵说：“珊瑚一枝枝撑着月\n亮。”", "story": "僧问吹毛剑，巴陵以“珊瑚枝枝撑著月”回应。", "meaning": "最锋利的剑不必显杀气，也可化为清冷诗境。", "source": "《碧岩录》第100则。", "tags": ["碧岩录", "巴陵", "吹毛剑", "珊瑚", "月", "诗意"], "score": 4}, {"id": "congronglu-1", "collection": "从容录", "collectionId": "congronglu", "number": 1, "title": "世尊升座", "original": "世尊一日升座。文殊白槌云：“谛观法王法，法王法如是。”世尊便下座。", "translation": "世尊有一天升座说法。文殊敲槌说：“仔细观察法王之法，法王之法就是这\n样。”世尊随即下座。", "story": "世尊升座却不展开讲经，文殊一句白槌后，世尊下座而去。", "meaning": "无言也能说法；真正的法不一定通过长篇解释呈现。", "source": "《从容录》第1则；亦见《碧岩录》第92则。", "tags": ["从容录", "世尊", "文殊", "升座", "无言说法", "高传播"], "score": 5}, {"id": "congronglu-2", "collection": "从容录", "collectionId": "congronglu", "number": 2, "title": "达磨廓然", "original": "梁武帝问达磨：“如何是圣谛第一义？”磨云：“廓然无圣。”帝曰：“对朕者\n谁？”磨云：“不识。”", "translation": "梁武帝问达磨：“佛法最高的真理是什么？”达磨说：“空阔开朗，并没有什\n么圣。”梁武帝又问：“那站在我面前的是谁？”达磨说：“不认识。”", "story": "梁武帝向达磨问最高真理，却被“廓然无圣”“不识”两句截断。", "meaning": "破除功德、圣凡和自我确认的执著。", "source": "《从容录》第2则；亦见《碧岩录》第1则。", "tags": ["从容录", "达磨", "梁武帝", "廓然无圣", "不识", "高传播"], "score": 5}, {"id": "congronglu-3", "collection": "从容录", "collectionId": "congronglu", "number": 3, "title": "东印请祖", "original": "东印度国王请般若多罗尊者斋，王问：“诸人尽转经，尊者为什么不转？”祖\n曰：“贫道入息不居阴界，出息不涉众缘，常转如是经百千万亿卷。”", "translation": "东印度国王请般若多罗尊者受斋，问：“别人都在诵经，尊者为什么不诵？”\n尊者说：“我吸气时不住在五阴界中，呼气时不牵涉各种外缘，常常转这样的经百\n千万亿卷。”", "story": "国王问祖师为何不看经，祖师以呼吸出入皆在法中回应。", "meaning": "真正读经不是翻纸，而是呼吸出入都不离法。", "source": "《从容录》第3则。", "tags": ["从容录", "般若多罗", "转经", "呼吸", "东印度", "活经"], "score": 3}, {"id": "congronglu-4", "collection": "从容录", "collectionId": "congronglu", "number": 4, "title": "世尊指地", "original": "世尊因行次，以手指地云：“此处宜建梵刹。”帝释将一茎草插地云：“建梵刹\n已竟。”世尊微笑。", "translation": "世尊行走时，用手指着地说：“这里适合建一座清净道场。”帝释拿一根草插\n在地上说：“道场已经建好了。”世尊微笑。", "story": "世尊指地说宜建梵刹，帝释插一茎草说已经建成。", "meaning":
