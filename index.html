 "一念建立，一草即成道场；道场不只在宏大建筑中。", "source": "《从容录》第4则。\n禅宗公案大全：从容录卷（100则完整版）\n2", "tags": ["从容录", "世尊", "帝释", "一茎草", "梵刹", "道场"], "score": 4}, {"id": "congronglu-5", "collection": "从容录", "collectionId": "congronglu", "number": 5, "title": "青原米价", "original": "僧问青原：“如何是佛法大意？”原云：“卢陵米作么价？”", "translation": "有僧人问青原：“佛法的大意是什么？”青原说：“卢陵的米是什么价钱？”", "story": "青原不讲玄理，只问卢陵米价。", "meaning": "佛法大意不离柴米日用。", "source": "《从容录》第5则。", "tags": ["从容录", "青原", "米价", "佛法大意", "日用", "柴米"], "score": 4}, {"id": "congronglu-6", "collection": "从容录", "collectionId": "congronglu", "number": 6, "title": "马祖白黑", "original": "僧问马祖：“离四句，绝百非，请师直指西来意。”祖令问智藏、百丈。后祖\n云：“藏头白，海头黑。”", "translation": "僧人请马祖离开四句、断绝百非，直接指出祖师西来的意思。马祖让他去\n问智藏和百丈。后来马祖说：“智藏头白，百丈头黑。”", "story": "僧请马祖离四句绝百非直指西来意，马祖让他转问智藏、百丈。", "meaning": "看似绕路，实则让学人看见自己仍被“离四句”这个概念缠住。", "source": "《从容录》第6则。", "tags": ["从容录", "马祖", "智藏", "百丈", "四句百非", "西来意"], "score": 3}, {"id": "congronglu-7", "collection": "从容录", "collectionId": "congronglu", "number": 7, "title": "药山升座", "original": "药山久不升座。院主白云：“大众久思示诲，请和尚为众说法。”山令打钟。\n众才集，山升座良久，便下座归方丈。", "translation": "药山很久不上堂说法。院主说：“大众久等和尚开示，请和尚为大家说法。”\n药山让人打钟。大众刚集合，他升座坐了很久，便下座回方丈。", "story": "药山被请说法，升座良久却一句不说便下座。", "meaning": "无言也是说法；真正的法会不一定靠语言填满。", "source": "《从容录》第7则。\n禅宗公案大全：从容录卷（100则完整版）\n3", "tags": ["从容录", "药山", "升座", "无言", "说法", "沉默"], "score": 4}, {"id": "congronglu-8", "collection": "从容录", "collectionId": "congronglu", "number": 8, "title": "百丈野狐", "original": "老人问百丈：“大修行底人还落因果也无？”丈云：“不昧因果。”", "translation": "老人请百丈代答：“大修行的人还会落入因果吗？”百丈说：“不是不落因\n果，而是不昧因果。”", "story": "老人因过去错答“不落因果”堕为野狐，百丈答“不昧因果”令其解脱。", "meaning": "因果不能被轻易否定，修行是清醒承担因果。", "source": "《从容录》第8则；亦见《无门关》第2则。", "tags": ["从容录", "百丈", "野狐", "因果", "不昧因果", "高传播"], "score": 5}, {"id": "congronglu-9", "collection": "从容录", "collectionId": "congronglu", "number": 9, "title": "南泉斩猫", "original": "南泉因东西两堂争猫儿，提起云：“道得即不斩。”众无对。泉斩猫儿。赵州\n后闻，脱草鞋安头上而出。", "translation": "南泉因东西两堂争一只猫，就提起猫说：“说得出一句就不斩。”众人都答不\n上来。南泉斩了猫。赵州后来听说，脱下草鞋放在头上走出。", "story": "东西两堂争猫，南泉逼众人出语，赵州后以草鞋戴头回应。", "meaning": "争执让人忘记生命本身；真正回答要跳出争执框架。", "source": "《从容录》第9则；亦见《无门关》第14则。", "tags": ["从容录", "南泉", "赵州", "斩猫", "争执", "生命", "高传播"], "score": 5}, {"id": "congronglu-10", "collection": "从容录", "collectionId": "congronglu", "number": 10, "title": "台山婆子", "original": "僧问婆子：“台山路向甚处去？”婆云：“蓦直去。”僧才行三五步，婆云：“好\n个师僧，又恁么去。”", "translation": "僧人问婆子：“去台山的路往哪里走？”婆子说：“一直往前走。”僧人刚走三\n五步，婆子说：“好一个师僧，又这样走了。”", "story": "台山路上的婆子用问路勘验行脚僧，赵州又去勘验婆子。", "meaning": "路不只在脚下，也在当机是否明白。\n禅宗公案大全：从容录卷（100则完整版）\n4", "source": "《从容录》第10则；亦见《无门关》第31则相关。", "tags": ["从容录", "台山婆子", "赵州", "问路", "蓦直去", "勘验"], "score": 4}, {"id": "congronglu-11", "collection": "从容录", "collectionId": "congronglu", "number": 11, "title": "云门两病", "original": "云门云：“光不透脱，有两般病。一切处不明，面前有物，是一病。透得一\n切法空，隐隐地似有个物相似，亦是一病。”", "translation": "云门说：“光明不能透脱，有两种病。处处不明，眼前好像有东西，这是一\n种病。即使透得一切法空，暗中又好像有个东西，也是一种病。”", "story": "云门指出执境、执空、执法身等微细病。", "meaning": "越细微的修行境界，越可能隐藏执著。", "source": "《从容录》第11则。", "tags": ["从容录", "云门", "两病", "法身病", "执空", "微细执著"], "score": 3}, {"id": "congronglu-12", "collection": "从容录", "collectionId": "congronglu", "number": 12, "title": "地藏种田", "original": "修山主云：“南方佛法商量浩浩地。”地藏云：“争如我这里种田博饭吃。”", "translation": "修山主说：“南方讨论佛法，热闹浩大。”地藏说：“哪里比得上我这里种田换\n饭吃。”", "story": "地藏用种田吃饭回应浩浩佛法商量。", "meaning": "空谈佛法不如在日常劳作中落实。", "source": "《从容录》第12则。", "tags": ["从容录", "地藏", "种田", "劳动", "佛法商量", "日用"], "score": 4}, {"id": "congronglu-13", "collection": "从容录", "collectionId": "congronglu", "number": 13, "title": "临济瞎驴", "original": "临济将示灭，嘱三圣：“吾灭后，不得灭却吾正法眼藏。”圣便喝。济云：“谁\n知吾正法眼藏，向这瞎驴边灭却。”", "translation": "临济临终时嘱咐三圣：“我灭度后，不要灭掉我的正法眼藏。”三圣便喝一\n声。临济说：“谁知道我的正法眼藏，竟在这瞎驴这里灭掉。”", "story": "临济临终嘱三圣护持正法眼藏，三圣一喝，临济反说向瞎驴边灭却。\n禅宗公案大全：从容录卷（100则完整版）\n5", "meaning": "传法不是仪式交接，而是活机能否延续。", "source": "《从容录》第13则。", "tags": ["从容录", "临济", "三圣", "正法眼藏", "瞎驴", "传法"], "score": 3}, {"id": "congronglu-14", "collection": "从容录", "collectionId": "congronglu", "number": 14, "title": "廓侍过茶", "original": "廓侍者问德山：“从上诸圣，向什么处去？”山云：“作么？作么？”廓无语。\n后廓过茶，山拈起盏云：“向什么处去？”廓有省。", "translation": "廓侍者问德山：“从古以来的诸圣到哪里去了？”德山说：“做什么？做什\n么？”廓侍者无语。后来廓侍者递茶时，德山拿起茶盏问：“到哪里去？”廓侍者有\n所省悟。", "story": "廓侍者在问法和递茶之间被德山点拨。", "meaning": "日常服侍、递茶，也可以成为禅机。", "source": "《从容录》第14则。", "tags": ["从容录", "德山", "廓侍者", "过茶", "诸圣", "日用机锋"], "score": 3}, {"id": "congronglu-15", "collection": "从容录", "collectionId": "congronglu", "number": 15, "title": "仰山插锹", "original": "沩山问仰山：“田中多少人？”仰山插下锹子，叉手而立。", "translation": "沩山问仰山：“田里有多少人？”仰山把锹插在地上，叉手站立。", "story": "仰山不用语言，插锹叉手而立，把劳作现场呈现出来。", "meaning": "不用语言，也可以完整呈现本分。", "source": "《从容录》第15则。", "tags": ["从容录", "仰山", "沩山", "插锹", "田中", "动作回答"], "score": 3}, {"id": "congronglu-16", "collection": "从容录", "collectionId": "congronglu", "number": 16, "title": "麻谷振锡", "original": "麻谷持锡到章敬，绕禅床三匝，振锡而立。章敬云：“是，是。”又到南泉，\n亦如是。泉云：“不是，不是。”", "translation": "麻谷持锡杖到章敬那里，绕禅床三圈，振锡而立。章敬说：“是，是。”又到\n南泉那里，也这样做。南泉说：“不是，不是。”\n禅宗公案大全：从容录卷（100则完整版）\n6", "story": "同一动作，章敬说是，南泉说不是。", "meaning": "动作本身不保证见地，关键在当机和人。", "source": "《从容录》第16则；亦见《碧岩录》第31则。", "tags": ["从容录", "麻谷", "振锡", "章敬", "南泉", "当机"], "score": 3}, {"id": "congronglu-17", "collection": "从容录", "collectionId": "congronglu", "number": 17, "title": "法眼毫厘", "original": "法眼云：“毫厘有差，天地悬隔。”", "translation": "法眼说：“只要有毫厘之差，就会像天地一样相隔遥远。”", "story": "法眼以毫厘之差开示，指出一念差错会造成巨大偏离。", "meaning": "修行中的微细偏差，可能造成根本偏离。", "source": "《从容录》第17则。", "tags": ["从容录", "法眼", "毫厘有差", "天地悬隔", "微细", "偏差"], "score": 3}, {"id": "congronglu-18", "collection": "从容录", "collectionId": "congronglu", "number": 18, "title": "赵州狗子", "original": "僧问赵州：“狗子还有佛性也无？”州云：“无。”", "translation": "有僧人问赵州：“狗有没有佛性？”赵州回答：“没有。”", "story": "僧问狗子是否有佛性，赵州答“无”，把有无推理全部截断。", "meaning": "一个“无”字成为禅门大关。", "source": "《从容录》第18则；亦见《无门关》第1则。", "tags": ["从容录", "赵州", "狗子", "佛性", "无字关", "高传播"], "score": 5}, {"id": "congronglu-19", "collection": "从容录", "collectionId": "congronglu", "number": 19, "title": "云门须弥", "original": "僧问云门：“不起一念，还有过也无？”门云：“须弥山。”", "translation": "有僧人问云门：“不起一个念头，还有过错吗？”云门说：“须弥山。”", "story": "云门以“须弥山”回应不起一念的问题。", "meaning": "不可搬动之物，正好截断妄想。", "source": "《从容录》第19则。\n禅宗公案大全：从容录卷（100则完整版）\n7", "tags": ["从容录", "云门", "须弥山", "一念", "过错", "截断"], "score": 3}, {"id": "congronglu-20", "collection": "从容录", "collectionId": "congronglu", "number": 20, "title": "地藏亲切", "original": "僧问地藏：“如何是亲切处？”藏云：“不隔毫端。”", "translation": "有僧人问地藏：“什么是最亲切的地方？”地藏说：“连一毫一端都不隔。”", "story": "地藏以“不隔毫端”回应亲切之问。", "meaning": "亲切不是熟悉亲近，而是直抵本分。", "source": "《从容录》第20则。", "tags": ["从容录", "地藏", "亲切", "不隔毫端", "本分"], "score": 3}, {"id": "congronglu-21", "collection": "从容录", "collectionId": "congronglu", "number": 21, "title": "云岩扫地", "original": "云岩扫地。道吾云：“太区区生。”岩云：“须知有不区区者。”吾云：“恁么则\n有第二月也。”岩竖起扫帚云：“这个是第几月？”吾便休。", "translation": "云岩在扫地。道吾说：“太忙乱了。”云岩说：“要知道还有不忙乱的那个。”道\n吾说：“这样就有第二个月了。”云岩竖起扫帚说：“这个是第几个月？”道吾便停止\n不说。", "story": "云岩扫地时，师徒围绕忙与不忙、第二月展开机锋。", "meaning": "日常劳动中最能看出是否被事转。", "source": "《从容录》第21则。", "tags": ["从容录", "云岩", "道吾", "扫地", "忙闲", "日用"], "score": 3}, {"id": "congronglu-22", "collection": "从容录", "collectionId": "congronglu", "number": 22, "title": "岩头拜喝", "original": "岩头到德山，跨门便问：“是凡是圣？”山便喝。头礼拜。", "translation": "岩头到德山处，刚跨进门就问：“是凡还是圣？”德山便喝一声。岩头礼拜。", "story": "岩头在礼拜与喝之间呈现机锋。", "meaning": "拜与喝都只是手段，关键在是否相应。", "source": "《从容录》第22则。\n禅宗公案大全：从容录卷（100则完整版）\n8", "tags": ["从容录", "岩头", "德山", "拜", "喝", "凡圣"], "score": 2}, {"id": "congronglu-23", "collection": "从容录", "collectionId": "congronglu", "number": 23, "title": "鲁祖面壁", "original": "鲁祖凡见僧来，便面壁。", "translation": "鲁祖凡是看见僧人前来，就转身面壁。", "story": "鲁祖常以面壁沉默接人，来者面对他的背影，也面对自己的疑问。", "meaning": "沉默和背面也能成为接引。", "source": "《从容录》第23则。", "tags": ["从容录", "鲁祖", "面壁", "沉默", "接引"], "score": 3}, {"id": "congronglu-24", "collection": "从容录", "collectionId": "congronglu", "number": 24, "title": "雪峰看蛇", "original": "雪峰示众云：“南山有一条鳖鼻蛇，汝等诸人切须好看。”", "translation": "雪峰对大众说：“南山有一条鳖鼻蛇，你们大家一定要好好看着。”", "story": "雪峰提醒众人南山有蛇，语带危险，也像提醒修行中潜伏的险处。", "meaning": "危险常藏在看似平静之处。", "source": "《从容录》第24则；雪峰鳖鼻蛇系统。", "tags": ["从容录", "雪峰", "鳖鼻蛇", "危险", "警觉", "修行险处"], "score": 3}, {"id": "congronglu-25", "collection": "从容录", "collectionId": "congronglu", "number": 25, "title": "盐官犀扇", "original": "盐官唤侍者：“将犀牛扇子来。”者云：“扇子破也。”官云：“扇子既破，还我\n犀牛儿来。”", "translation": "盐官叫侍者：“把犀牛扇子拿来。”侍者说：“扇子破了。”盐官说：“扇子既然\n破了，把犀牛还给我。”", "story": "盐官要犀牛扇子，侍者说扇子破了，盐官要还犀牛儿。", "meaning": "物坏了，执物之心也要被看见。", "source": "《从容录》第25则；亦见《碧岩录》第91则。", "tags": ["从容录", "盐官", "犀牛扇子", "执物", "还我犀牛\n禅宗公案大全：从容录卷（100则完整版）\n9"], "score": 3}, {"id": "congronglu-26", "collection": "从容录", "collectionId": "congronglu", "number": 26, "title": "仰山指雪", "original": "仰山指雪问僧：“这个还离得色也无？”僧无对。", "translation": "仰山指着雪问僧人：“这个还能离开色相吗？”僧人答不上来。", "story": "仰山借眼前白雪示机，学人若只看见雪，就错过了师家手眼。", "meaning": "自然景象也可以成为法语。", "source": "《从容录》第26则。", "tags": ["从容录", "仰山", "雪", "色相", "自然", "法语"], "score": 3}, {"id": "congronglu-27", "collection": "从容录", "collectionId": "congronglu", "number": 27, "title": "法眼指帘", "original": "法眼以手指帘，二僧同去卷帘。眼云：“一得一失。”", "translation": "法眼用手指向帘子，两位僧人同时去卷帘。法眼说：“一个得，一个失。”", "story": "两僧同样卷帘，法眼却判一得一失。", "meaning": "同样动作背后，可能是完全不同的心机。", "source": "《从容录》第27则；亦见《无门关》第26则相关。", "tags": ["从容录", "法眼", "卷帘", "一得一失", "动作", "用心"], "score": 4}, {"id": "congronglu-28", "collection": "从容录", "collectionId": "congronglu", "number": 28, "title": "护国三懡", "original": "护国问僧：“如何是三懡㦬？”僧无语。", "translation": "护国问僧人：“什么是三重狼狈惭愧？”僧人无话可说。", "story": "护国以“三懡㦬”等语勘验学人，让来者陷入狼狈处。", "meaning": "狼狈和羞愧，也可能成为看见自己的入口。", "source": "《从容录》第28则。", "tags": ["从容录", "护国", "三懡㦬", "狼狈", "羞愧", "勘验"], "score": 2}, {"id": "congronglu-29", "collection": "从容录", "collectionId": "congronglu", "number": 29, "title": "风穴铁牛", "original": "风穴云：“祖师心印，状似铁牛之机。去即印住，住即印破。”", "translation": "风穴说：“祖师的心印，样子像铁牛的机括。离去就被印住，停住就被印\n破。”", "story": "风穴说祖师心印如铁牛之机，去住之间都能印破。", "meaning": "动静去住都不可执著。", "source": "《从容录》第29则；亦见《碧岩录》第38则。", "tags": ["从容录", "风穴", "铁牛", "心印", "去住", "机用"], "score": 3}, {"id": "congronglu-30", "collection": "从容录", "collectionId": "congronglu", "number": 30, "title": "大随劫火", "original": "僧问大随：“劫火洞然，大千俱坏，未审这个坏不坏？”随云：“坏。”", "translation": "僧人问大随：“劫火燃起，大千世界都坏了，不知这个会不会坏？”大随说：\n“坏。”", "story": "僧问劫火洞然时这个坏不坏，大随答“坏”。", "meaning": "连最深的执著对象也不可当作永恒。", "source": "《从容录》第30则；亦见《碧岩录》第29则。", "tags": ["从容录", "大随", "劫火", "坏", "无常", "放下"], "score": 3}, {"id": "congronglu-31", "collection": "从容录", "collectionId": "congronglu", "number": 31, "title": "云门露柱", "original": "云门云：“古佛与露柱相交，是第几机？”", "translation": "云门说：“古佛与寺院柱子相交，是第几种机？”", "story": "云门以露柱回应问佛问祖，把寺院柱子也变成说法者。", "meaning": "无情物也能说法。", "source": "《从容录》第31则；亦见《碧岩录》第83则相关。", "tags": ["从容录", "云门", "露柱", "古佛", "无情说法"], "score": 3}, {"id": "congronglu-32", "collection": "从容录", "collectionId": "congronglu", "number": 32, "title": "仰山心境", "original": "仰山问僧：“心境俱忘，复是何物？”僧无对。\n禅宗公案大全：从容录卷（100则完整版）\n11", "translation": "仰山问僧人：“心和境都忘掉了，剩下的又是什么？”僧人答不上来。", "story": "仰山围绕心与境展开勘验，指出心境不可粗分两段。", "meaning": "心境不二，但执著不二也是病。", "source": "《从容录》第32则。", "tags": ["从容录", "仰山", "心境", "心境俱忘", "不二"], "score": 3}, {"id": "congronglu-33", "collection": "从容录", "collectionId": "congronglu", "number": 33, "title": "三圣金鳞", "original": "三圣问雪峰：“透网金鳞，以何为食？”峰云：“待汝出网来，即向汝道。”", "translation": "三圣问雪峰：“已经透出网的金鳞鱼，以什么为食？”雪峰说：“等你出网\n来，我就告诉你。”", "story": "三圣以金鳞、出网、化龙等意象呈机，象征出格之人。", "meaning": "真正修行者不困在旧池塘。", "source": "《从容录》第33则；亦见《碧岩录》第49则相关。", "tags": ["从容录", "三圣", "雪峰", "金鳞", "透网", "出格"], "score": 3}, {"id": "congronglu-34", "collection": "从容录", "collectionId": "congronglu", "number": 34, "title": "风穴一尘", "original": "风穴云：“若立一尘，家国兴盛；不立一尘，家国丧亡。”", "translation": "风穴说：“如果立起一粒微尘，家国兴盛；如果不立一粒微尘，家国丧亡。”", "story": "风穴以一尘举起、大地全收开示，一粒微尘中显全体世界。", "meaning": "一尘中可见大千。", "source": "《从容录》第34则；亦见《碧岩录》第61则相关。", "tags": ["从容录", "风穴", "一尘", "大千", "立与不立"], "score": 3}, {"id": "congronglu-35", "collection": "从容录", "collectionId": "congronglu", "number": 35, "title": "洛浦伏膺", "original": "洛浦云：“一片白云横谷口，几多归鸟尽迷巢。”", "translation": "洛浦说：“一片白云横在山谷口，多少归巢的鸟都迷失了巢。”", "story": "洛浦以白云横谷、归鸟迷巢之句显示参学中迷与承当。\n禅宗公案大全：从容录卷（100则完整版）\n12", "meaning": "真正承当不是口头认同，而是身心伏膺。", "source": "《从容录》第35则。", "tags": ["从容录", "洛浦", "伏膺", "白云", "归鸟", "承当"], "score": 2}, {"id": "congronglu-36", "collection": "从容录", "collectionId": "congronglu", "number": 36, "title": "马师不安", "original": "马大师不安，院主问：“和尚近日尊候如何？”大师云：“日面佛，月面佛。”", "translation": "马祖身体不适，院主问：“和尚最近身体怎么样？”马祖说：“日面佛，月面\n佛。”", "story": "马祖病中被问近况，答“日面佛，月面佛”。", "meaning": "病中不失本分，生死中仍可自在。", "source": "《从容录》第36则；亦见《碧岩录》第3则。", "tags": ["从容录", "马祖", "日面佛", "月面佛", "病中自在"], "score": 4}, {"id": "congronglu-37", "collection": "从容录", "collectionId": "congronglu", "number": 37, "title": "沩山业识", "original": "沩山云：“业识茫茫，无本可据。”", "translation": "沩山说：“业识茫茫，没有一个可以依靠的根本。”", "story": "沩山谈业识茫茫，学人被逼问生命流转的根。", "meaning": "不照见业识，人便在惯性中漂流。", "source": "《从容录》第37则；亦见《碧岩录》第70则相关。", "tags": ["从容录", "沩山", "业识", "茫茫", "生死", "惯性"], "score": 3}, {"id": "congronglu-38", "collection": "从容录", "collectionId": "congronglu", "number": 38, "title": "临济真人", "original": "临济云：“赤肉团上有一无位真人，常从汝等诸人面门出入。”", "translation": "临济说：“这血肉身体上有一位没有位次的真人，常常从你们每个人的面门\n出入。”", "story": "临济说赤肉团上有一无位真人，常从面门出入。", "meaning": "人不只是身份、标签和角色，内里有活泼真实者。\n禅宗公案大全：从容录卷（100则完整版）\n13", "source": "《从容录》第38则；《临济录》。", "tags": ["从容录", "临济", "无位真人", "赤肉团", "真实自我", "高传播"], "score": 5}, {"id": "congronglu-39", "collection": "从容录", "collectionId": "congronglu", "number": 39, "title": "赵州洗钵", "original": "僧问赵州：“乞师指示。”州云：“吃粥了也未？”僧云：“吃粥了也。”州云：\n“洗钵盂去。”", "translation": "僧人请赵州指示。赵州问：“吃过粥了吗？”僧人说：“吃过了。”赵州说：“去\n洗碗吧。”", "story": "僧人求赵州指示，赵州令其吃完粥去洗钵。", "meaning": "道就在吃饭洗碗处。", "source": "《从容录》第39则；亦见《无门关》第7则。", "tags": ["从容录", "赵州", "洗钵", "吃粥", "日用即道", "高传播"], "score": 5}, {"id": "congronglu-40", "collection": "从容录", "collectionId": "congronglu", "number": 40, "title": "云门白黑", "original": "云门问僧：“不是目前机，亦非目前事时如何？”僧无语。门云：“倒一说。”", "translation": "云门问僧人：“既不是眼前的机，也不是眼前的事时，怎样？”僧人无语。云\n门说：“倒过来说。”", "story": "云门以白黑、正反等对立语境接人，让学人看见分别心。", "meaning": "黑白分明处，也要识得不落两边。", "source": "《从容录》第40则。", "tags": ["从容录", "云门", "白黑", "倒一说", "两边", "分别"], "score": 3}, {"id": "congronglu-41", "collection": "从容录", "collectionId": "congronglu", "number": 41, "title": "洛浦临终", "original": "洛浦临终示众云：“今有一事问汝等，若道这个是，即头上安头；若道这个\n不是，即斩头求活。”", "translation": "洛浦临终时对大众说：“现在有一件事问你们，如果说这个是，就是头上安\n头；如果说这个不是，就是砍头求活。”", "story": "洛浦临终仍以机锋示众，把生命最后时刻也变成说法现场。\n禅宗公案大全：从容录卷（100则完整版）\n14", "meaning": "临终才是真正检验修行处。", "source": "《从容录》第41则。", "tags": ["从容录", "洛浦", "临终", "头上安头", "生死", "检验"], "score": 3}, {"id": "congronglu-42", "collection": "从容录", "collectionId": "congronglu", "number": 42, "title": "南阳净瓶", "original": "南阳国师问侍者：“净瓶在什么处？”侍者云：“在这里。”师云：“不得唤作净\n瓶。”", "translation": "南阳国师问侍者：“净瓶在哪里？”侍者说：“在这里。”国师说：“不能叫它净\n瓶。”", "story": "南阳国师借净瓶设问，考验学人是否落入物名和形相。", "meaning": "物名只是方便，执名便迷。", "source": "《从容录》第42则。", "tags": ["从容录", "南阳国师", "净瓶", "命名", "形相", "执名"], "score": 3}, {"id": "congronglu-43", "collection": "从容录", "collectionId": "congronglu", "number": 43, "title": "罗山起灭", "original": "罗山云：“起灭不停，如何得相应去？”", "translation": "罗山说：“念头生起和消灭不停，怎样才能相应？”", "story": "罗山围绕起灭、生灭发问，让学人观察念头迁流。", "meaning": "见起灭而不被起灭转。", "source": "《从容录》第43则。", "tags": ["从容录", "罗山", "起灭", "念头", "迁流", "观心"], "score": 2}, {"id": "congronglu-44", "collection": "从容录", "collectionId": "congronglu", "number": 44, "title": "兴阳妙翅", "original": "兴阳云：“大鹏展翅，直过三千。”", "translation": "兴阳说：“大鹏展开翅膀，直接飞越三千世界。”", "story": "兴阳借妙翅鸟、大鹏等意象显示飞腾出格的机用。", "meaning": "真正见地有凌空出格之力。\n禅宗公案大全：从容录卷（100则完整版）\n15", "source": "《从容录》第44则。", "tags": ["从容录", "兴阳", "妙翅", "大鹏", "出格", "飞腾"], "score": 2}, {"id": "congronglu-45", "collection": "从容录", "collectionId": "congronglu", "number": 45, "title": "觉经四节", "original": "觉经有四节，禅师拈出问众：“作么生会？”", "translation": "经典中有四个段落，禅师拈出来问大众：“你们怎样理解？”", "story": "禅师围绕经典四节展开问答，把经义转成当下勘验。", "meaning": "读经要读活，不可只守文字。", "source": "《从容录》第45则。", "tags": ["从容录", "觉经", "四节", "读经", "经义", "活读"], "score": 2}, {"id": "congronglu-46", "collection": "从容录", "collectionId": "congronglu", "number": 46, "title": "德山学毕", "original": "德山云：“穷诸玄辩，若一毫置于太虚；竭世枢机，似一滴投于巨壑。”", "translation": "德山说：“穷尽各种玄妙辩论，就像把一根毫毛放在太虚中；用尽世间机\n巧，就像把一滴水投入巨大深谷。”", "story": "德山原精通经论，参禅后放下旧学，以棒喝立宗风。", "meaning": "学问到头，还要放下学问。", "source": "《从容录》第46则。", "tags": ["从容录", "德山", "学问", "放下", "棒喝", "知解"], "score": 4}, {"id": "congronglu-47", "collection": "从容录", "collectionId": "congronglu", "number": 47, "title": "赵州柏树", "original": "僧问赵州：“如何是祖师西来意？”州云：“庭前柏树子。”", "translation": "僧人问赵州：“祖师从西方来的意思是什么？”赵州说：“庭前的柏树。”", "story": "赵州以庭前柏树回应祖师西来意。", "meaning": "最深的问题，答案就在眼前。", "source": "《从容录》第47则；亦见《无门关》第37则。", "tags": ["从容录", "赵州", "柏树子", "西来意", "眼前真实", "高传播\n禅宗公案大全：从容录卷（100则完整版）\n16"], "score": 5}, {"id": "congronglu-48", "collection": "从容录", "collectionId": "congronglu", "number": 48, "title": "摩经不二", "original": "诸菩萨各说不二法门。文殊问维摩诘，维摩默然。", "translation": "众菩萨各自说明不二法门。文殊问维摩诘时，维摩诘沉默不语。", "story": "诸菩萨说不二法门，维摩默然，文殊赞其真入不二。", "meaning": "真正不二处，语言沉默下来。", "source": "《从容录》第48则；《维摩诘经》。", "tags": ["从容录", "维摩", "文殊", "不二法门", "默然", "高传播"], "score": 5}, {"id": "congronglu-49", "collection": "从容录", "collectionId": "congronglu", "number": 49, "title": "洞山供真", "original": "洞山供养真影，僧问：“影是真，和尚是真？”山云：“真不离影。”", "translation": "洞山供养祖师真影，僧人问：“画像是真，还是和尚是真？”洞山说：“真不\n离影。”", "story": "洞山围绕供养真影、真像展开问答，追问何者为真。", "meaning": "真不在画像中，也不离当下承当。", "source": "《从容录》第49则。", "tags": ["从容录", "洞山", "真影", "供养", "真假", "承当"], "score": 2}, {"id": "congronglu-50", "collection": "从容录", "collectionId": "congronglu", "number": 50, "title": "雪峰甚么", "original": "雪峰住庵，见僧来，托起庵门云：“是什么？”僧亦云：“是什么？”峰低头归\n庵。", "translation": "雪峰住在庵中，见僧人来了，托起庵门问：“是什么？”僧人也说：“是什\n么？”雪峰低头回到庵里。", "story": "雪峰见僧来，以“是什么”逼问，僧也以“是什么”回应。", "meaning": "“是什么”不是定义题，而是当下见地的逼问。", "source": "《从容录》第50则；亦见《碧岩录》第51则相关。", "tags": ["从容录", "雪峰", "是什么", "庵门", "勘验\n禅宗公案大全：从容录卷（100则完整版）\n17"], "score": 3}, {"id": "congronglu-51", "collection": "从容录", "collectionId": "congronglu", "number": 51, "title": "法眼船陆", "original": "法眼问僧：“船来陆来？”僧云：“船来。”眼云：“船在什么处？”僧无语。", "translation": "法眼问僧人：“你是坐船来，还是走陆路来？”僧人说：“坐船来。”法眼问：\n“船在哪里？”僧人无话可说。", "story": "法眼借船与陆地之喻接人，考验学人是否知渡岸和舍筏。", "meaning": "法门如船，过河后不可执船。", "source": "《从容录》第51则。", "tags": ["从容录", "法眼", "船陆", "渡岸", "舍筏", "方便"], "score": 3}, {"id": "congronglu-52", "collection": "从容录", "collectionId": "congronglu", "number": 52, "title": "曹山法身", "original": "僧问曹山：“如何是法身？”山云：“满目青山。”", "translation": "僧人问曹山：“什么是法身？”曹山说：“满眼都是青山。”", "story": "曹山围绕法身问答，指出法身不是可执的清净境界。", "meaning": "执法身为境界，也会成为病。", "source": "《从容录》第52则。", "tags": ["从容录", "曹山", "法身", "青山", "境界", "破执"], "score": 3}, {"id": "congronglu-53", "collection": "从容录", "collectionId": "congronglu", "number": 53, "title": "黄檗噇糟", "original": "黄檗示众云：“汝等诸人，尽是噇酒糟汉。还知大唐国里无禅师么？”", "translation": "黄檗对大众说：“你们这些人，都是吃酒糟的汉子。知道大唐国内没有禅师\n吗？”", "story": "黄檗呵斥众人为噇酒糟汉，又说大唐国里无禅师。", "meaning": "不要在陈腐知解和二手经验中讨生活。", "source": "《从容录》第53则；亦见《碧岩录》第11则。", "tags": ["从容录", "黄檗", "噇酒糟", "无禅师", "警策", "知解"], "score": 4}, {"id": "congronglu-54", "collection": "从容录", "collectionId": "congronglu", "number": 54, "title": "云岩大悲", "original": "云岩问道吾：“大悲菩萨用许多手眼作么？”吾云：“如人夜间背手摸枕子。”\n岩云：“遍身是手眼。”吾云：“通身是手眼。”", "translation": "云岩问道吾：“大悲菩萨用那么多手眼做什么？”道吾说：“像人夜里背着手\n摸枕头。”云岩说：“全身都是手眼。”道吾说：“通身都是手眼。”", "story": "问大悲菩萨千手千眼哪只是正眼，道吾说通身是手眼。", "meaning": "慈悲不是局部能力，而是全身心回应。", "source": "《从容录》第54则；亦见《碧岩录》第89则。", "tags": ["从容录", "云岩", "道吾", "大悲菩萨", "手眼", "慈悲", "高传播"], "score": 5}, {"id": "congronglu-55", "collection": "从容录", "collectionId": "congronglu", "number": 55, "title": "雪峰饭头", "original": "雪峰在洞山会下作饭头。一日淘米次，洞山问：“淘沙去米，淘米去沙？”峰\n云：“沙米一时去。”山云：“大众吃个什么？”峰覆却米盆。", "translation": "雪峰在洞山会下做饭头。有一天淘米时，洞山问：“是淘去沙留下米，还是\n淘去米留下沙？”雪峰说：“沙和米一时都去。”洞山问：“大众吃什么？”雪峰把米盆\n翻倒。", "story": "雪峰在厨房、饭食和杂务中磨炼自己。", "meaning": "低处杂务也能养成大道器。", "source": "《从容录》第55则。", "tags": ["从容录", "雪峰", "饭头", "淘米", "厨房", "劳动"], "score": 4}, {"id": "congronglu-56", "collection": "从容录", "collectionId": "congronglu", "number": 56, "title": "密师白兔", "original": "密师见白兔过，云：“俊哉！”僧云：“如何是俊？”师云：“如白衣拜相。”", "translation": "密师看见白兔跑过，说：“真俊！”僧人问：“什么是俊？”密师说：“像白衣\n人拜相一样。”", "story": "密师借白兔等动物意象接人，借灵动之物显机。", "meaning": "一只兔子的动静也可成为禅机。", "source": "《从容录》第56则。", "tags": ["从容录", "密师", "白兔", "灵动", "动物", "机锋\n禅宗公案大全：从容录卷（100则完整版）\n19"], "score": 2}, {"id": "congronglu-57", "collection": "从容录", "collectionId": "congronglu", "number": 57, "title": "严阳一物", "original": "严阳尊者问赵州：“一物不将来时如何？”州云：“放下著。”严云：“一物不将\n来，放下个什么？”州云：“恁么则担取去。”", "translation": "严阳尊者问赵州：“一物也不带来时怎样？”赵州说：“放下吧。”严阳说：“一\n物也不带来，放下什么？”赵州说：“那就担起来带走。”", "story": "严阳问一物不将来，赵州以放下、担取回应。", "meaning": "若把“一物”当某个东西，已经错过。", "source": "《从容录》第57则。", "tags": ["从容录", "严阳", "赵州", "一物不将来", "放下", "担取"], "score": 2}, {"id": "congronglu-58", "collection": "从容录", "collectionId": "congronglu", "number": 58, "title": "金刚经轻贱", "original": "《金刚经》云：“若为人轻贱，是人先世罪业，应堕恶道；以今世人轻贱\n故，先世罪业即为消灭。”", "translation": "《金刚经》说：“如果被人轻视贱辱，这个人过去世的罪业本应堕入恶道；\n因为今世被人轻贱，过去世罪业就得以消灭。”", "story": "围绕《金刚经》中“为人轻贱”之句展开禅门拈提。", "meaning": "受轻贱处也可成为观心和转业处。", "source": "《从容录》第58则；《金刚经》相关。", "tags": ["从容录", "金刚经", "轻贱", "消业", "忍辱", "转业"], "score": 4}, {"id": "congronglu-59", "collection": "从容录", "collectionId": "congronglu", "number": 59, "title": "青林死蛇", "original": "青林云：“路逢死蛇，莫打杀。”", "translation": "青林说：“路上遇到死蛇，不要再打杀它。”", "story": "青林以死蛇作喻，提醒学人不要把死物当活法。", "meaning": "死句、死见解不能当成真实禅机。", "source": "《从容录》第59则。", "tags": ["从容录", "青林", "死蛇", "死句", "活法\n禅宗公案大全：从容录卷（100则完整版）\n20"], "score": 2}, {"id": "congronglu-60", "collection": "从容录", "collectionId": "congronglu", "number": 60, "title": "铁磨牸牛", "original": "刘铁磨到沩山。山云：“老牸牛，汝来也。”磨云：“来日台山大会斋，和尚还\n去么？”", "translation": "刘铁磨来到沩山。沩山说：“老母牛，你来了。”刘铁磨说：“明天台山有大会\n斋，和尚去吗？”", "story": "刘铁磨与禅师机锋往来，常以牸牛等语显示强悍风格。", "meaning": "女禅者也可机锋峻烈，不让须眉。", "source": "《从容录》第60则。", "tags": ["从容录", "刘铁磨", "沩山", "牸牛", "女禅者", "机锋"], "score": 4}, {"id": "congronglu-61", "collection": "从容录", "collectionId": "congronglu", "number": 61, "title": "干峰一画", "original": "僧问乾峰：“十方薄伽梵，一路涅槃门，路头在甚么处？”峰拈拄杖划一划\n云：“在这里。”", "translation": "僧人问乾峰：“十方诸佛同一路涅槃门，路头在哪里？”乾峰拿起拄杖划了一\n下，说：“就在这里。”", "story": "干峰以一画回应涅槃路头之问，把路头落在当下一划。", "meaning": "一画即一路，关键在当下见。", "source": "《从容录》第61则；亦见《无门关》第48则相关。", "tags": ["从容录", "乾峰", "一画", "涅槃门", "路头", "当下"], "score": 3}, {"id": "congronglu-62", "collection": "从容录", "collectionId": "congronglu", "number": 62, "title": "米胡悟否", "original": "米胡问僧：“还悟也未？”僧云：“悟也。”胡云：“悟个什么？”僧无语。", "translation": "米胡问僧人：“你悟了没有？”僧人说：“悟了。”米胡问：“悟了什么？”僧人\n无话可说。", "story": "米胡设问人悟不悟，借问答勘验学人是否真到。", "meaning": "悟不是自称，要经得起问。", "source": "《从容录》第62则。\n禅宗公案大全：从容录卷（100则完整版）\n21", "tags": ["从容录", "米胡", "悟", "勘验", "自称", "真实"], "score": 2}, {"id": "congronglu-63", "collection": "从容录", "collectionId": "congronglu", "number": 63, "title": "赵州问死", "original": "僧问赵州：“死后向甚处去？”州云：“死汉向活汉道什么？”", "translation": "僧人问赵州：“死后到哪里去？”赵州说：“死人向活人说什么？”", "story": "赵州围绕死、活、去处发问，让学人直面生死关口。", "meaning": "生死问题不能只用安慰语糊弄。", "source": "《从容录》第63则。", "tags": ["从容录", "赵州", "死后", "生死", "去处"], "score": 4}, {"id": "congronglu-64", "collection": "从容录", "collectionId": "congronglu", "number": 64, "title": "子昭承嗣", "original": "子昭承嗣，师问：“如何是正法眼？”昭云：“瞎。”", "translation": "子昭承接法嗣时，师父问：“什么是正法眼？”子昭说：“瞎。”", "story": "子昭承嗣法脉的机缘被拈出，重在传承是否真实。", "meaning": "传承不是名分，而是见地相续。", "source": "《从容录》第64则。", "tags": ["从容录", "子昭", "承嗣", "正法眼", "传承", "见地"], "score": 2}, {"id": "congronglu-65", "collection": "从容录", "collectionId": "congronglu", "number": 65, "title": "首山新妇", "original": "首山云：“新妇骑驴阿家牵。”", "translation": "首山说：“新媳妇骑着驴，婆婆在前面牵着。”", "story": "首山以新妇等生活比喻接人，借家庭角色显禅机。", "meaning": "世俗身份也可成为说法材料。", "source": "《从容录》第65则。", "tags": ["从容录", "首山", "新妇", "骑驴", "家庭比喻", "生活"], "score": 3}, {"id": "congronglu-66", "collection": "从容录", "collectionId": "congronglu", "number": 66, "title": "九峰头尾", "original": "九峰云：“头尾相称，始得相应。”", "translation": "九峰说：“头和尾相称，才算相应。”", "story": "九峰围绕头尾、始终设问，逼人看见前后分别。", "meaning": "始终若不统一，见地便不稳。", "source": "《从容录》第66则。", "tags": ["从容录", "九峰", "头尾", "始终", "相应"], "score": 2}, {"id": "congronglu-67", "collection": "从容录", "collectionId": "congronglu", "number": 67, "title": "华严智慧", "original": "华严云：“若人欲识佛境界，当净其意如虚空。”", "translation": "《华严经》说：“如果有人想认识佛的境界，应当清净自己的心意，使它像\n虚空一样。”", "story": "围绕《华严经》智慧义展开禅门拈提，把经教转为机用。", "meaning": "华严智慧要落实到当下互摄无碍。", "source": "《从容录》第67则。", "tags": ["从容录", "华严", "智慧", "虚空", "经教", "境界"], "score": 3}, {"id": "congronglu-68", "collection": "从容录", "collectionId": "congronglu", "number": 68, "title": "夹山挥剑", "original": "夹山挥剑云：“斩得一切人，即不斩得这个。”", "translation": "夹山挥剑说：“能斩尽一切人，却斩不了这个。”", "story": "夹山以挥剑等峻烈动作示机，让学人无法躲闪。", "meaning": "禅机如剑，断人犹豫和知解。", "source": "《从容录》第68则。", "tags": ["从容录", "夹山", "挥剑", "斩", "知解", "峻烈"], "score": 3}, {"id": "congronglu-69", "collection": "从容录", "collectionId": "congronglu", "number": 69, "title": "南泉白牯", "original": "南泉云：“王老师十八上便解作活计。如今作一头水牯牛去。”\n禅宗公案大全：从容录卷（100则完整版）\n23", "translation": "南泉说：“王老师十八岁就懂得做活计。如今要去作一头水牯牛。”", "story": "南泉说来生要作山下檀越家水牯牛，众人从中参究还债与自在。", "meaning": "圣凡不二，连作牛也可显道。", "source": "《从容录》第69则；亦见《碧岩录》第69则。", "tags": ["从容录", "南泉", "白牯牛", "水牯牛", "还债", "圣凡"], "score": 4}, {"id": "congronglu-70", "collection": "从容录", "collectionId": "congronglu", "number": 70, "title": "进山问性", "original": "僧问进山：“如何是佛性？”山云：“墙壁瓦砾。”", "translation": "僧人问进山：“什么是佛性？”进山说：“墙壁瓦砾。”", "story": "进山问性，师家不许他停在性理名相中。", "meaning": "自性不是可被解释的对象。", "source": "《从容录》第70则。", "tags": ["从容录", "进山", "佛性", "墙壁瓦砾", "自性"], "score": 2}, {"id": "congronglu-71", "collection": "从容录", "collectionId": "congronglu", "number": 71, "title": "翠岩眉毛", "original": "翠岩夏末示众云：“一夏以来，为兄弟说话，看翠岩眉毛在么？”", "translation": "夏安居结束时，翠岩对大众说：“这一夏以来，我为你们说法，你们看翠岩\n的眉毛还在不在？”", "story": "翠岩问一夏为众说法后眉毛还在么，诸师各作评点。", "meaning": "说法者必须自检是否落入虚妄。", "source": "《从容录》第71则；亦见《碧岩录》第8则。", "tags": ["从容录", "翠岩", "眉毛", "说法", "自检"], "score": 3}, {"id": "congronglu-72", "collection": "从容录", "collectionId": "congronglu", "number": 72, "title": "中邑猕猴", "original": "中邑云：“猕猴捉月，失却本真。”", "translation": "中邑说：“猕猴去捉水中的月亮，便失去了本来的真实。”", "story": "中邑以猕猴等灵动物象答问，考验学人是否随影逐形。\n禅宗公案大全：从容录卷（100则完整版）\n24", "meaning": "心猿意马若不见，便被境转。", "source": "《从容录》第72则。", "tags": ["从容录", "中邑", "猕猴", "捉月", "心猿", "逐影"], "score": 3}, {"id": "congronglu-73", "collection": "从容录", "collectionId": "congronglu", "number": 73, "title": "曹山孝满", "original": "曹山云：“孝满之后，作么生相见？”", "translation": "曹山说：“孝服期满之后，怎样相见？”", "story": "曹山以孝满、服制等语境接人，借世法显佛法。", "meaning": "人伦世法中也藏修行关口。", "source": "《从容录》第73则。", "tags": ["从容录", "曹山", "孝满", "世法", "人伦", "相见"], "score": 2}, {"id": "congronglu-74", "collection": "从容录", "collectionId": "congronglu", "number": 74, "title": "法眼质名", "original": "法眼问僧：“名什么？”僧云：“某甲。”眼云：“哪个是某甲？”", "translation": "法眼问僧人：“你叫什么名字？”僧人说出自己的名字。法眼问：“哪一个是\n你？”", "story": "法眼围绕名称、指称展开追问，逼人离开名相。", "meaning": "名字不是实物，执名便迷。", "source": "《从容录》第74则。", "tags": ["从容录", "法眼", "名字", "指称", "名相", "自我"], "score": 3}, {"id": "congronglu-75", "collection": "从容录", "collectionId": "congronglu", "number": 75, "title": "瑞岩常理", "original": "瑞岩每日自唤：“主人公！”复自应诺：“喏！”乃云：“惺惺著！莫受人瞒！”", "translation": "瑞岩每天自己叫自己：“主人公！”又自己回答：“在！”然后提醒自己：“要\n清醒，不要被别人欺瞒！”", "story": "瑞岩自唤主人公，提醒自己惺惺不受人瞒。", "meaning": "每日自我唤醒，是最朴素的修行。\n禅宗公案大全：从容录卷（100则完整版）\n25", "source": "《从容录》第75则；亦见《无门关》第12则相关。", "tags": ["从容录", "瑞岩", "主人公", "自我唤醒", "觉察", "高传播"], "score": 5}, {"id": "congronglu-76", "collection": "从容录", "collectionId": "congronglu", "number": 76, "title": "首山三句", "original": "首山示众：“第一句荐得，堪与佛祖为师；第二句荐得，堪与人天为师；第\n三句荐得，自救不了。”", "translation": "首山对大众说：“第一句领会了，足以给佛祖作师；第二句领会了，足以给\n人天作师；第三句领会了，连自己都救不了。”", "story": "首山以三句示众，层层推进又层层破除。", "meaning": "三句不是公式，而是引人离开固定理解。", "source": "《从容录》第76则。", "tags": ["从容录", "首山", "三句", "佛祖", "人天", "自救"], "score": 2}, {"id": "congronglu-77", "collection": "从容录", "collectionId": "congronglu", "number": 77, "title": "仰山随分", "original": "仰山云：“随分纳些些。”", "translation": "仰山说：“随自己的分量，承担一点点。”", "story": "仰山随分接人，不多不少地回应来机。", "meaning": "真正接引要随根器分寸。", "source": "《从容录》第77则。", "tags": ["从容录", "仰山", "随分", "根器", "接引"], "score": 2}, {"id": "congronglu-78", "collection": "从容录", "collectionId": "congronglu", "number": 78, "title": "云门糊饼", "original": "僧问云门：“如何是超佛越祖之谈？”门云：“糊饼。”", "translation": "僧人问云门：“什么是超越佛祖的言谈？”云门说：“糊饼。”", "story": "云门以糊饼回应问法，把玄妙问题落在可吃的饼上。", "meaning": "佛法不离饥来吃饭。", "source": "《从容录》第78则；云门饼系统。\n禅宗公案大全：从容录卷（100则完整版）\n26", "tags": ["从容录", "云门", "糊饼", "超佛越祖", "日用", "高传播"], "score": 5}, {"id": "congronglu-79", "collection": "从容录", "collectionId": "congronglu", "number": 79, "title": "长沙进步", "original": "长沙云：“百尺竿头须进步，十方世界现全身。”", "translation": "长沙说：“在百尺竿头还要再进一步，十方世界都会显现全身。”", "story": "长沙围绕进步发问，逼学人看见前进也可能是执著。", "meaning": "修行不只是向前，也要知道何处放下。", "source": "《从容录》第79则。", "tags": ["从容录", "长沙", "百尺竿头", "进步", "放下"], "score": 3}, {"id": "congronglu-80", "collection": "从容录", "collectionId": "congronglu", "number": 80, "title": "龙牙过板", "original": "龙牙云：“过板不得，过水不得。”", "translation": "龙牙说：“过板也过不得，过水也过不得。”", "story": "龙牙借过板等丛林日常物事答问，验人是否识得本分。", "meaning": "寺院日常规矩中也有禅机。", "source": "《从容录》第80则。", "tags": ["从容录", "龙牙", "过板", "丛林日常", "规矩"], "score": 2}, {"id": "congronglu-81", "collection": "从容录", "collectionId": "congronglu", "number": 81, "title": "玄沙到县", "original": "玄沙到县，问僧：“什么处去？”僧云：“县里去。”沙云：“县在什么处？”", "translation": "玄沙到县城，问僧人：“到哪里去？”僧人说：“到县里去。”玄沙问：“县在哪\n里？”", "story": "玄沙到县城等行脚事件中，借路途和场景接引学人。", "meaning": "市井路上也可参禅。", "source": "《从容录》第81则。", "tags": ["从容录", "玄沙", "到县", "市井", "行脚", "路途"], "score": 3}, {"id": "congronglu-82", "collection": "从容录", "collectionId": "congronglu", "number": 82, "title": "云门声色", "original": "云门云：“闻声悟道，见色明心。”", "translation": "云门说：“听到声音而悟道，看见色相而明心。”", "story": "云门围绕声色答问，使学人看见自己如何被见闻牵动。", "meaning": "声色不是障碍，随声逐色才是障碍。", "source": "《从容录》第82则。", "tags": ["从容录", "云门", "声色", "闻声悟道", "见色明心"], "score": 3}, {"id": "congronglu-83", "collection": "从容录", "collectionId": "congronglu", "number": 83, "title": "道吾看病", "original": "道吾看病僧，僧问：“病中如何？”吾云：“痛处自知。”", "translation": "道吾探望生病的僧人，僧问：“病中该怎样？”道吾说：“痛处自己知道。”", "story": "道吾探病问疾，将病痛场景转为生死与修行的勘验。", "meaning": "病中最能看出平日功夫。", "source": "《从容录》第83则。", "tags": ["从容录", "道吾", "看病", "病痛", "生死", "功夫"], "score": 4}, {"id": "congronglu-84", "collection": "从容录", "collectionId": "congronglu", "number": 84, "title": "俱胝一指", "original": "俱胝和尚凡有所问，只竖一指。童子效之，胝断其指。童子回首，胝却竖\n指，童子忽然悟去。", "translation": "俱胝和尚凡有人问法，只竖一指。童子模仿他，俱胝斩断童子的手指。童\n子回头时，俱胝又竖起手指，童子忽然悟了。", "story": "俱胝以一指接人，童子模仿被截指，回头见一指而悟。", "meaning": "模仿形式不是真悟，断执处才见法。", "source": "《从容录》第84则；亦见《无门关》第3则。", "tags": ["从容录", "俱胝", "一指禅", "断指", "破相", "师徒"], "score": 4}, {"id": "congronglu-85", "collection": "从容录", "collectionId": "congronglu", "number": 85, "title": "国师塔样", "original": "肃宗问忠国师：“百年后所须何物？”师云：“与老僧作个无缝塔。”帝云：“请\n师塔样。”师良久。", "translation": "肃宗问忠国师：“百年之后，您需要什么？”国师说：“给老僧造一座无缝\n塔。”皇帝说：“请师父说说塔的样子。”国师沉默很久。", "story": "国师要无缝塔，皇帝请问塔样，国师沉默良久。", "meaning": "真正归处无形无缝，不可图样化。", "source": "《从容录》第85则；亦见《碧岩录》第18则。", "tags": ["从容录", "忠国师", "无缝塔", "肃宗", "沉默", "归宿"], "score": 3}, {"id": "congronglu-86", "collection": "从容录", "collectionId": "congronglu", "number": 86, "title": "临济大悟", "original": "临济三问黄檗佛法大意，三度被打。后到大愚处，大愚云：“黄檗恁么老\n婆，为汝得彻困。”", "translation": "临济三次问黄檗佛法大意，三次被打。后来到大愚那里，大愚说：“黄檗这\n样老婆心切，为你费尽力气。”", "story": "临济三问佛法大意三次被打，后来经大愚点醒才知黄檗慈悲。", "meaning": "痛处回头看，才知道棒下全是慈悲。", "source": "《从容录》第86则；《临济录》。", "tags": ["从容录", "临济", "黄檗", "大愚", "棒喝", "大悟", "高传播"], "score": 5}, {"id": "congronglu-87", "collection": "从容录", "collectionId": "congronglu", "number": 87, "title": "疏山有无", "original": "疏山问僧：“有也未？无也未？”僧无语。", "translation": "疏山问僧人：“有也还不是，无也还不是，你怎样？”僧人答不上来。", "story": "疏山围绕有无问答，使学人看见自己如何落入两边。", "meaning": "有无两边都不是究竟。", "source": "《从容录》第87则。", "tags": ["从容录", "疏山", "有无", "两边", "究竟"], "score": 2}, {"id": "congronglu-88", "collection": "从容录", "collectionId": "congronglu", "number": 88, "title": "楞严不见", "original": "《楞严》云：“吾不见时，何不见吾不见之处？”", "translation": "《楞严经》说：“我不见的时候，为什么不见我不见的地方？”", "story": "围绕见与不见的经义展开禅门机锋，不让学人停在经文字面。", "meaning": "读经要照见自己，不只是解释概念。", "source": "《从容录》第88则；《楞严经》相关。", "tags": ["从容录", "楞严经", "见不见", "读经", "照见"], "score": 3}, {"id": "congronglu-89", "collection": "从容录", "collectionId": "congronglu", "number": 89, "title": "洞山无草", "original": "洞山云：“门前无草，室内生尘。”", "translation": "洞山说：“门前没有草，屋内却生了尘。”", "story": "洞山说无草处或草木境界，借自然物象勘验学人。", "meaning": "有草无草都是境，关键是是否被境转。", "source": "《从容录》第89则。", "tags": ["从容录", "洞山", "无草", "尘", "境界", "勘验"], "score": 2}, {"id": "congronglu-90", "collection": "从容录", "collectionId": "congronglu", "number": 90, "title": "仰山谨白", "original": "仰山云：“谨白大众，珍重。”", "translation": "仰山说：“谨慎地告白大众，请珍重。”", "story": "仰山以“谨白”等仪式性语言呈机，礼貌形式中藏锋。", "meaning": "庄重语言也可成为禅门活句。", "source": "《从容录》第90则。", "tags": ["从容录", "仰山", "谨白", "仪式语言", "活句"], "score": 2}, {"id": "congronglu-91", "collection": "从容录", "collectionId": "congronglu", "number": 91, "title": "南泉牡丹", "original": "陆亘问南泉：“肇法师道天地与我同根，万物与我一体，甚奇怪。”泉指庭前\n牡丹云：“时人见此一株花，如梦相似。”\n禅宗公案大全：从容录卷（100则完整版）\n30", "translation": "陆亘问南泉：“肇法师说天地与我同根，万物与我一体，很奇特。”南泉指着\n庭前牡丹说：“现在的人看这株花，就像在梦里一样。”", "story": "南泉以牡丹花回应万物一体之论。", "meaning": "花美如梦，见花者也当自省。", "source": "《从容录》第91则。", "tags": ["从容录", "南泉", "牡丹", "如梦", "万物一体", "陆亘"], "score": 4}, {"id": "congronglu-92", "collection": "从容录", "collectionId": "congronglu", "number": 92, "title": "云门一宝", "original": "云门云：“乾坤之内，宇宙之间，中有一宝，秘在形山。”", "translation": "云门说：“天地之内、宇宙之间，有一件宝物，秘密藏在身体这座山中。”", "story": "云门说乾坤之内、宇宙之间有一宝，秘在形山。", "meaning": "宝不在外，而在此身此心中。", "source": "《从容录》第92则；亦见《碧岩录》第62则相关。", "tags": ["从容录", "云门", "一宝", "形山", "自心", "宝藏"], "score": 4}, {"id": "congronglu-93", "collection": "从容录", "collectionId": "congronglu", "number": 93, "title": "鲁祖不会", "original": "僧问鲁祖：“如何是祖师西来意？”祖云：“不会。”", "translation": "僧人问鲁祖：“祖师从西方来的意思是什么？”鲁祖说：“不会。”", "story": "鲁祖以不会、不答等方式接人，让来者失去可抓取答案。", "meaning": "不会也是机锋，不是无知。", "source": "《从容录》第93则。", "tags": ["从容录", "鲁祖", "不会", "西来意", "不答", "机锋"], "score": 2}, {"id": "congronglu-94", "collection": "从容录", "collectionId": "congronglu", "number": 94, "title": "洞山不安", "original": "洞山不安，僧问：“和尚病中如何？”山云：“此身非我有。”", "translation": "洞山身体不安，僧人问：“和尚病中怎样？”洞山说：“这个身体并不是我所\n有。”\n禅宗公案大全：从容录卷（100则完整版）\n31", "story": "洞山病中或不安时仍以机锋接人，问疾成为参禅现场。", "meaning": "不安处正是观心处。", "source": "《从容录》第94则。", "tags": ["从容录", "洞山", "不安", "病中", "身体", "观心"], "score": 3}, {"id": "congronglu-95", "collection": "从容录", "collectionId": "congronglu", "number": 95, "title": "临济一画", "original": "临济拈拄杖画一画云：“会么？”", "translation": "临济拿起拄杖划了一下，说：“明白吗？”", "story": "临济以一画或一划示机，截断复杂解释。", "meaning": "一划也可成法，不在言多。", "source": "《从容录》第95则。", "tags": ["从容录", "临济", "一画", "拄杖", "示机"], "score": 3}, {"id": "congronglu-96", "collection": "从容录", "collectionId": "congronglu", "number": 96, "title": "九峰不肯", "original": "九峰云：“不肯不肯，直须亲到始得。”", "translation": "九峰说：“不肯、不肯，必须亲自到达才可以。”", "story": "九峰面对某种说法不肯承当，显出宗师严格眼目。", "meaning": "真正的“不肯”是护持正眼。", "source": "《从容录》第96则。", "tags": ["从容录", "九峰", "不肯", "亲到", "正眼"], "score": 2}, {"id": "congronglu-97", "collection": "从容录", "collectionId": "congronglu", "number": 97, "title": "光帝幞头", "original": "光帝问国师：“朕戴幞头，还相称否？”师云：“相称即不无，只是欠一著。”", "translation": "光帝问国师：“我戴着幞头，还相称吗？”国师说：“相称倒不是没有，只是\n还差一着。”", "story": "光帝与禅师围绕幞头等帝王服饰问答，宫廷日常中显禅机。", "meaning": "身份装束不能遮住本来人。\n禅宗公案大全：从容录卷（100则完整版）\n32", "source": "《从容录》第97则。", "tags": ["从容录", "光帝", "幞头", "国师", "身份", "本来人"], "score": 3}, {"id": "congronglu-98", "collection": "从容录", "collectionId": "congronglu", "number": 98, "title": "洞山常切", "original": "洞山云：“切忌从他觅，迢迢与我疏。”", "translation": "洞山说：“千万不要从别人那里寻找，那样会离自己越来越远。”", "story": "洞山开示“常切”等语，提醒修行不可离开切身处。", "meaning": "真正修行必须贴身、切己。", "source": "《从容录》第98则。", "tags": ["从容录", "洞山", "切忌从他觅", "切己", "自心"], "score": 3}, {"id": "congronglu-99", "collection": "从容录", "collectionId": "congronglu", "number": 99, "title": "云门钵桶", "original": "僧问云门：“如何是尘尘三昧？”门云：“钵里饭，桶里水。”", "translation": "僧人问云门：“什么是每一微尘中的三昧？”云门说：“钵里的饭，桶里的\n水。”", "story": "云门以钵桶、斋粥等丛林日用品回应问法。", "meaning": "吃饭用具也能显出法。", "source": "《从容录》第99则。", "tags": ["从容录", "云门", "钵桶", "饭水", "尘尘三昧", "日用"], "score": 4}, {"id": "congronglu-100", "collection": "从容录", "collectionId": "congronglu", "number": 100, "title": "琅琊山河", "original": "琅琊云：“山河大地，尽露法王身。”", "translation": "琅琊说：“山河大地，全都显露法王之身。”", "story": "琅琊围绕山河大地答问，收束百则公案。", "meaning": "山河大地本身就是最后的开示。", "source": "《从容录》第100则。", "tags": ["从容录", "琅琊", "山河大地", "法王身", "收束\n禅宗公案大全：从容录卷（100则完整版）\n33"], "score": 4}, {"id": "denglu-1", "collection": "灯录选粹", "collectionId": "denglu", "number": 1, "title": "释迦拈花", "original": "世尊在灵山会上，拈花示众。众皆默然，惟迦叶破颜微笑。世尊云：“吾有\n正法眼藏，涅槃妙心，付嘱摩诃迦叶。”", "translation": "世尊在灵山会上拿起一枝花给大众看，众人都沉默不懂，只有迦叶露出微\n笑。世尊说：“我有正法眼藏、涅槃妙心，现在付嘱给摩诃迦叶。”", "story": "灵山会上，世尊拈花，迦叶微笑，成为禅宗“以心传心”的象征源头。", "meaning": "最高的传承不一定靠语言，而在心心相印。", "source": "禅宗传灯传统；亦见《无门关》第6则系统。", "tags": ["灯录", "释迦", "迦叶", "拈花微笑", "以心传心", "禅宗源头", "高传播"], "score": 5}, {"id": "denglu-2", "collection": "灯录选粹", "collectionId": "denglu", "number": 2, "title": "达磨面壁", "original": "达磨寓止嵩山少林寺，面壁而坐，终日默然，人莫之测，谓之壁观婆罗\n门。", "translation": "达磨住在嵩山少林寺，面向墙壁而坐，整天沉默不语，别人无法测度他，\n称他为“壁观婆罗门”。", "story": "达磨西来后，与梁武帝不契，北上少林面壁九年。", "meaning": "真正的修行不是急于表达，而是以长久沉潜守住本分。", "source": "《景德传灯录》、达磨传灯系统。", "tags": ["灯录", "达磨", "少林", "面壁", "壁观", "沉潜", "高传播"], "score": 5}, {"id": "denglu-3", "collection": "灯录选粹", "collectionId": "denglu", "number": 3, "title": "慧可立雪", "original": "慧可立雪断臂，求达磨安心。", "translation": "慧可在雪中站立，并断臂以表求法决心，请达磨为他安心。", "story": "慧可为求法，在雪中久立，断臂求道，后来由“觅心了不可得”入门。", "meaning": "求法不是外在苦行，而是把求心之心逼到尽头。", "source": "达磨、慧可传灯系统。", "tags": ["灯录", "慧可", "立雪", "断臂", "求法", "安心", "高传播"], "score": 5}, {"id": "denglu-4", "collection": "灯录选粹", "collectionId": "denglu", "number": 4, "title": "慧可觅心", "original": "慧可曰：“我心未宁，乞师与安。”达磨曰：“将心来，与汝安。”可曰：“觅心\n了不可得。”磨曰：“与汝安心竟。”", "translation": "慧可说：“我的心不安，请师父替我安。”达磨说：“把心拿来，我替你安。”慧\n可说：“我寻找这颗心，最终找不到。”达磨说：“我已经替你安心了。”", "story": "慧可求安心，达磨让他寻找不安之心，慧可发现觅心不可得。", "meaning": "烦恼之心若被认真追寻，会发现它并无固定实体。", "source": "《景德传灯录》、达磨安心系统。", "tags": ["灯录", "达磨", "慧可", "安心", "觅心不可得", "高传播"], "score": 5}, {"id": "denglu-5", "collection": "灯录选粹", "collectionId": "denglu", "number": 5, "title": "三祖信心铭", "original": "至道无难，唯嫌拣择。但莫憎爱，洞然明白。", "translation": "最高的道并不难，只怕人起分别取舍。只要没有憎爱取舍，就会洞然明\n白。", "story": "《信心铭》开篇指出大道并不遥远，真正困难的是人的取舍、好恶、分\n别。", "meaning": "修行的核心障碍往往不是外境，而是不断比较选择的心。", "source": "三祖僧璨《信心铭》。", "tags": ["灯录", "三祖", "信心铭", "至道无难", "拣择", "分别心"], "score": 4}, {"id": "denglu-6", "collection": "灯录选粹", "collectionId": "denglu", "number": 6, "title": "六祖本来面目", "original": "不思善，不思恶，正与么时，哪个是明上座本来面目？", "translation": "不要想善，也不要想恶，就在这个时候，哪一个是明上座的本来面目？", "story": "惠明追六祖求法，六祖让他在善恶分别暂歇处回看本来面目。", "meaning": "当善恶、得失、身份暂时放下时，人得以回看未被遮蔽的自己。", "source": "《六祖坛经》；亦见《无门关》第23则系统。", "tags": ["灯录", "六祖", "惠明", "本来面目", "不思善恶", "高传播"], "score": 5}, {"id": "denglu-7", "collection": "灯录选粹", "collectionId": "denglu", "number": 7, "title": "风幡心动", "original": "不是风动，不是幡动，仁者心动。", "translation": "不是风在动，也不是幡在动，是你们的心在动。", "story": "两位僧人争论风动还是幡动，六祖一句话把争论从外物转回自心。", "meaning": "人以为自己在讨论外境，其实常常是在投射内心波动。", "source": "《六祖坛经》；亦见《无门关》第29则。", "tags": ["灯录", "六祖", "风幡心动", "心动", "分别心", "高传播"], "score": 5}, {"id": "denglu-8", "collection": "灯录选粹", "collectionId": "denglu", "number": 8, "title": "菩提本无树", "original": "菩提本无树，明镜亦非台。本来无一物，何处惹尘埃。", "translation": "菩提本来没有树，明镜也不是一个台。本来没有一物，哪里会惹上尘埃？", "story": "惠能以此偈回应神秀偈，显出顿悟破相的气象。", "meaning": "若执著有一个可擦拭、可成就的心台，仍未离相。", "source": "《六祖坛经》。", "tags": ["灯录", "六祖", "菩提偈", "本来无一物", "顿悟", "高传播"], "score": 5}, {"id": "denglu-9", "collection": "灯录选粹", "collectionId": "denglu", "number": 9, "title": "不识本心学法无益", "original": "不识本心，学法无益。", "translation": "如果不能认识自己的本心，学习佛法也没有真正益处。", "story": "六祖强调识自本心、见自本性，反对只在外相上用力。", "meaning": "佛法不是知识堆积，而是回到自心的明见。", "source": "《六祖坛经》系统。", "tags": ["灯录", "六祖", "本心", "见性", "学法", "自心"], "score": 4}, {"id": "denglu-10", "collection": "灯录选粹", "collectionId": "denglu", "number": 10, "title": "南岳磨砖", "original": "南岳磨砖。马祖问：“磨砖作么？”岳云：“磨作镜。”祖云：“磨砖岂得成\n镜？”岳云：“坐禅岂得成佛？”", "translation": "南岳磨砖。马祖问：“磨砖做什么？”南岳说：“磨成镜子。”马祖说：“磨砖怎\n么能成镜子？”南岳说：“坐禅又怎么能成佛？”", "story": "马祖坐禅，南岳在旁磨砖，借磨砖成镜破除执坐成佛。", "meaning": "形式本身不能保证觉悟；若执坐相，坐禅也可能成执著。", "source": "《景德传灯录》、马祖参南岳系统。", "tags": ["灯录", "南岳", "马祖", "磨砖作镜", "坐禅", "破执", "高传播"], "score": 5}, {"id": "denglu-11", "collection": "灯录选粹", "collectionId": "denglu", "number": 11, "title": "马祖即心即佛", "original": "大梅问马祖：“如何是佛？”祖云：“即心是佛。”", "translation": "大梅问马祖：“什么是佛？”马祖说：“当下这颗心就是佛。”", "story": "大梅由“即心是佛”入道，后来面对“非心非佛”试探仍不动摇。", "meaning": "佛不在心外，但“即心是佛”也不是口号。", "source": "马祖语录；亦见《无门关》第30则。", "tags": ["灯录", "马祖", "大梅", "即心是佛", "心佛", "传播"], "score": 4}, {"id": "denglu-12", "collection": "灯录选粹", "collectionId": "denglu", "number": 12, "title": "马祖非心非佛", "original": "马祖又云：“非心非佛。”", "translation": "马祖又说：“不是心，也不是佛。”", "story": "马祖有时说“即心是佛”，有时又说“非心非佛”。", "meaning": "禅师的话不可做成固定理论；药对病才是活法。", "source": "马祖语录；亦见《无门关》第33则。", "tags": ["灯录", "马祖", "非心非佛", "即心是佛", "活句", "对治"], "score": 4}, {"id": "denglu-13", "collection": "灯录选粹", "collectionId": "denglu", "number": 13, "title": "百丈一日不作一日不食", "original": "百丈年老，犹赴众作务。众藏其作具。师不作，亦不食。曰：“一日不作，\n一日不食。”", "translation": "百丈年老仍随众劳动。弟子把他的工具藏起来。百丈不能劳动，也就不吃\n饭，说：“一天不劳动，一天不吃饭。”", "story": "百丈年老仍坚持劳作，弟子藏工具，他便不吃饭。", "meaning": "禅不是脱离劳动的清谈，而是在劳动中落实修行。", "source": "百丈怀海传记、丛林清规传统。", "tags": ["灯录", "百丈", "一日不作一日不食", "劳动", "清规", "高传播"], "score": 5}, {"id": "denglu-14", "collection": "灯录选粹", "collectionId": "denglu", "number": 14, "title": "百丈野鸭子", "original": "马祖与百丈行次，见野鸭子飞过。祖云：“是什么？”丈云：“野鸭子。”祖\n云：“什么处去也？”丈云：“飞过去也。”祖遂扭百丈鼻头。", "translation": "马祖与百丈同行，看见野鸭飞过。马祖问：“那是什么？”百丈说：“野鸭\n子。”马祖问：“到哪里去了？”百丈说：“飞过去了。”马祖便扭百丈的鼻子。", "story": "百丈说野鸭飞过去，马祖扭鼻让他回到痛切当下。", "meaning": "以为境界飞走了，其实痛切当下从未离开。", "source": "《碧岩录》第53则；马祖、百丈系统。", "tags": ["灯录", "马祖", "百丈", "野鸭子", "当下", "高传播"], "score": 5}, {"id": "denglu-15", "collection": "灯录选粹", "collectionId": "denglu", "number": 15, "title": "黄檗棒下临济", "original": "临济三问黄檗佛法大意，三度被打。后大愚曰：“黄檗恁么老婆，为汝得彻\n困。”", "translation": "临济三次问黄檗佛法大意，三次被打。后来大愚说：“黄檗这样老婆心切，\n为你费尽力气。”", "story": "临济三次问佛法大意，三次被黄檗打，后来才知黄檗慈悲。", "meaning": "真正的打击有时是慈悲，痛处回头才见用心。", "source": "《临济录》、黄檗与临济传灯系统。", "tags": ["灯录", "黄檗", "临济", "棒喝", "大愚", "大悟", "高传播"], "score": 5}, {"id": "denglu-16", "collection": "灯录选粹", "collectionId": "denglu", "number": 16, "title": "临济无位真人", "original": "赤肉团上有一无位真人，常从汝等诸人面门出入。", "translation": "这血肉身体上有一位没有位次的真人，常从你们每个人的面门出入。", "story": "临济指出“无位真人”，有人问时，临济下座抓住对方追问。", "meaning": "人不只是身份、职位、标签，内里有不被位次规定的活泼真实者。", "source": "《临济录》；亦见《从容录》第38则系统。", "tags": ["灯录", "临济", "无位真人", "真实自我", "面门", "高传播"], "score": 5}, {"id": "denglu-17", "collection": "灯录选粹", "collectionId": "denglu", "number": 17, "title": "临济喝", "original": "临济有时一喝，如金刚王宝剑；有时一喝，如踞地金毛狮子。", "translation": "临济的喝，有时像金刚王宝剑一样锋利，有时像踞地金毛狮子一样威严。", "story": "临济宗以“喝”著称，但临济的喝不是情绪发泄，而是随不同情境而出。", "meaning": "真正的强烈表达不是粗暴，而是精准地切断妄想。", "source": "《临济录》。", "tags": ["灯录", "临济", "喝", "金刚王宝剑", "狮子", "棒喝"], "score": 4}, {"id": "denglu-18", "collection": "灯录选粹", "collectionId": "denglu", "number": 18, "title": "德山棒", "original": "道得也三十棒，道不得也三十棒。", "translation": "说得出也打三十棒，说不出也打三十棒。", "story": "德山以棒接人，与“临济喝”并称，截断学人知解。", "meaning": "当语言成了遮蔽，棒喝便成为另一种开示。", "source": "德山宣鉴语录、临济宗传统。", "tags": ["灯录", "德山", "棒", "棒喝", "知解", "截断"], "score": 4}, {"id": "denglu-19", "collection": "灯录选粹", "collectionId": "denglu", "number": 19, "title": "德山烧疏钞", "original": "德山曰：“穷诸玄辩，若一毫置于太虚；竭世枢机，似一滴投于巨壑。”遂焚\n其疏钞。", "translation": "德山说：“穷尽各种玄妙辩论，就像把一根毫毛放在太虚中；用尽世间机\n巧，就像把一滴水投入巨大深谷。”于是烧掉自己的注疏。", "story": "德山原精通《金刚经》，被龙潭点醒后，烧掉多年注疏。", "meaning": "知识可贵，但执著知识会挡住直接体验。", "source": "德山宣鉴传记。", "tags": ["灯录", "德山", "烧疏钞", "金刚经", "放下知识", "高传播"], "score": 5}, {"id": "denglu-20", "collection": "灯录选粹", "collectionId": "denglu", "number": 20, "title": "龙潭吹烛", "original": "龙潭点纸烛度与德山。山拟接，潭便吹灭。山于此大悟。\n禅宗公案大全：灯录选粹与传播索引\n7", "translation": "龙潭点燃纸烛递给德山。德山正要接，龙潭便把火吹灭。德山因此大悟。", "story": "德山夜参龙潭，出门见黑，龙潭点烛又吹灭，德山当下大悟。", "meaning": "外在光明被吹灭时，人才可能发现真正明处。", "source": "《无门关》第28则；德山、龙潭系统。", "tags": ["灯录", "龙潭", "德山", "吹烛", "大悟", "高传播"], "score": 5}, {"id": "denglu-21", "collection": "灯录选粹", "collectionId": "denglu", "number": 21, "title": "南泉平常心是道", "original": "赵州问南泉：“如何是道？”泉云：“平常心是道。”州云：“还可趣向否？”泉\n云：“拟向即乖。”", "translation": "赵州问南泉：“什么是道？”南泉说：“平常心就是道。”赵州问：“可以朝它努\n力吗？”南泉说：“一想趋向，就已经违背。”", "story": "南泉以“平常心是道”回答赵州，又指出刻意趋向便错。", "meaning": "道不在奇特境界，而在不造作、不攀缘的平常心。", "source": "《无门关》第19则。", "tags": ["灯录", "南泉", "赵州", "平常心", "道", "高传播"], "score": 5}, {"id": "denglu-22", "collection": "灯录选粹", "collectionId": "denglu", "number": 22, "title": "赵州吃茶去", "original": "赵州问僧：“曾到此间么？”云：“曾到。”州云：“吃茶去。”又问僧，云：“不\n曾到。”州亦云：“吃茶去。”", "translation": "赵州问僧人：“曾到过这里吗？”僧人说：“曾到。”赵州说：“去喝茶。”又问另\n一僧，僧说：“不曾到。”赵州也说：“去喝茶。”", "story": "不论僧人曾到或不曾到，赵州都说“吃茶去”，院主不解，赵州也让他吃\n茶去。", "meaning": "对不同人说同一句，不是机械重复，而是让人回到当下。", "source": "《五灯会元》、赵州语录。", "tags": ["灯录", "赵州", "吃茶去", "茶", "日用", "高传播"], "score": 5}, {"id": "denglu-23", "collection": "灯录选粹", "collectionId": "denglu", "number": 23, "title": "赵州十二时", "original": "十二时中，莫被十二时使。", "translation": "一天十二个时辰之中，不要被这十二个时辰支配。", "story": "赵州常从十二时辰、吃饭穿衣中显出禅机。", "meaning": "真正修行不离一天十二时辰。", "source": "赵州语录系统。", "tags": ["灯录", "赵州", "十二时", "日用", "时间", "修行"], "score": 4}, {"id": "denglu-24", "collection": "灯录选粹", "collectionId": "denglu", "number": 24, "title": "赵州无字", "original": "僧问赵州：“狗子还有佛性也无？”州云：“无。”", "translation": "僧人问赵州：“狗有没有佛性？”赵州说：“没有。”", "story": "一“无”字成为后世禅门最重要话头之一。", "meaning": "公案不是谜底，而是逼人突破知解的工具。", "source": "《无门关》第1则；赵州语录。", "tags": ["灯录", "赵州", "无字", "狗子佛性", "话头", "高传播"], "score": 5}, {"id": "denglu-25", "collection": "灯录选粹", "collectionId": "denglu", "number": 25, "title": "南泉庭前花如梦", "original": "南泉指庭前花云：“时人见此一株花，如梦相似。”", "translation": "南泉指着庭前花说：“现在的人看见这一株花，就像在梦里一样。”", "story": "陆亘谈天地同根、万物一体，南泉指庭前花说如梦。", "meaning": "如果不能真实看见眼前一花，高谈万物一体仍像梦话。", "source": "《碧岩录》第40则系统。", "tags": ["灯录", "南泉", "庭前花", "如梦", "万物一体"], "score": 4}, {"id": "denglu-26", "collection": "灯录选粹", "collectionId": "denglu", "number": 26, "title": "云门日日是好日", "original": "十五日已前不问汝，十五日已后道将一句来。自代云：“日日是好日。”", "translation": "十五日以前的事不问你，十五日以后说一句来。云门自己代答：“天天都是\n好日子。”", "story": "云门自问自答“日日是好日”，并非鸡汤式乐观。", "meaning": "日日都可成为道场，关键不在日子好坏，而在心是否被境转。", "source": "《碧岩录》第6则。", "tags": ["灯录", "云门", "日日是好日", "时间", "平常心", "高传播"], "score": 5}, {"id": "denglu-27", "collection": "灯录选粹", "collectionId": "denglu", "number": 27, "title": "云门屎橛", "original": "僧问云门：“如何是佛？”门云：“干屎橛。”", "translation": "僧人问云门：“什么是佛？”云门说：“干屎橛。”", "story": "云门用粗粝回答打碎学人对佛的圣洁想象。", "meaning": "佛若被做成神圣标签，就又成了偶像。", "source": "《无门关》第21则。", "tags": ["灯录", "云门", "干屎橛", "佛", "破圣洁相", "高传播"], "score": 5}, {"id": "denglu-28", "collection": "灯录选粹", "collectionId": "denglu", "number": 28, "title": "云门饼", "original": "僧问云门：“如何是超佛越祖之谈？”门云：“糊饼。”", "translation": "僧人问云门：“什么是超越佛祖的言谈？”云门说：“糊饼。”", "story": "云门以糊饼、胡饼等食物回应佛法问题，把玄妙问题落回可吃之物。", "meaning": "饥来吃饭，日用即真。", "source": "《碧岩录》第77则、《从容录》第78则系统。", "tags": ["灯录", "云门", "糊饼", "超佛越祖", "日用", "高传播"], "score": 5}, {"id": "denglu-29", "collection": "灯录选粹", "collectionId": "denglu", "number": 29, "title": "云门一字关", "original": "云门常以一字示人，或云“关”，或云“普”，或云“露”。", "translation": "云门常用一个字来开示人，有时说“关”，有时说“普”，有时说“露”。\n禅宗公案大全：灯录选粹与传播索引\n10", "story": "云门常以一个字作答，字越少，越不给学人铺陈解释的空间。", "meaning": "一句乃至一字都可成为参究关口。", "source": "云门语录系统。", "tags": ["灯录", "云门", "一字关", "关", "普", "露", "话头"], "score": 4}, {"id": "denglu-30", "collection": "灯录选粹", "collectionId": "denglu", "number": 30, "title": "云门露柱", "original": "云门云：“古佛与露柱相交，是第几机？”", "translation": "云门说：“古佛与寺院柱子相交，是第几种机？”", "story": "云门以露柱答问，把寺院中的柱子变成说法者。", "meaning": "无情物也能说法，关键在见者之眼。", "source": "《从容录》第31则、《碧岩录》第83则系统。", "tags": ["灯录", "云门", "露柱", "古佛", "无情说法"], "score": 3}, {"id": "denglu-31", "collection": "灯录选粹", "collectionId": "denglu", "number": 31, "title": "洞山过水", "original": "切忌从他觅，迢迢与我疏。我今独自往，处处得逢渠。", "translation": "千万不要向别人那里寻找，那样会离自己越来越远。我如今独自前行，处\n处都能遇见它。", "story": "洞山过水时见水中倒影，因偈语而领会从向外寻求转回自身。", "meaning": "真正要找的东西，并不在外面另一个地方。", "source": "洞山良价传记。", "tags": ["灯录", "洞山", "过水", "倒影", "切忌从他觅", "高传播"], "score": 5}, {"id": "denglu-32", "collection": "灯录选粹", "collectionId": "denglu", "number": 32, "title": "洞山麻三斤", "original": "僧问洞山：“如何是佛？”山云：“麻三斤。”", "translation": "僧人问洞山：“什么是佛？”洞山说：“三斤麻。”\n禅宗公案大全：灯录选粹与传播索引\n11", "story": "僧问如何是佛，洞山答“麻三斤”，把佛拉回具体重量与日常物件。", "meaning": "佛不离眼前一物，但也不可把一物解释成佛。", "source": "《无门关》第18则、《碧岩录》第12则。", "tags": ["灯录", "洞山", "麻三斤", "佛", "日常物", "高传播"], "score": 5}, {"id": "denglu-33", "collection": "灯录选粹", "collectionId": "denglu", "number": 33, "title": "曹山宾主", "original": "曹山示众，有宾中主、主中宾、宾中宾、主中主之语。", "translation": "曹山开示中，有“宾中有主、主中有宾、宾中宾、主中主”等说法。", "story": "曹洞宗重视宾主、偏正、回互之法，曹山常借问答检验学人落处。", "meaning": "修行不是单向答案，而是关系与位置中的活用。", "source": "曹洞宗语录系统。", "tags": ["灯录", "曹山", "宾主", "曹洞宗", "偏正", "回互"], "score": 3}, {"id": "denglu-34", "collection": "灯录选粹", "collectionId": "denglu", "number": 34, "title": "法眼慧超", "original": "慧超问法眼：“如何是佛？”眼云：“汝是慧超。”", "translation": "慧超问法眼：“什么是佛？”法眼说：“你就是慧超。”", "story": "慧超问“如何是佛”，法眼不解释佛是什么，而把提问者送回自己。", "meaning": "向外找佛，不如回看当下这个问者。", "source": "《碧岩录》第7则。", "tags": ["灯录", "法眼", "慧超", "如何是佛", "回到自己"], "score": 4}, {"id": "denglu-35", "collection": "灯录选粹", "collectionId": "denglu", "number": 35, "title": "法眼曹源一滴水", "original": "僧问法眼：“如何是曹源一滴水？”眼云：“是曹源一滴水。”", "translation": "僧人问法眼：“什么是曹源一滴水？”法眼说：“就是曹源一滴水。”", "story": "法眼不另起解释，只将问题原样归还。", "meaning": "有时最直接的回答，就是不在原物之外另造意义。", "source": "法眼语录、《五灯会元》系统。\n禅宗公案大全：灯录选粹与传播索引\n12", "tags": ["灯录", "法眼", "曹源一滴水", "直接", "不增益"], "score": 3}, {"id": "denglu-36", "collection": "灯录选粹", "collectionId": "denglu", "number": 36, "title": "药山不许看经", "original": "药山看经，僧问：“和尚寻常不许人看经，为甚却自看？”山云：“我只图遮\n眼。”", "translation": "药山看经时，僧人问：“和尚平常不许别人看经，为什么自己却看？”药山\n说：“我只是为了遮遮眼。”", "story": "药山常被问为何自己看经却不许学人死看经，差别在是否被文字转。", "meaning": "经典可以开眼，也可以遮眼，关键在用心。", "source": "药山惟俨语录系统。", "tags": ["灯录", "药山", "看经", "文字", "遮眼", "经典"], "score": 4}, {"id": "denglu-37", "collection": "灯录选粹", "collectionId": "denglu", "number": 37, "title": "沩山踢倒净瓶", "original": "百丈拈净瓶问：“不得唤作净瓶，汝唤作甚么？”沩山乃趯倒净瓶而去。", "translation": "百丈拿起净瓶问：“不能叫它净瓶，你叫它什么？”沩山便踢倒净瓶走了。", "story": "百丈设语言陷阱，沩山不再命名，而是踢倒净瓶。", "meaning": "面对语言陷阱，最好的回答有时是把问题本身踢翻。", "source": "《无门关》第40则。", "tags": ["灯录", "沩山", "百丈", "净瓶", "语言陷阱", "行动回答"], "score": 4}, {"id": "denglu-38", "collection": "灯录选粹", "collectionId": "denglu", "number": 38, "title": "香严击竹", "original": "香严一日芟除草木，偶抛瓦砾，击竹作声，忽然省悟。", "translation": "香严有一天除草，偶然抛出瓦砾，瓦砾击中竹子发出声音，他忽然省悟。", "story": "香严多年苦参不得，后来扫地除草时，瓦砾击竹声成为悟入契机。", "meaning": "悟道不一定发生在讲堂，也可能发生在扫地一声中。", "source": "《五灯会元》香严智闲传记。", "tags": ["灯录", "香严", "击竹", "瓦砾", "悟道", "高传播\n禅宗公案大全：灯录选粹与传播索引\n13"], "score": 5}, {"id": "denglu-39", "collection": "灯录选粹", "collectionId": "denglu", "number": 39, "title": "香严上树", "original": "如人上树，口衔树枝，手不攀枝，脚不踏树。树下有人问西来意，不对违\n问，若对丧身失命。", "translation": "像一个人上了树，口里咬着树枝，手不能攀，脚不能踏。树下有人问祖师\n西来的意思，不回答就辜负提问，回答又会丧命。", "story": "香严设下语言和沉默都无路的两难险境。", "meaning": "语言和沉默都无路时，才是真关口。", "source": "《无门关》第5则。", "tags": ["灯录", "香严", "上树", "西来意", "语言困境", "高传播"], "score": 5}, {"id": "denglu-40", "collection": "灯录选粹", "collectionId": "denglu", "number": 40, "title": "仰山插锹", "original": "沩山问仰山：“田中多少人？”仰山插下锹子，叉手而立。", "translation": "沩山问仰山：“田里有多少人？”仰山把锹插在地上，叉手站立。", "story": "沩山问仰山田中多少人，仰山插下锹子，叉手而立。", "meaning": "不必离开眼前动作另求答案。", "source": "《从容录》第15则。", "tags": ["灯录", "仰山", "沩山", "插锹", "田中", "动作"], "score": 3}, {"id": "denglu-41", "collection": "灯录选粹", "collectionId": "denglu", "number": 41, "title": "刘铁磨", "original": "刘铁磨到沩山。山云：“老牸牛，汝来也。”磨云：“来日台山大会斋，和尚还\n去么？”", "translation": "刘铁磨来到沩山。沩山说：“老母牛，你来了。”刘铁磨说：“明天台山有大会\n斋，和尚去吗？”", "story": "刘铁磨是禅门著名女禅者，机锋刚烈，与诸师往来不让须眉。", "meaning": "禅门看见地，不以性别身份定高下。\n禅宗公案大全：灯录选粹与传播索引\n14", "source": "《碧岩录》第24则、《从容录》第60则系统。", "tags": ["灯录", "刘铁磨", "女禅者", "沩山", "台山", "机锋"], "score": 4}, {"id": "denglu-42", "collection": "灯录选粹", "collectionId": "denglu", "number": 42, "title": "婆子烧庵", "original": "婆子遣女子抱定曰：“正恁么时如何？”僧曰：“枯木倚寒岩，三冬无暖气。”\n婆曰：“我二十年只供养得个俗汉。”遂烧却庵。", "translation": "婆子派女子抱住僧人问：“正在这个时候怎么样？”僧人说：“枯木靠着寒\n岩，三冬也没有暖气。”婆子说：“我二十年只供养了一个俗汉。”于是烧掉庵。", "story": "婆子供养僧人多年，试探后认为其只有枯寂冷漠而无活泼禅心，便烧\n庵逐僧。", "meaning": "禅不是冷漠无情；枯寂也可能是病。", "source": "禅林故事传统。", "tags": ["灯录", "婆子烧庵", "枯木寒岩", "女居士", "试探", "高传播"], "score": 5}, {"id": "denglu-43", "collection": "灯录选粹", "collectionId": "denglu", "number": 43, "title": "庞居士好雪片片", "original": "庞居士指雪云：“好雪片片，不落别处。”", "translation": "庞居士指着雪说：“好雪一片一片，都没有落到别处。”", "story": "庞居士见雪，说“好雪片片，不落别处”。", "meaning": "万物各安其位，当下圆满无差。", "source": "《碧岩录》第42则系统；庞蕴居士语录。", "tags": ["灯录", "庞居士", "好雪片片", "不落别处", "雪", "高传播"], "score": 5}, {"id": "denglu-44", "collection": "灯录选粹", "collectionId": "denglu", "number": 44, "title": "庞居士一家", "original": "庞居士云：“难难难，十石油麻树上摊。”灵照云：“易易易，百草头上祖师\n意。”", "translation": "庞居士说：“难啊难，像把十石油麻摊在树上一样难。”灵照说：“容易啊容\n易，百草头上都是祖师意。”\n禅宗公案大全：灯录选粹与传播索引\n15", "story": "庞居士一家皆有禅机，女儿灵照尤其机敏，常以日常语句显出居士禅\n风。", "meaning": "禅不只在寺院，也可在家庭与日常生活中活出。", "source": "庞蕴居士传记。", "tags": ["灯录", "庞居士", "灵照", "居士禅", "家庭", "日常"], "score": 4}, {"id": "denglu-45", "collection": "灯录选粹", "collectionId": "denglu", "number": 45, "title": "维摩默然", "original": "诸菩萨各说不二法门。文殊问维摩诘，维摩默然。", "translation": "诸位菩萨各自说明不二法门。文殊问维摩诘时，维摩诘沉默不语。", "story": "诸菩萨各说不二法门，维摩居士默然无言，文殊赞其真入不二。", "meaning": "真正不二处，语言不得其门而入。", "source": "《维摩诘经》；亦见《碧岩录》第84则、《从容录》第48则系统。", "tags": ["灯录", "维摩", "文殊", "不二法门", "默然", "高传播"], "score": 5}, {"id": "denglu-46", "collection": "灯录选粹", "collectionId": "denglu", "number": 46, "title": "丹霞烧佛", "original": "丹霞因天寒，取木佛烧火向。院主责之。霞曰：“吾烧取舍利。”主曰：“木佛\n何有舍利？”霞曰：“既无舍利，更取两尊烧。”", "translation": "丹霞因天气寒冷，取木佛烧火取暖。院主责备他。丹霞说：“我烧它取舍\n利。”院主说：“木佛哪里有舍利？”丹霞说：“既然没有舍利，再取两尊来烧。”", "story": "丹霞天寒劈木佛取暖，以“取舍利”反问院主对形式的执著。", "meaning": "破除对形式的执著，但传播时必须说明不是鼓励毁坏佛像。", "source": "丹霞天然传记、《五灯会元》。", "tags": ["灯录", "丹霞", "烧佛", "木佛", "破执", "高传播"], "score": 5}, {"id": "denglu-47", "collection": "灯录选粹", "collectionId": "denglu", "number": 47, "title": "首山竹篦", "original": "首山拈竹篦示众云：“唤作竹篦则触，不唤作竹篦则背。唤作甚么？”\n禅宗公案大全：灯录选粹与传播索引\n16", "translation": "首山拿起竹篦对大众说：“叫它竹篦就触犯，不叫它竹篦就背离。那该叫它\n什么？”", "story": "首山拈竹篦，令众人在叫与不叫之间无处安身。", "meaning": "语言命名本身会把人带入两难。", "source": "《无门关》第43则。", "tags": ["灯录", "首山", "竹篦", "命名", "语言两难"], "score": 4}, {"id": "denglu-48", "collection": "灯录选粹", "collectionId": "denglu", "number": 48, "title": "芭蕉拄杖", "original": "芭蕉云：“汝有拄杖子，我与汝拄杖子；汝无拄杖子，我夺汝拄杖子。”", "translation": "芭蕉说：“你有拄杖，我给你拄杖；你没有拄杖，我夺走你的拄杖。”", "story": "芭蕉在有无之间都不给人安身处。", "meaning": "有无两边都要放下。", "source": "《无门关》第44则。", "tags": ["灯录", "芭蕉", "拄杖", "有无", "夺与", "破依赖"], "score": 4}, {"id": "denglu-49", "collection": "灯录选粹", "collectionId": "denglu", "number": 49, "title": "竿头进步", "original": "百尺竿头须进步，十方世界现全身。", "translation": "站在百尺竿头还必须再进一步，十方世界都会显现全身。", "story": "百尺竿头已经极高，却仍被要求无路处再进一步。", "meaning": "最高处若被执著，仍是障碍。", "source": "《无门关》第46则。", "tags": ["灯录", "百尺竿头", "进步", "放下高处", "高传播"], "score": 5}, {"id": "denglu-50", "collection": "灯录选粹", "collectionId": "denglu", "number": 50, "title": "牛过窗棂", "original": "譬如水牯牛过窗棂，头角四蹄都过了，因甚么尾巴过不得？", "translation": "比如水牯牛穿过窗格，头、角和四只脚都过去了，为什么尾巴却过不去？", "story": "水牯牛头角四蹄都过窗棂，最后尾巴却卡住。\n禅宗公案大全：灯录选粹与传播索引\n17", "meaning": "最后一丝细微执著，往往最难放下。", "source": "《无门关》第38则。", "tags": ["灯录", "牛过窗棂", "水牯牛", "尾巴", "细微执著", "高传播"], "score": 5}, {"id": "denglu-51", "collection": "灯录选粹", "collectionId": "denglu", "number": 51, "title": "瑞岩唤主人公", "original": "瑞岩每日自唤：“主人公！”复自应诺：“喏！”乃云：“惺惺著，莫受人瞒！”", "translation": "瑞岩每天自己叫自己：“主人公！”又自己答：“在！”然后提醒自己：“要清\n醒，不要被别人欺瞒！”", "story": "瑞岩每天自唤“主人公”，又自己应答，提醒自己保持清醒。", "meaning": "每日把自己叫醒，是最朴素有效的修行。", "source": "《无门关》第12则。", "tags": ["灯录", "瑞岩", "主人公", "自我唤醒", "觉察", "高传播"], "score": 5}, {"id": "denglu-52", "collection": "灯录选粹", "collectionId": "denglu", "number": 52, "title": "倩女离魂", "original": "倩女离魂，那个是真底？", "translation": "倩女魂魄离身，哪一个才是真的倩女？", "story": "倩女魂魄离身，身体与魂魄分处两地，禅师借此追问何者为真。", "meaning": "身份、自我、身心关系并不像日常想象中那么确定。", "source": "《无门关》第35则。", "tags": ["灯录", "倩女离魂", "自我", "身心", "真假"], "score": 4}, {"id": "denglu-53", "collection": "灯录选粹", "collectionId": "denglu", "number": 53, "title": "女子出定", "original": "文殊不能出女子定，罔明菩萨一弹指，女子从定而出。", "translation": "文殊不能让女子出定，罔明菩萨弹指一下，女子便从定中出来。", "story": "文殊不能令一女子出定，而罔明菩萨一弹指便能使其出定。", "meaning": "作用不可以地位高低简单判断。", "source": "《无门关》第42则。\n禅宗公案大全：灯录选粹与传播索引\n18", "tags": ["灯录", "文殊", "女子出定", "罔明菩萨", "三昧"], "score": 3}, {"id": "denglu-54", "collection": "灯录选粹", "collectionId": "denglu", "number": 54, "title": "国师无缝塔", "original": "肃宗问忠国师：“百年后所须何物？”师云：“与老僧作个无缝塔。”帝曰：“请\n师塔样。”师良久。", "translation": "肃宗问忠国师：“百年之后，您需要什么？”国师说：“给老僧造一座无缝\n塔。”皇帝说：“请师父说说塔的样子。”国师沉默很久。", "story": "国师临终要皇帝造无缝塔，皇帝问塔样，国师沉默良久。", "meaning": "最终归宿无形无相。", "source": "《碧岩录》第18则、《从容录》第85则。", "tags": ["灯录", "忠国师", "无缝塔", "肃宗", "沉默", "归宿"], "score": 3}, {"id": "denglu-55", "collection": "灯录选粹", "collectionId": "denglu", "number": 55, "title": "外道问佛", "original": "外道问佛：“不问有言，不问无言。”世尊良久。", "translation": "外道问佛：“我不问有语言，也不问无语言。”世尊沉默了很久。", "story": "外道问佛，不问有言，不问无言，世尊以静坐沉默回应。", "meaning": "沉默不是无答，有时正是不落两边的回答。", "source": "《无门关》第32则、《碧岩录》第65则。", "tags": ["灯录", "世尊", "外道", "有言无言", "沉默"], "score": 4}, {"id": "denglu-56", "collection": "灯录选粹", "collectionId": "denglu", "number": 56, "title": "二僧卷帘", "original": "法眼以手指帘，二僧同去卷帘。眼云：“一得一失。”", "translation": "法眼用手指向帘子，两位僧人同时去卷帘。法眼说：“一个得，一个失。”", "story": "两 (function() {
  var canvas = document.getElementById('inkCanvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var inkDrops = [];
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  function InkDrop() {
    var self = this;
    self.x = Math.random() * canvas.width;
    self.y = Math.random() * canvas.height;
    self.radius = Math.random() * 120 + 40;
    self.opacity = Math.random() * 0.04 + 0.01;
    self.speedX = (Math.random() - 0.5) * 0.15;
    self.speedY = (Math.random() - 0.5) * 0.1;
    self.life = 0;
    self.maxLife = 400 + Math.random() * 600;
    self.color = Math.random() > 0.6 ? '201,168,76' : '94,234,212';
    self.update = function() {
      self.x += self.speedX; self.y += self.speedY; self.life++;
      if (self.life > self.maxLife || self.x < -200 || self.x > canvas.width + 200 || self.y < -200 || self.y > canvas.height + 200) {
        self.x = Math.random() * canvas.width; self.y = Math.random() * canvas.height;
        self.life = 0; self.maxLife = 400 + Math.random() * 600;
        self.color = Math.random() > 0.6 ? '201,168,76' : '94,234,212';
      }
    };
    self.draw = function() {
      var f = Math.sin((self.life / self.maxLife) * Math.PI);
      var a = self.opacity * f;
      var g = ctx.createRadialGradient(self.x, self.y, 0, self.x, self.y, self.radius);
      g.addColorStop(0, 'rgba(' + self.color + ',' + (a * 1.5) + ')');
      g.addColorStop(0.5, 'rgba(' + self.color + ',' + (a * 0.5) + ')');
      g.addColorStop(1, 'rgba(' + self.color + ',0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(self.x, self.y, self.radius, 0, Math.PI * 2);
      ctx.fill();
    };
  }
  for (var j = 0; j < 15; j++) inkDrops.push(new InkDrop());
  (function loop() { ctx.clearRect(0, 0, canvas.width, canvas.height); inkDrops.forEach(function(d) { d.update(); d.draw(); }); requestAnimationFrame(loop); })();
})();

  var h = '<button class="filter-btn active" data-col="all">全部</button>';
  for (var i = 0; i < order.length; i++) {
    h += '<button class="filter-btn" data-col="' + order[i] + '">' + order[i] + '</button>';
  }
  container.innerHTML = h;
  container.querySelectorAll('.filter-btn').forEach(function(b) {
    b.addEventListener('click', function() { setCollection(this.getAttribute('data-col')); });
  });
}

function renderScoreFilters() {
  var container = document.getElementById('scoreFilters');
  var h = '<button class="score-btn active" data-sc="0">全</button>';
  for (var i = 5; i >= 1; i--) h += '<button class="score-btn" data-sc="' + i + '">' + i + '</button>';
  container.innerHTML = h;
  container.querySelectorAll('.score-btn').forEach(function(b) {
    b.addEventListener('click', function() { setScore(parseInt(this.getAttribute('data-sc'))); });
  });
}

function setCollection(c) {
  activeCollection = c;
  document.querySelectorAll('#collectionFilters .filter-btn').forEach(function(b) { b.classList.remove('active'); });
  var t = document.querySelector('#collectionFilters [data-col="' + c + '"]');
  if (t) t.classList.add('active');
  filterKoans();
}

function setScore(s) {
  activeScore = s;
  document.querySelectorAll('#scoreFilters .score-btn').forEach(function(b) { b.classList.remove('active'); });
  var t = document.querySelector('#scoreFilters [data-sc="' + s + '"]');
  if (t) t.classList.add('active');
  filterKoans();
}

function filterKoans() {
  searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
  renderKoans();
}

function getFilteredKoans() {
  var result = [];
  for (var i = 0; i < KOANS.length; i++) {
    var k = KOANS[i];
    if (activeCollection !== 'all' && k.collection !== activeCollection) continue;
    if (activeScore > 0 && k.score !== activeScore) continue;
    if (searchQuery) {
      var q = searchQuery;
      var match = false;
      if (k.title && k.title.toLowerCase().indexOf(q) !== -1) match = true;
      else if (k.story && k.story.toLowerCase().indexOf(q) !== -1) match = true;
      else if (k.meaning && k.meaning.toLowerCase().indexOf(q) !== -1) match = true;
      else if (k.original && k.original.toLowerCase().indexOf(q) !== -1) match = true;
      else if (k.translation && k.translation.toLowerCase().indexOf(q) !== -1) match = true;
      else if (k.source && k.source.toLowerCase().indexOf(q) !== -1) match = true;
      else if (k.collection && k.collection.toLowerCase().indexOf(q) !== -1) match = true;
      else if (k.tags) {
        for (var ti = 0; ti < k.tags.length; ti++) {
          if (k.tags[ti].toLowerCase().indexOf(q) !== -1) { match = true; break; }
        }
      }
      if (!match) continue;
    }
    result.push(k);
  }
  return result;
}

function escapeHtml(str) {
  if (!str) return '';
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

function renderKoans() {
  var filtered = getFilteredKoans();
  var grid = document.getElementById('koansGrid');
  var countEl = document.getElementById('resultsCount');
  
  countEl.textContent = '共 ' + filtered.length + ' 则公案（总计 ' + TOTAL_KOANS + ' 则）';
  
  var html = '';
  for (var i = 0; i < filtered.length; i++) {
    var k = filtered[i];
    var sd = '';
    for (var s = 0; s < 5; s++) {
      sd += '<div class="score-dot' + (s < k.score ? (k.score >= 4 ? ' filled high' : ' filled') : '') + '"></div>';
    }
    var preview = k.story || k.translation || '';
    if (preview.length > 100) preview = preview.slice(0, 100) + '...';
    var th = '';
    if (k.tags && k.tags.length) {
      for (var ti = 0; ti < Math.min(k.tags.length, 3); ti++) {
        th += '<span class="mini-tag">' + escapeHtml(k.tags[ti]) + '</span>';
      }
    }
    html += '<div class="koan-card" data-koan-id="' + k.id + '">' +
      '<div class="card-header"><span class="card-num">#' + k.number + '</span><div class="card-score">' + sd + '</div></div>' +
      '<h3>' + escapeHtml(k.title) + '</h3>' +
      '<p class="card-story">' + escapeHtml(preview) + '</p>' +
      '<div class="card-footer"><span class="card-collection">' + escapeHtml(k.collection) + '</span><div class="card-tags">' + th + '</div></div>' +
    '</div>';
  }
  grid.innerHTML = html;
  
  grid.querySelectorAll('.koan-card').forEach(function(card) {
    card.addEventListener('click', function() { openKoanDetail(this.getAttribute('data-koan-id')); });
  });
}

var currentModalKoanId = null;

function openKoanDetail(id) {
  var k = koanMap[id];
  if (!k) return;
  currentModalKoanId = id;
  
  var sd = '';
  for (var i = 0; i < 5; i++) sd += '<div class="dot' + (i < k.score ? ' filled' : '') + '"></div>';
  
  var th = '';
  if (k.tags && k.tags.length) {
    th = '<div class="modal-tags">';
    for (var i = 0; i < k.tags.length; i++) {
      th += '<span class="tag" data-tag-idx="' + i + '">' + escapeHtml(k.tags[i]) + '</span>';
    }
    th += '</div>';
  }
  
  var body = '';
  if (k.original) {
    body += '<div class="section-label original"><div class="bar original"></div><span>古 文 原 文</span></div>';
    body += '<div class="original-text">' + escapeHtml(k.original) + '</div>';
  }
  if (k.translation) {
    body += '<div class="section-label translation"><div class="bar translation"></div><span>白 话 释 义</span></div>';
    body += '<div class="translation-text">' + escapeHtml(k.translation) + '</div>';
  }
  if ((k.original || k.translation) && (k.story || k.meaning)) {
    body += '<div class="content-divider"><div class="line"></div><div class="dot"></div><div class="line"></div></div>';
  }
  if (k.story) {
    body += '<div class="section-label story"><div class="bar story"></div><span>故 事 梗 概</span></div>';
    body += '<div class="story-text">' + escapeHtml(k.story) + '</div>';
  }
  if (k.meaning) {
    body += '<div class="section-label meaning"><div class="bar meaning"></div><span>故 事 意 义</span></div>';
    body += '<div class="meaning-text">' + escapeHtml(k.meaning) + '</div>';
  }
  if (!body) body = '<p style="color:var(--text-dim)">暂无内容</p>';
  
  var mh = '<div class="modal-overlay" id="modalOverlay"><div class="modal">' +
    '<button class="modal-close" id="modalCloseBtn">✕</button>' +
    '<div class="modal-collection">' + escapeHtml(k.collection) + ' · 第' + k.number + '则</div>' +
    '<h2>' + escapeHtml(k.title) + '</h2>' +
    '<div class="modal-source">' + escapeHtml(k.source || '') + '</div>' +
    th + body +
    '<div class="modal-score"><span style="color:var(--text-dim);font-size:12px;letter-spacing:2px;">传播评分</span>' +
    '<div class="dots">' + sd + '</div><span style="color:var(--gold-dim);font-size:13px;">' + k.score + '/5</span></div>' +
    '</div></div>';
  
  document.getElementById('modalContainer').innerHTML = mh;
  document.body.style.overflow = 'hidden';
  
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
  
  var tc = document.querySelector('.modal-tags');
  if (tc) {
    tc.addEventListener('click', function(e) {
      var tagEl = e.target.closest('.tag');
      if (tagEl) {
        var idx = parseInt(tagEl.getAttribute('data-tag-idx'));
        if (!isNaN(idx) && k.tags && k.tags[idx]) { e.stopPropagation(); searchByTag(k.tags[idx]); }
      }
    });
  }
}

function searchByTag(tag) {
  closeModal();
  document.getElementById('searchInput').value = tag;
  searchQuery = tag.toLowerCase().trim();
  document.getElementById('top').scrollIntoView({ behavior: 'smooth' });
  renderKoans();
  showToast('已筛选标签: ' + tag);
}

function closeModal() {
  document.getElementById('modalContainer').innerHTML = '';
  document.body.style.overflow = '';
  currentModalKoanId = null;
}

function showToast(msg) {
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { t.remove(); }, 2200);
}

function scrollToTop() { document.getElementById('top').scrollIntoView({ behavior: 'smooth' }); }

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); document.querySelector('.search-input').focus(); }
  if (e.key === 'r' && !e.ctrlKey && !e.metaKey && document.activeElement === document.body) randomDaily();
});

// Init - forced reset of filter state
activeCollection = 'all';
activeScore = 0;
searchQuery = '';
setDailyKoan();
renderCollectionFilters();
renderScoreFilters();
renderKoans();
</script>
