行不是单向答案，而是关系与位置中的活用。", "score": 3}, {"id": "denglu-34", "collection": "灯录选粹", "collectionId": "denglu", "number": 34, "title": "法眼慧超", "source": "《碧岩录》第7则。", "story": "慧超问“如何是佛”，法眼答“汝是慧超”。他没有解释佛是什么，而把提\n问者送回自己。", "meaning": "向外找佛，不如回看当下这个问者。", "score": 4}, {"id": "denglu-35", "collection": "灯录选粹", "collectionId": "denglu", "number": 35, "title": "法眼曹源一滴水", "source": "法眼语录、《五灯会元》系统。", "story": "僧问“如何是曹源一滴水”，法眼答“是曹源一滴水”。他不另起解释，不\n添加玄妙意义，只将问题原样归还。", "meaning": "有时最直接的回答，就是不在原物之外另造意义。", "score": 3}, {"id": "denglu-36", "collection": "灯录选粹", "collectionId": "denglu", "number": 36, "title": "药山不许看经", "source": "药山惟俨语录系统。", "story": "药山常被问为何自己看经却不许学人死看经。差别不在经本身，而在\n是否被文字转。", "meaning": "经典可以开眼，也可以遮眼，关键在用心。", "score": 4}, {"id": "denglu-37", "collection": "灯录选粹", "collectionId": "denglu", "number": 37, "title": "沩山踢倒净瓶", "source": "《无门关》第40则。", "story": "百丈放净瓶问众人：不得叫作净瓶，叫作什么？首座用语言答，沩山\n直接踢倒净瓶而去。", "meaning": "面对语言陷阱，最好的回答有时是把问题本身踢翻。", "score": 4}, {"id": "denglu-38", "collection": "灯录选粹", "collectionId": "denglu", "number": 38, "title": "香严击竹", "source": "《五灯会元》香严智闲传记。", "story": "香严多年苦参不得，后来扫地时瓦砾击竹作声，忽然大悟。一个日常\n声音成了悟入契机。", "meaning": "悟道不一定发生在讲堂，也可能发生在扫地一声中。", "score": 5}, {"id": "denglu-39", "collection": "灯录选粹", "collectionId": "denglu", "number": 39, "title": "香严上树", "source": "《无门关》第5则。", "story": "人悬在树上，口衔树枝，手脚不能攀，树下有人问祖师西来意。开口\n就坠落，不答又辜负来问。", "meaning": "语言和沉默都无路时，才是真关口。", "score": 5}, {"id": "denglu-40", "collection": "灯录选粹", "collectionId": "denglu", "number": 40, "title": "仰山插锹", "source": "《从容录》第15则。", "story": "沩山问仰山田中多少人，仰山插下锹子，叉手而立。看似没有答，其\n实把劳作现场整个呈现出来。", "meaning": "不必离开眼前动作另求答案。", "score": 3}, {"id": "denglu-41", "collection": "灯录选粹", "collectionId": "denglu", "number": 41, "title": "刘铁磨", "source": "《碧岩录》第24则、《从容录》第60则系统。", "story": "刘铁磨是禅门著名女禅者，机锋刚烈，与诸师往来不让须眉。她的故\n事常以“台山”“牸牛”等语境出现。", "meaning": "禅门看见地，不以性别身份定高下。", "score": 4}, {"id": "denglu-42", "collection": "灯录选粹", "collectionId": "denglu", "number": 42, "title": "婆子烧庵", "source": "禅林故事传统。", "story": "婆子供养一位僧人多年，后来派女子试探他的境界。僧人只表现出枯\n木寒岩式的冷漠，婆子认为他没有活泼禅心，便烧庵逐僧。", "meaning": "禅不是冷漠无情；枯寂也可能是病。", "score": 5}, {"id": "denglu-43", "collection": "灯录选粹", "collectionId": "denglu", "number": 43, "title": "庞居士好雪片片", "source": "《碧岩录》第42则系统；庞蕴居士语录。", "story": "庞居士见雪，说“好雪片片，不落别处”。每一片雪都落在它的位置，没\n有一片落错。", "meaning": "万物各安其位，当下圆满无差。", "score": 5}, {"id": "denglu-44", "collection": "灯录选粹", "collectionId": "denglu", "number": 44, "title": "庞居士一家", "source": "庞蕴居士传记。", "story": "庞居士一家皆有禅机，女儿灵照尤其机敏。传说临终时，一家人以自\n在方式面对生死，显示居士禅的洒脱。", "meaning": "禅不只在寺院，也可在家庭与日常生活中活出。", "score": 4}, {"id": "denglu-45", "collection": "灯录选粹", "collectionId": "denglu", "number": 45, "title": "维摩默然", "source": "《维摩诘经》；亦见《碧岩录》第84则、《从容录》第48则系统。", "story": "诸菩萨各说不二法门，轮到维摩居士时，他默然无言。文殊赞叹：这\n才是真入不二法门。", "meaning": "真正不二处，语言不得其门而入。", "score": 5}, {"id": "denglu-46", "collection": "灯录选粹", "collectionId": "denglu", "number": 46, "title": "丹霞烧佛", "source": "丹霞天然传记、《五灯会元》。", "story": "丹霞天寒，劈木佛取暖。院主责问，他说要烧取舍利；院主说木佛哪\n有舍利，他便反问既无舍利，何妨再烧两尊。\n禅宗公案大全：灯录选粹与传播索引\n11", "meaning": "破除对形式的执著，但传播时必须说明不是鼓励毁坏佛像。", "score": 5}, {"id": "denglu-47", "collection": "灯录选粹", "collectionId": "denglu", "number": 47, "title": "首山竹篦", "source": "《无门关》第43则。", "story": "首山拈起竹篦问众：叫作竹篦则触，不叫竹篦则背，到底叫作什么？", "meaning": "语言命名本身会把人带入两难。", "score": 4}, {"id": "denglu-48", "collection": "灯录选粹", "collectionId": "denglu", "number": 48, "title": "芭蕉拄杖", "source": "《无门关》第44则。", "story": "芭蕉说，你有拄杖，我给你拄杖；你无拄杖，我夺你拄杖。听者在有\n无之间都无处安身。", "meaning": "有无两边都要放下。", "score": 4}, {"id": "denglu-49", "collection": "灯录选粹", "collectionId": "denglu", "number": 49, "title": "竿头进步", "source": "《无门关》第46则。", "story": "百尺竿头的人，已经站到极高处，如何还能更进一步？古德要求他在\n无路处再进。", "meaning": "最高处若被执著，仍是障碍。", "score": 5}, {"id": "denglu-50", "collection": "灯录选粹", "collectionId": "denglu", "number": 50, "title": "牛过窗棂", "source": "《无门关》第38则。", "story": "水牯牛过窗棂，头角四蹄都过去了，为什么尾巴过不得？大部分已过\n关，最后一点却卡住。", "meaning": "最后一丝细微执著，往往最难放下。", "score": 5}, {"id": "denglu-51", "collection": "灯录选粹", "collectionId": "denglu", "number": 51, "title": "瑞岩唤主人公", "source": "《无门关》第12则。", "story": "瑞岩每天自唤“主人公”，又自己答“喏”，并提醒自己“惺惺著，莫受人\n瞒”。", "meaning": "每日把自己叫醒，是最朴素有效的修行。", "score": 5}, {"id": "denglu-52", "collection": "灯录选粹", "collectionId": "denglu", "number": 52, "title": "倩女离魂", "source": "《无门关》第35则。", "story": "倩女魂魄离身，身体与魂魄分处两地。禅师借此问：哪个才是真的倩\n女？", "meaning": "身份、自我、身心关系并不像日常想象中那么确定。", "score": 4}, {"id": "denglu-53", "collection": "灯录选粹", "collectionId": "denglu", "number": 53, "title": "女子出定", "source": "《无门关》第42则。", "story": "文殊不能令一女子出定，而罔明菩萨一弹指便能使其出定。高位菩萨\n与下方菩萨形成反差。", "meaning": "作用不可以地位高低简单判断。", "score": 3}, {"id": "denglu-54", "collection": "灯录选粹", "collectionId": "denglu", "number": 54, "title": "国师无缝塔", "source": "《碧岩录》第18则、《从容录》第85则。", "story": "国师临终要皇帝造无缝塔。皇帝问塔样，国师沉默良久，表示真正归\n处不可图画。", "meaning": "最终归宿无形无相。", "score": 3}, {"id": "denglu-55", "collection": "灯录选粹", "collectionId": "denglu", "number": 55, "title": "外道问佛", "source": "《无门关》第32则、《碧岩录》第65则。", "story": "外道问佛，不问有言，不问无言。世尊只是静坐，外道却赞叹得入。", "meaning": "沉默不是无答，有时正是不落两边的回答。", "score": 4}, {"id": "denglu-56", "collection": "灯录选粹", "collectionId": "denglu", "number": 56, "title": "二僧卷帘", "source": "《无门关》第26则。", "story": "法眼指帘，两个僧人同去卷帘，法眼却说“一得一失”。动作完全相同，\n结果却不同。", "meaning": "禅看的是当下心机，不只看外在动作。", "score": 4}, {"id": "denglu-57", "collection": "灯录选粹", "collectionId": "denglu", "number": 57, "title": "三座说法", "source": "《无门关》第25则。", "story": "仰山梦见自己在弥勒处坐第三座，被请说法，只说大乘法离四句绝百\n非。", "meaning": "真正说法不是多说，而是使人离开固定判断。", "score": 3}, {"id": "denglu-58", "collection": "灯录选粹", "collectionId": "denglu", "number": 58, "title": "干峰一路", "source": "《无门关》第48则。", "story": "僧问十方诸佛一路涅槃门，路头在哪里。干峰用拄杖划一划，说在这\n里。", "meaning": "路头不在远方，就在当下一划。", "score": 3}, {"id": "denglu-59", "collection": "灯录选粹", "collectionId": "denglu", "number": 59, "title": "傅大士讲经", "source": "傅大士传灯系统；亦见《碧岩录》相关拈提。", "story": "傅大士受请讲《金刚经》，登座后拍案一下便下座。有人解释说，大士\n已经把经讲完了。", "meaning": "真正讲经不一定靠文字铺陈，一拍也可尽显。", "score": 5}, {"id": "denglu-60", "collection": "灯录选粹", "collectionId": "denglu", "number": 60, "title": "十六开士入浴", "source": "《碧岩录》第78则系统。", "story": "十六开士入浴，因触水而悟入。洗浴这种普通身体经验，成为他们体\n会法性的契机。\n禅宗公案大全：灯录选粹与传播索引\n14", "meaning": "身体感受、日常行为也可以是法门。", "score": 4}];

// Ink wash canvas animation
var canvas = document.getElementById('inkCanvas');
var ctx = canvas.getContext('2d');
var inkDrops = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function InkDrop() {
  this.reset = function() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.radius = Math.random() * 120 + 40;
    this.opacity = Math.random() * 0.04 + 0.01;
    this.speedX = (Math.random() - 0.5) * 0.15;
    this.speedY = (Math.random() - 0.5) * 0.1;
    this.life = 0;
    this.maxLife = 400 + Math.random() * 600;
    this.color = Math.random() > 0.6 ? '201,168,76' : '94,234,212';
  };
  this.update = function() {
    this.x += this.speedX;
    this.y += this.speedY;
    this.life++;
    if (this.life > this.maxLife) this.reset();
    if (this.x < -200 || this.x > canvas.width + 200 || this.y < -200 || this.y > canvas.height + 200) this.reset();
  };
  this.draw = function() {
    var fadePhase = Math.sin((this.life / this.maxLife) * Math.PI);
    var alpha = this.opacity * fadePhase;
    var gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
    gradient.addColorStop(0, 'rgba(' + this.color + ',' + (alpha * 1.5) + ')');
    gradient.addColorStop(0.5, 'rgba(' + this.color + ',' + (alpha * 0.5) + ')');
    gradient.addColorStop(1, 'rgba(' + this.color + ',0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fill();
  };
  this.reset();
}

for (var i = 0; i < 15; i++) inkDrops.push(new InkDrop());

function animateInk() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  inkDrops.forEach(function(d) { d.update(); d.draw(); });
  requestAnimationFrame(animateInk);
}
animateInk();

function createParticle() {
  var el = document.createElement('div');
  el.className = 'particle';
  el.textContent = zenChars[Math.floor(Math.random() * zenChars.length)];
  el.style.left = Math.random() * 90 + '%';
  el.style.animationDuration = (Math.random() * 20 + 15) + 's';
  el.style.animationDelay = Math.random() * 15 + 's';
  el.style.fontSize = (Math.random() * 20 + 10) + 'px';
  particlesContainer.appendChild(el);
  setTimeout(function() { el.remove(); }, 35000);
}

for (var i = 0; i < 12; i++) createParticle();
setInterval(createParticle, 3000);

// Daily koan
function setDailyKoan() {
  var today = new Date();
  var seed = today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();
  var idx = seed % KOANS.length;
  currentDaily = KOANS[idx];
  document.getElementById('dailyTitle').textContent = currentDaily.title;
  document.getElementById('dailyStory').textContent = currentDaily.story.length > 150 ? currentDaily.story.slice(0, 150) + '...' : currentDaily.story;
  document.getElementById('dailyCollection').textContent = currentDaily.collection;
  var stars = '';
  for (var i = 0; i < currentDaily.score; i++) stars += '★';
  for (var i = currentDaily.score; i < 5; i++) stars += '☆';
  document.getElementById('dailyScore').textContent = stars;
}

  }
  container.innerHTML = html;
  
  container.querySelectorAll('.score-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      setScore(parseInt(this.getAttribute('data-sc')));
    });
  });
}

function setCollection(c) {
  activeCollection = c;
  document.querySelectorAll('#collectionFilters .filter-btn').forEach(function(b) { b.classList.remove('active'); });
  document.querySelector('#collectionFilters [data-col="' + c + '"]').classList.add('active');
  filterKoans();
}

function setScore(s) {
  activeScore = s;
  document.querySelectorAll('#scoreFilters .score-btn').forEach(function(b) { b.classList.remove('active'); });
  document.querySelector('#scoreFilters [data-sc="' + s + '"]').classList.add('active');
  filterKoans();
}

function filterKoans() {
  searchQuery = document.getElementById('searchInput').value.toLowerCase();
  renderKoans();
}

function getFilteredKoans() {
  return KOANS.filter(function(k) {
    if (activeCollection !== 'all' && k.collection !== activeCollection) return false;
    if (activeScore > 0 && k.score !== activeScore) return false;
    if (searchQuery) {
      var q = searchQuery;
      return (k.title && k.title.toLowerCase().indexOf(q) !== -1) ||
             (k.story && k.story.toLowerCase().indexOf(q) !== -1) ||
             (k.meaning && k.meaning.toLowerCase().indexOf(q) !== -1) ||
             (k.source && k.source.toLowerCase().indexOf(q) !== -1) ||
             (k.collection && k.collection.toLowerCase().indexOf(q) !== -1);
    }
    return true;
  });
}

function renderKoans() {
  var filtered = getFilteredKoans();
  var grid = document.getElementById('koansGrid');
  var countEl = document.getElementById('resultsCount');
  
  countEl.textContent = '共 ' + filtered.length + ' 则公案';
  
  var html = '';
  filtered.forEach(function(k) {
    var scoreDots = '';
    for (var i = 0; i < 5; i++) {
      var cls = i < k.score ? (k.score >= 4 ? 'filled high' : 'filled') : '';
      scoreDots += '<div class="score-dot ' + cls + '"></div>';
    }
    var storyPreview = k.story.length > 100 ? k.story.slice(0, 100) + '...' : k.story;
    html += '<div class="koan-card" data-koan-id="' + k.id + '">' +
      '<div class="card-header">' +
        '<span class="card-num">#' + k.number + '</span>' +
        '<div class="card-score">' + scoreDots + '</div>' +
      '</div>' +
      '<h3>' + escapeHtml(k.title) + '</h3>' +
      '<p class="card-story">' + escapeHtml(storyPreview) + '</p>' +
      '<div class="card-collection">' + escapeHtml(k.collection) + '</div>' +
    '</div>';
  });
  grid.innerHTML = html;
  
  // Add click handlers to all cards
  grid.querySelectorAll('.koan-card').forEach(function(card) {
    card.addEventListener('click', function() {
      var kid = this.getAttribute('data-koan-id');
      openKoanDetail(kid);
    });
  });
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

function openKoanDetail(id) {
  var k = koanMap[id];
  if (!k) return;
  
  var scoreDots = '';
  for (var i = 0; i < 5; i++) {
    var cls = i < k.score ? 'filled' : '';
    scoreDots += '<div class="dot ' + cls + '"></div>';
  }
  
  var modalHtml = '<div class="modal-overlay">' +
    '<div class="modal">' +
      '<button class="modal-close" id="modalCloseBtn">✕</button>' +
      '<div class="modal-collection">' + escapeHtml(k.collection) + ' · 第' + k.number + '则</div>' +
      '<h2>' + escapeHtml(k.title) + '</h2>' +
      '<div class="modal-source">' + escapeHtml(k.source || '') + '</div>' +
      '<div class="modal-section">' +
        '<h4>故事梗概</h4>' +
        '<p>' + escapeHtml(k.story) + '</p>' +
      '</div>' +
      '<div class="modal-section">' +
        '<h4>故事意义</h4>' +
        '<p>' + escapeHtml(k.meaning || '——') + '</p>' +
      '</div>' +
      '<div class="modal-score">' +
        '<span style="color:var(--text-dim);font-size:12px;letter-spacing:2px;">传播评分</span>' +
        '<div class="dots">' + scoreDots + '</div>' +
        '<span style="color:var(--gold-dim);font-size:13px;">' + k.score + '/5</span>' +
      '</div>' +
    '</div>' +
  '</div>';
  
  document.getElementById('modalContainer').innerHTML = modalHtml;
  document.body.style.overflow = 'hidden';
  
  // Close handlers
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.querySelector('.modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
}

function closeModal() {
  document.getElementById('modalContainer').innerHTML = '';
  document.body.style.overflow = '';
}

function showToast(msg) {
  var toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(function() { toast.remove(); }, 2200);
}

function scrollToTop() {
  document.getElementById('top').scrollIntoView({ behavior: 'smooth' });
}

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    document.querySelector('.search-input').focus();
  }
  if (e.key === 'r' && !e.ctrlKey && !e.metaKey && document.activeElement === document.body) {
    randomDaily();
  }
});

// Init
setDailyKoan();
renderCollectionFilters();
renderScoreFilters();
renderKoans();
</script>
</body>
</html>
